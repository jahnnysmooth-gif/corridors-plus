function _openLogTodayModal(floors) {
    const t   = today();
    const yes = yesterday();

    const calIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
    let rows = floors.map((floor, fi) => {
        const itemRows = floor.items.map((item, idx) => `
            <div class="daily-row">
                <div class="daily-row-label">${item.name}</div>
                <div class="form-row">
                    <div class="form-group" style="margin-bottom:0">
                        <label>Skilled</label>
                        <input type="number" min="0" id="lt_s_${fi}_${idx}" placeholder="—" />
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label>Skld Hrs</label>
                        <input type="number" min="0.5" step="0.5" id="lt_sh_${fi}_${idx}" placeholder="—" />
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label>Laborer</label>
                        <input type="number" min="0" id="lt_l_${fi}_${idx}" placeholder="—" />
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label>Lab Hrs</label>
                        <input type="number" min="0.5" step="0.5" id="lt_lh_${fi}_${idx}" placeholder="—" />
                    </div>
                </div>
            </div>`).join('');
        return `<div class="daily-floor-header">${floor.name}</div>${itemRows}`;
    }).join('');

    openModal("Log Today's Hours", `
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
            <button class="date-chip active" id="lt_chip_today"     onclick="setLtDate('${t}')">Today</button>
            <button class="date-chip"        id="lt_chip_yesterday" onclick="setLtDate('${yes}')">Yesterday</button>
            <button class="cal-btn"          id="lt_chip_other"     onclick="toggleLtPicker()">${calIcon}</button>
        </div>
        <div class="date-picker-wrap" id="lt_picker_wrap">
            <input type="date" id="lt_date_picker" onchange="setLtDateFromPicker(this.value)" style="margin-bottom:10px" />
        </div>
        <input type="hidden" id="lt_date" value="${t}" />
        <p style="font-size:13px;color:#999;margin-bottom:6px">Leave blank for items not worked today.</p>
        ${rows}
    `, () => {
        const date = document.getElementById('lt_date').value;
        let saved  = 0;
        floors.forEach((floor, fi) => {
            floor.items.forEach((item, idx) => {
                const skilled      = parseFloat(document.getElementById(`lt_s_${fi}_${idx}`)?.value)  || 0;
                const skilledHours = parseFloat(document.getElementById(`lt_sh_${fi}_${idx}`)?.value) || 0;
                const laborer      = parseFloat(document.getElementById(`lt_l_${fi}_${idx}`)?.value)  || 0;
                const laborerHours = parseFloat(document.getElementById(`lt_lh_${fi}_${idx}`)?.value) || 0;
                const mh = skilled * skilledHours + laborer * laborerHours;
                if (skilledHours > 0 && skilled <= 0) { alert(`${item.name}: enter a Skilled worker count.`); return; }
                if (laborerHours > 0 && laborer <= 0) { alert(`${item.name}: enter a Laborer worker count.`); return; }
                if (skilled > 0 && skilledHours <= 0) { alert(`${item.name}: enter hours for Skilled workers.`); return; }
                if (laborer > 0 && laborerHours <= 0) { alert(`${item.name}: enter hours for Laborer workers.`); return; }
                if (mh > 0) {
                    item.hoursLog.push({ date, skilled, skilledHours, laborer, laborerHours });
                    if ((item.status || 'pending') === 'pending') item.status = 'active';
                    saved++;
                }
            });
        });
        if (saved === 0) { alert('Fill in at least one item.'); return; }
        persist(); closeModal(); render();
    });
}

function setLtDate(val) {
    const input = document.getElementById('lt_date');
    if (input) input.value = val;
    const t   = today();
    const yes = yesterday();
    document.getElementById('lt_chip_today')?.classList.toggle('active', val === t);
    document.getElementById('lt_chip_yesterday')?.classList.toggle('active', val === yes);
    const other = document.getElementById('lt_chip_other');
    if (val !== t && val !== yes) {
        other?.classList.add('active');
    } else {
        other?.classList.remove('active');
        document.getElementById('lt_picker_wrap')?.classList.remove('open');
    }
}

function toggleLtPicker() {
    const wrap = document.getElementById('lt_picker_wrap');
    if (wrap) wrap.classList.toggle('open');
}

function setLtDateFromPicker(val) {
    if (val) { setLtDate(val); document.getElementById('lt_picker_wrap')?.classList.remove('open'); }
}

function editMatDay(matId, date) {
    const mat       = state.materials.find(m => m.id === matId);
    const delivQty  = (mat.log||[]).filter(e => e.type === 'delivery' && e.date === date).reduce((s,e) => s+e.qty, 0);
    const usageQty  = (mat.log||[]).filter(e => e.type === 'usage'    && e.date === date).reduce((s,e) => s+e.qty, 0);
    const usageEntry = (mat.log||[]).find(e => e.type === 'usage' && e.date === date);
    const floorId   = usageEntry?.floorId || '';
    const itemId    = usageEntry?.itemId  || '';
    const selFloor  = (state.floors||[]).find(f => f.id === floorId);
    const floorOpts = `<option value="">General / All Floors</option>` +
        (state.floors||[]).map(f => `<option value="${f.id}"${f.id === floorId ? ' selected' : ''}>${f.name}</option>`).join('');
    const itemOpts  = selFloor
        ? `<option value="">No specific item</option>` + (selFloor.items||[]).map(i => `<option value="${i.id}"${i.id === itemId ? ' selected' : ''}>${i.name}</option>`).join('')
        : `<option value="">— select floor first —</option>`;
    openModal(`Edit ${displayDate(date)} — ${mat.name}`, `
        <div class="form-group">
            <label>Delivery (${mat.unit})</label>
            <input id="edit_deliv" type="number" min="0" step="1" value="${delivQty || ''}" placeholder="0" />
        </div>
        <div class="form-group">
            <label>Used (${mat.unit})</label>
            <input id="edit_usage" type="number" min="0" step="1" value="${usageQty || ''}" placeholder="0" />
        </div>
        <div class="form-group">
            <label>Floor</label>
            <select id="edit_floor" onchange="updateEditItemSel()">${floorOpts}</select>
        </div>
        <div class="form-group">
            <label>Work Item <span style="font-weight:400;color:#aaa">(optional)</span></label>
            <select id="edit_item">${itemOpts}</select>
        </div>
        <p style="font-size:12px;color:#999;margin-top:4px">Existing entries for this date will be replaced.</p>
    `, () => {
        const newDeliv = parseFloat(document.getElementById('edit_deliv').value);
        const newUsage = parseFloat(document.getElementById('edit_usage').value);
        const newFloor = document.getElementById('edit_floor').value || undefined;
        const newItem  = document.getElementById('edit_item').value  || undefined;
        mat.log = (mat.log||[]).filter(e => e.date !== date);
        if (!isNaN(newDeliv) && newDeliv > 0) mat.log.push({ id: uid(), date, type: 'delivery', qty: newDeliv });
        if (!isNaN(newUsage) && newUsage > 0) {
            const entry = { id: uid(), date, type: 'usage', qty: newUsage };
            if (newFloor) entry.floorId = newFloor;
            if (newItem)  entry.itemId  = newItem;
            mat.log.push(entry);
        }
        persist(); closeModal(); render();
    });
}

function _buildMatLogModal(title, matId) {
    const mats = Array.isArray(matId)
        ? state.materials.filter(m => matId.includes(m.id))
        : matId
            ? state.materials.filter(m => m.id === matId)
            : state.materials;
    const t = today(), yes = yesterday();
    const rows = mats.map((mat, i) => `
        <div class="daily-row">
            <div class="daily-row-label">${mat.name} <span style="color:#aaa;font-size:12px">(${mat.unit})</span></div>
            <div class="form-group" style="margin-bottom:0">
                <input type="number" min="0" step="1" id="mat_qty_${i}" placeholder="qty" style="width:100%" />
            </div>
        </div>`).join('');
    openModal(title, `
        <div style="display:flex;gap:8px;margin-bottom:12px">
            <button class="date-chip active" id="mchip_today" onclick="setMatDate('${t}')">Today</button>
            <button class="date-chip" id="mchip_yesterday" onclick="setMatDate('${yes}')">Yesterday</button>

        <input type="hidden" id="mat_date" value="${t}" />
        <p style="font-size:13px;color:#999;margin-bottom:10px">Leave blank for materials not affected.</p>
        ${rows}
    `, () => {
        const date = document.getElementById('mat_date').value;
        let saved = 0;
        mats.forEach((mat, i) => {
            const val = parseFloat(document.getElementById(`mat_qty_${i}`)?.value);
            if (!isNaN(val) && val > 0) {
                if (!mat.log) mat.log = [];
                mat.log.push({ id: uid(), date, type: 'delivery', qty: val });
                saved++;

        });
        if (saved === 0) { alert('Enter at least one quantity.'); return; }
        persist(); closeModal(); render();
    });
}

function applyMatFilter() {
    const q = _matSearch.trim().toLowerCase();
    // Update clear button visibility
    const clearBtn = document.querySelector('.mat-search-clear');
    if (clearBtn) clearBtn.style.display = q ? '' : 'none';

    const tradeGrid     = document.getElementById('mat_trade_grid');
    const searchResults = document.getElementById('mat_search_results');
    const cardList      = document.getElementById('mat_card_list');

    if (tradeGrid) {
        // Main view: toggle trade grid vs flat search results
        if (q) {
            tradeGrid.style.display = 'none';
            searchResults.style.display = '';
            const cards = searchResults.querySelectorAll('.mat-card[data-mat-name]');
            let visible = 0;
            cards.forEach(c => {
                const show = c.dataset.matName.includes(q);
                c.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            const noRes = document.getElementById('mat_no_results');
            if (noRes) noRes.style.display = visible === 0 ? '' : 'none';
        } else {
            tradeGrid.style.display = '';
            searchResults.style.display = 'none';
        }
    } else if (cardList) {
        // Trade drill-down: filter visible cards
        cardList.querySelectorAll('.mat-card[data-mat-name]').forEach(c => {
            c.style.display = !q || c.dataset.matName.includes(q) ? '' : 'none';
        });
    }
}

    const el = document.getElementById('mat_date');
    if (el) el.value = val;
    const t = today(), yes = yesterday();
    document.getElementById('mchip_today')?.classList.toggle('active', val === t);

function toggleSelectMode() {
    _selectMode = !_selectMode;
    _selectedIds.clear();
    render();
}

function toggleFloorSelect(floorId) {
    if (_selectedIds.has(floorId)) _selectedIds.delete(floorId);
    else _selectedIds.add(floorId);
    render();
}

function toggleSelectAll() {
    const allIds = state.floors.map(f => f.id);
    if (allIds.every(id => _selectedIds.has(id))) {
        _selectedIds.clear();
    } else {
        allIds.forEach(id => _selectedIds.add(id));
    }
    render();
}

function deleteSelectedFloors() {
    const n = _selectedIds.size;
    if (!confirm(`Delete ${n} floor${n !== 1 ? 's' : ''} and all their data? This cannot be undone.`)) return;
    state.floors = state.floors.filter(f => !_selectedIds.has(f.id));
    _selectedIds.clear();
    _selectMode = false;
    persist(); render();
}

// ── Backup / Restore ──────────────────────────────────────────────────────────
function backupData() {
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `hallway_backup_${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem('hallway_last_backup', today());
    render();
}

function restoreData(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.floors) throw new Error('Invalid file');
            if (!confirm(`This will replace all current data with the backup. Continue?`)) return;
            state = data;
            if (!state.materials) state.materials = [];
            (state.floors || []).forEach(f => { (f.items || []).forEach(i => { if (!i.hoursLog) i.hoursLog = []; }); });
            persist();
            render();
            alert('Data restored successfully.');
        } catch {
            alert('Invalid backup file. Please select a valid .json backup.');
        }
        input.value = '';
    };
    reader.readAsText(file);
}

// ── Export ────────────────────────────────────────────────────────────────────
function toCSV(rows) {
    return rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
}

function downloadCSV(csv, filename) {
    const blob = new Blob([csv], { type: 'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
}

function openExportModal() {
    const floorOptions = state.floors.map(f =>
        `<option value="${f.id}"${view.floorId === f.id ? ' selected' : ''}>${f.name}</option>`
    ).join('');
    const defaultAll = !view.floorId ? ' selected' : '';

    openModal('Export Labor Report', `
        <div class="form-group">
            <label>Floor</label>
            <select id="exp_floor">
                <option value="all"${defaultAll}>All Floors</option>
                ${floorOptions}
            </select>
        </div>
        <div class="form-group">
            <label>Format</label>
            <select id="exp_format">
                <option value="pdf">PDF (Print / Save)</option>
                <option value="csv">CSV (Spreadsheet)</option>
                <option value="summary">Cross-Floor Summary (PDF)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Report Period</label>
            <select id="exp_period" onchange="updateExportFields()">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
        </div>
        <div id="exp_fields">
            <div class="form-group"><label>Date</label><input id="exp_date" type="date" value="${today()}" /></div>
        </div>
    `, () => {
        const period = document.getElementById('exp_period').value;
        let start, end, label;

        if (period === 'daily') {
            const d = document.getElementById('exp_date').value;
            start = d; end = d; label = d;
        } else if (period === 'weekly') {
            const d   = new Date(document.getElementById('exp_week').value + 'T00:00:00');
            const day = d.getDay();
            const sun = new Date(d); sun.setDate(d.getDate() - day);
            const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
            start = sun.toISOString().slice(0, 10);
            end   = sat.toISOString().slice(0, 10);
            label = `week_${start}`;
        } else {
            const val = document.getElementById('exp_month').value;
            start = `${val}-01`;
            const last = new Date(val.split('-')[0], val.split('-')[1], 0);
            end   = last.toISOString().slice(0, 10);
            label = val;
        }

        const format   = document.getElementById('exp_format').value;
        const floorSel = document.getElementById('exp_floor').value;
        const floors   = floorSel === 'all' ? state.floors
                                             : state.floors.filter(f => f.id === floorSel);
        const inRange  = d => d >= start && d <= end;

        if (format === 'summary') {
            let periodLabel;
            if (period === 'weekly') periodLabel = `Week of ${shortDate(start)} - ${shortDate(end)}`;
            else if (period === 'monthly') { const [y,m]=start.split('-'); const mo=['January','February','March','April','May','June','July','August','September','October','November','December']; periodLabel=`${mo[parseInt(m)-1]} ${y}`; }
            else periodLabel = shortDate(start);
            exportCrossFloorSummary(state.floors, inRange, periodLabel);
        } else if (format === 'pdf') {
            exportPDF(floors, inRange, label, start, end, period);
        } else {
            const prefix = floorSel === 'all' ? 'all-floors' : floors[0].name.replace(/\s+/g, '-');
            const rows   = [['FLOOR', 'ITEM', 'DATE', 'SKILLED', 'SKILLED HRS', 'LABORER', 'LABORER HRS', 'MAN-HOURS']];
            floors.forEach(floor => {
                floor.items.forEach(item => {
                    const entries = item.hoursLog.filter(h => inRange(h.date));
                    if (entries.length === 0) return;
                    entries.forEach(h => {
                        const d = entryDisplay(h);
                        rows.push([floor.name, item.name, displayDate(h.date),
                            d.skilled, d.skilledHours, d.laborer, d.laborerHours, entryManHours(h)]);
                    });
                    const total  = entries.reduce((s, h) => s + entryManHours(h), 0);
                    const sk = entries.reduce((s, h) => s + entrySkilledMH(h), 0);
                    const lb = entries.reduce((s, h) => s + entryLaborerMH(h), 0);
                    rows.push([floor.name, item.name.toUpperCase() + ' — TOTAL', '', '', sk, '', lb, total]);
                    rows.push(['', '', '', '', '', '', '', '']);
                });
            });
            downloadCSV(toCSV(rows), `${prefix}-labor-${label}.csv`);
        }
        closeModal();
    });
}

function shortDate(iso) {
    const [y, m, d] = iso.split('-');
    return `${m}/${d}/${y.slice(2)}`;
}

function exportPDF(floors, inRange, label, start, end, period) {
    let periodLabel;
    if (period === 'weekly') {
        periodLabel = `Week of ${shortDate(start)} - ${shortDate(end)}`;
    } else if (period === 'monthly') {
        const [y, m] = start.split('-');
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        periodLabel = `${months[parseInt(m)-1]} ${y}`;
    } else {
        periodLabel = shortDate(start);
    }

    const isMulti    = floors.length > 1;
    const reportTitle = isMulti ? 'All Floors Labor Report' : `${floors[0].name} Labor Report`;
    let   bodyHtml   = '';
    let   overallTotal = 0, overallSk = 0, overallLb = 0;

    floors.forEach((floor, fi) => {
        let tableRows = '';
        let floorTotal = 0, floorSk = 0, floorLb = 0;

        floor.items.forEach(item => {
            const entries = item.hoursLog.filter(h => inRange(h.date));
            if (entries.length === 0) return;

            entries.forEach((h, hi) => {
                const d  = entryDisplay(h);
                const mh = entryManHours(h);
                const firstRow = hi === 0 ? ' class="item-first-row"' : '';
                tableRows += `<tr${firstRow}>
                    <td>${item.name}</td>
                    <td>${displayDate(h.date)}</td>
                    <td>${d.skilled}</td>
                    <td>${d.skilledHours}</td>

                    <td>${mh}</td>
                    <td style="color:#666;font-size:10px">${h.note || ''}</td>
                </tr>`;
            });

            const total = entries.reduce((s, h) => s + entryManHours(h), 0);
            const sk    = entries.reduce((s, h) => s + entrySkilledMH(h), 0);
            const lb    = entries.reduce((s, h) => s + entryLaborerMH(h), 0);
            floorTotal += total; floorSk += sk; floorLb += lb;
            tableRows += `<tr class="total-row">
                <td colspan="2">${item.name.toUpperCase()} — TOTAL</td>
                <td>—</td>
                <td>${sk}</td>
                <td>—</td>
                <td>${lb}</td>
                <td>${total}</td>
                <td></td>
            </tr>`;
        });

        if (!tableRows) return;
        overallTotal += floorTotal; overallSk += floorSk; overallLb += floorLb;

        const pageBreak = (isMulti && fi > 0) ? 'page-break-before:always;padding-top:24px;' : '';
        bodyHtml += `

        </div>`;
    });

    if (!bodyHtml) {
        alert('No hours logged for this period.');
        return;
    }

    const grandLine = isMulti
        ? `<div class="grand-total">GRAND TOTAL (ALL FLOORS): ${overallTotal} MAN-HOURS &nbsp;·&nbsp; Skilled: ${overallSk} &nbsp;·&nbsp; Laborer: ${overallLb}</div>`
        : `<div class="grand-total">GRAND TOTAL: ${overallTotal} MAN-HOURS &nbsp;·&nbsp; Skilled: ${overallSk} &nbsp;·&nbsp; Laborer: ${overallLb}</div>`;

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${reportTitle}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; font-size: 12px; color: #111; padding: 32px; }
        .header { margin-bottom: 24px; }
        .header h1 { font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #1a3a5c; }
        .header .meta { font-size: 12px; color: #666; margin-top: 4px; }
        .floor-heading { font-size: 15px; font-weight: 800; text-transform: uppercase; color: #1a3a5c; margin-bottom: 8px; border-top: 2px solid #1a3a5c; padding-bottom: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        thead tr { background: #1a3a5c; color: white; }
        thead th { padding: 9px 10px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        tbody tr:nth-child(even) { background: #f5f8ff; }

// ── Daily Notes screen ────────────────────────────────────────────────────────
let _dnDate = null; // null means today

function renderDailyNotes() {
    const date = _dnDate || today();
    const isToday = date === today();
    const isYest  = date === (() => { const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); })();
    const notes   = (state.reports || {})[date]?.notes || '';

    return `
    <div style="display:flex;gap:8px;margin-bottom:16px">
        <button onclick="_dnDate=null;document.getElementById('app').innerHTML=renderDailyNotes()"
            style="padding:8px 18px;border-radius:99px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:${isToday?'#1a3a5c':'#e5e7eb'};color:${isToday?'white':'#555'}">Today</button>
        <button onclick="_dnDate=(()=>{const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)})();document.getElementById('app').innerHTML=renderDailyNotes()"
            style="padding:8px 18px;border-radius:99px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:${isYest?'#1a3a5c':'#e5e7eb'};color:${isYest?'white':'#555'}">Yesterday</button>
        <input type="date" value="${date}" onchange="if(this.value){_dnDate=this.value;document.getElementById('app').innerHTML=renderDailyNotes()}"
            style="padding:8px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;color:#1a1a2e" />
    </div>
    <div style="text-align:center;font-size:13px;font-weight:700;color:#1a3a5c;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px">${displayDate(date)}</div>
    <div class="card" style="padding:0;overflow:hidden">
        <textarea id="dn_text" rows="16" placeholder="Write your notes for the day — observations, delays, scope changes, site conditions…"
            style="width:100%;padding:16px;border:none;outline:none;font-size:15px;line-height:1.7;resize:none;font-family:inherit;color:#1a1a2e;box-sizing:border-box">${notes.replace(/</g,'&lt;')}</textarea>
    </div>
    <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn btn-primary" style="flex:2" onclick="saveDailyNotes('${date}')">Save</button>
        <button class="btn btn-secondary" style="flex:2" onclick="printDailyNotes('${date}')">&#8681; Print</button>
        ${notes ? `<button class="btn btn-danger" style="flex:1" onclick="deleteDailyNotes('${date}')">Delete</button>` : ''}
    </div>`;
}

function saveDailyNotes(date) {
    const text = document.getElementById('dn_text')?.value || '';
    if (!state.reports) state.reports = {};
    if (!state.reports[date]) state.reports[date] = {};
    state.reports[date].notes = text.trim();
    persist();
    const btn = event.target;
    btn.textContent = 'Saved ✓';
    setTimeout(() => { btn.textContent = 'Save'; }, 1500);
}

function deleteDailyNotes(date) {
    if (!confirm('Delete notes for ' + displayDate(date) + '?')) return;
    if (state.reports?.[date]) {
        delete state.reports[date].notes;
        if (Object.keys(state.reports[date]).length === 0) delete state.reports[date];
    }
    persist();
    document.getElementById('app').innerHTML = renderDailyNotes();
}

function printDailyNotes(date) {
    const text = (document.getElementById('dn_text')?.value || (state.reports||{})[date]?.notes || '').trim();
    if (!text) { alert('No notes to print.'); return; }
    const dateStr = new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Daily Notes — ${dateStr}</title>
    <style>
        body{font-family:-apple-system,Arial,sans-serif;padding:40px;color:#111;max-width:720px;margin:0 auto}
        h1{font-size:20px;font-weight:800;color:#1a3a5c;margin:0}
        .sub{font-size:13px;color:#888;margin:4px 0 28px}
        .notes{font-size:15px;line-height:1.8;color:#1a1a2e;white-space:pre-wrap}
        .footer{margin-top:40px;font-size:11px;color:#bbb;border-top:1px solid #eee;padding-top:12px}
    </style></head><body>
    <h1>Daily Notes</h1>
    <div class="sub">${dateStr}</div>
    <div class="notes">${escaped}</div>
    <div class="footer">Corridor's Plus &nbsp;·&nbsp; Generated ${displayDate(today())}</div>
    <script>window.onload=()=>window.print();<\/script>
    </body></html>`;
    const blob = new Blob([html], {type:'text/html'});
    const url  = URL.createObjectURL(blob);
    window.open(url,'_blank');
    setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// ── Weekly summary export ─────────────────────────────────────────────────────
function exportWeeklySummary() {
    const { start, end } = getWeekRange();
    const inRange = d => d >= start && d <= end;
    const label   = `${displayDate(start)} – ${displayDate(end)}`;

    // ── Labor: man-hours per floor for entries in this week ──────────────────
    let laborHtml = '';
    let grandSkilled = 0, grandLaborer = 0;
    (state.floors || []).forEach(floor => {
        let fSkilled = 0, fLaborer = 0;
        (floor.items || []).forEach(item => {
            (item.hoursLog || []).filter(e => e.date >= start && e.date <= end).forEach(e => {
                fSkilled += entrySkilledMH(e);
                fLaborer += entryLaborerMH(e);
            });
        });
        if (fSkilled + fLaborer === 0) return;
        grandSkilled += fSkilled; grandLaborer += fLaborer;
        laborHtml += `<tr>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;font-weight:600">${floor.name}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:right">${fSkilled}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:right">${fLaborer}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:right;font-weight:700;color:#1a3a5c">${fSkilled + fLaborer}</td>
        </tr>`;
    });
    if (!laborHtml) laborHtml = `<tr><td colspan="4" style="padding:12px 10px;color:#aaa;font-style:italic">No hours logged this week.</td></tr>`;
    const laborSection = `
        <h2 style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:#1a3a5c;margin:24px 0 10px;border-top:2px solid #1a3a5c;padding-top:10px">Labor — Man-Hours by Floor</h2>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="background:#1a3a5c;color:white">
                <th style="padding:8px 10px;text-align:left">Floor</th>
                <th style="padding:8px 10px;text-align:right">Skilled MH</th>
                <th style="padding:8px 10px;text-align:right">Laborer MH</th>
                <th style="padding:8px 10px;text-align:right">Total MH</th>
            </tr></thead>
            <tbody>${laborHtml}
                <tr style="background:#f0f4ff">
                    <td style="padding:8px 10px;font-weight:800">Total</td>
                    <td style="padding:8px 10px;text-align:right;font-weight:700">${grandSkilled}</td>
                    <td style="padding:8px 10px;text-align:right;font-weight:700">${grandLaborer}</td>
                    <td style="padding:8px 10px;text-align:right;font-weight:800;color:#1a3a5c">${grandSkilled + grandLaborer}</td>
                </tr>
            </tbody>
        </table>`;

    // ── Worker hours this week ───────────────────────────────────────────────
    const crew = state.crew || [];
    const workerHoursMap = {};
    (state.attendance || []).filter(a => inRange(a.date)).forEach(a => {
        Object.entries(a.details || {}).forEach(([wid, detail]) => {
            if (!detail.hours) return;
            if (!workerHoursMap[wid]) workerHoursMap[wid] = 0;
            workerHoursMap[wid] += detail.hours;
        });
    });
    let workerHtml = '';
    const sortedWorkers = crew.filter(w => workerHoursMap[w.id]).sort((a,b) => crewSortOrder(a.trade) - crewSortOrder(b.trade));
    sortedWorkers.forEach(w => {
        workerHtml += `<tr>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;font-weight:600">${w.name}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;color:#888">${w.trade || '—'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:right;font-weight:700;color:#1a3a5c">${workerHoursMap[w.id]}</td>
        </tr>`;
    });
    const totalWorkerHours = Object.values(workerHoursMap).reduce((s,h)=>s+h,0);
    if (sortedWorkers.length > 0) {
        workerHtml += `<tr style="background:#f0f4ff">
            <td colspan="2" style="padding:8px 10px;font-weight:800">Total</td>
            <td style="padding:8px 10px;text-align:right;font-weight:800;color:#1a3a5c">${totalWorkerHours}</td>
        </tr>`;
    }
    if (!workerHtml) workerHtml = `<tr><td colspan="3" style="padding:12px 10px;color:#aaa;font-style:italic">No worker hours logged this week.</td></tr>`;
    const workerSection = `
        <h2 style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:#1a3a5c;margin:24px 0 10px;border-top:2px solid #1a3a5c;padding-top:10px">Worker Hours</h2>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="background:#1a3a5c;color:white">
                <th style="padding:8px 10px;text-align:left">Name</th>
                <th style="padding:8px 10px;text-align:left">Trade</th>
                <th style="padding:8px 10px;text-align:right">Hours</th>
            </tr></thead>
            <tbody>${workerHtml}</tbody>
        </table>`;

    // ── Materials: usage by trade this week ──────────────────────────────────
    const byTrade = {};
    (state.materials || []).forEach(mat => {
        const weekUsage = (mat.log || []).filter(e => e.type === 'usage' && inRange(e.date));
        if (weekUsage.length === 0) return;
        const total = weekUsage.reduce((s, e) => s + e.qty, 0);
        const trade = mat.trade || 'Other';
        if (!byTrade[trade]) byTrade[trade] = [];
        byTrade[trade].push({ name: mat.name, unit: mat.unit, total });
    });
    const tradeKeys = TRADE_ORDER.filter(t => byTrade[t]);
    Object.keys(byTrade).forEach(t => { if (!TRADE_ORDER.includes(t)) tradeKeys.push(t); });
    let matHtml = '';
    tradeKeys.forEach(trade => {
        matHtml += `<tr style="background:#f5f5f5"><td colspan="3" style="padding:6px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:#555">${trade}</td></tr>`;
        byTrade[trade].forEach(m => {
            matHtml += `<tr><td style="padding:7px 10px 7px 18px;border-bottom:1px solid #eee">${m.name}</td><td style="padding:7px 10px;border-bottom:1px solid #eee;text-align:right;font-weight:700;color:#1a3a5c">${m.total}</td><td style="padding:7px 10px;border-bottom:1px solid #eee;color:#999">${m.unit}</td></tr>`;
        });
    });
    if (!matHtml) matHtml = `<tr><td colspan="3" style="padding:12px 10px;color:#aaa;font-style:italic">No material usage logged this week.</td></tr>`;
    const matSection = `
        <h2 style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:#1a3a5c;margin:24px 0 10px;border-top:2px solid #1a3a5c;padding-top:10px">Materials Used This Week</h2>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="background:#1a3a5c;color:white">
                <th style="padding:8px 10px;text-align:left">Material</th>
                <th style="padding:8px 10px;text-align:right">Used</th>
                <th style="padding:8px 10px;text-align:left">Unit</th>
            </tr></thead>
            <tbody>${matHtml}</tbody>
        </table>`;

    // ── Low stock ────────────────────────────────────────────────────────────
    const isLow = m => { const s = matCurrentStock(m); return s !== null && m.parQty > 0 && s < m.parQty; };
    const lowMats = (state.materials || []).filter(isLow);
    let lowHtml = lowMats.length === 0
        ? `<p style="color:#aaa;font-style:italic;font-size:13px">All materials above minimum stock.</p>`
        : lowMats.map(m => {
            const s = matCurrentStock(m);
            return `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:13px">
                <span style="font-weight:600;color:#1a1a2e">${m.name} <span style="font-weight:400;color:#888">(${m.trade||''})</span></span>
                <span style="color:#dc2626;font-weight:700">${s} / ${m.parQty} ${m.unit}${m.reorderQty > 0 ? ' — order ' + m.reorderQty : ''}</span>
            </div>`;
          }).join('');
    const lowSection = `
        <h2 style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:#dc2626;margin:24px 0 10px;border-top:2px solid #dc2626;padding-top:10px">⚠ Low Stock</h2>
        ${lowHtml}`;

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Weekly Summary</title>
    <style>* { box-sizing:border-box; margin:0; padding:0; } body { font-family:Arial,sans-serif; font-size:13px; color:#111; padding:28px; max-width:700px; margin:0 auto; }
    h1 { font-size:20px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#1a3a5c; margin-bottom:4px; }
    .meta { font-size:12px; color:#666; margin-bottom:8px; }
    tbody tr:nth-child(even) td { background:#f9fbff; }
    @media print { body { padding:16px; } }</style></head><body>
    <h1>Corridor's Plus — Weekly Summary</h1>
    <div class="meta">Week of ${label}</div>
    <div class="meta">Generated: ${displayDate(today())}</div>
    ${workerSection}${laborSection}${matSection}${lowSection}
    <script>window.onload = () => window.print();<\/script></body></html>`;

    window.open(URL.createObjectURL(new Blob([html], { type: 'text/html' })), '_blank');
}

// ── Materials export ──────────────────────────────────────────────────────────
function openMaterialsExportModal() {
    openModal('Export Materials Report', `
        <div class="form-group">
            <label>Format</label>
            <select id="mexp_format">
                <option value="pdf">PDF (Print / Save)</option>
                <option value="csv">CSV (Spreadsheet)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Report Period</label>
            <select id="mexp_period" onchange="updateMatExportFields()">
                <option value="all">All Time</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
        </div>
        <div id="mexp_fields"></div>
    `, () => {
        const format = document.getElementById('mexp_format').value;
        const period = document.getElementById('mexp_period').value;
        let start, end, label;

        if (period === 'daily') {
            const d = document.getElementById('mexp_date').value;
            start = d; end = d; label = displayDate(d);
        } else if (period === 'weekly') {
            const d   = new Date(document.getElementById('mexp_week').value + 'T00:00:00');
            const day = d.getDay();
            const sun = new Date(d); sun.setDate(d.getDate() - day);
            const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
            start = sun.toISOString().slice(0,10);
            end   = sat.toISOString().slice(0,10);
            label = `${displayDate(start)} – ${displayDate(end)}`;
        } else if (period === 'monthly') {
            const val = document.getElementById('mexp_month').value;
            start = `${val}-01`;
            const last = new Date(val.split('-')[0], val.split('-')[1], 0);
            end   = last.toISOString().slice(0,10);
            const mo = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            label = `${mo[parseInt(val.split('-')[1])-1]} ${val.split('-')[0]}`;
        } else {
            start = '2000-01-01'; end = '2099-12-31'; label = 'All Time';
        }

        const inRange = d => d >= start && d <= end;
        if (format === 'pdf') exportMaterialsPDF(inRange, label);
        else exportMaterialsCSV(inRange, label);
    });
}

function updateMatExportFields() {
    const period = document.getElementById('mexp_period').value;
    const el = document.getElementById('mexp_fields');
    if (period === 'daily')   el.innerHTML = `<div class="form-group"><label>Date</label><input id="mexp_date" type="date" value="${today()}" /></div>`;
    else if (period === 'weekly')  el.innerHTML = `<div class="form-group"><label>Any date in the week</label><input id="mexp_week" type="date" value="${today()}" /></div>`;
    else if (period === 'monthly') el.innerHTML = `<div class="form-group"><label>Month</label><input id="mexp_month" type="month" value="${today().slice(0,7)}" /></div>`;
    else el.innerHTML = '';
}

function _matLogInRange(mat, inRange) {
    return (mat.log||[])
        .filter(e => (e.type === 'delivery' || e.type === 'adjust') && inRange(e.date))
        .sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
}

function exportMaterialsPDF(inRange, label) {
    const mats = state.materials.filter(m => _matLogInRange(m, inRange).length > 0);
    if (mats.length === 0) { alert('No data in this period.'); return; }

    let bodyHtml = '';
    mats.forEach(mat => {
        const entries = _matLogInRange(mat, inRange);
        if (entries.length === 0) return;
        const totalDel = entries.filter(e => e.type === 'delivery').reduce((s,e) => s+e.qty, 0);
        const rows = [...entries].reverse().map(e => {
            const isAdj = e.type === 'adjust';
            return `<tr>
                <td>${displayDate(e.date)}</td>
                <td>${isAdj ? '—' : '+'+e.qty}</td>
                <td>${isAdj ? '= '+e.qty : '—'}</td>
            </tr>`;
        }).join('');
        bodyHtml += `<div style="margin-bottom:32px">
            <div style="font-size:15px;font-weight:800;text-transform:uppercase;color:#1a3a5c;border-top:2px solid #1a3a5c;padding-top:6px;margin-bottom:8px">
                ${mat.name} <span style="font-weight:400;font-size:12px;color:#666">(${mat.unit})</span>
                ${mat.trade ? `<span style="font-weight:400;font-size:12px;color:#999"> · ${mat.trade}</span>` : ''}
            </div>
            <table style="width:100%;border-collapse:collapse;font-size:12px">
                <thead><tr style="background:#1a3a5c;color:white">
                    <th style="padding:8px 10px;text-align:left">Date</th>
                    <th style="padding:8px 10px;text-align:left">Delivered</th>
                    <th style="padding:8px 10px;text-align:left">Count Update</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
            <div style="text-align:right;margin-top:8px;font-size:13px;font-weight:700;color:#1a3a5c">
                Total Delivered: ${totalDel} ${mat.unit}
            </div>
        </div>`;
    });

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Material Report</title>
    <style>* { box-sizing:border-box; margin:0; padding:0; } body { font-family:Arial,sans-serif; font-size:12px; color:#111; padding:32px; }
    h1 { font-size:20px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#1a3a5c; margin-bottom:4px; }
    .meta { font-size:12px; color:#666; margin-bottom:24px; }
    tbody tr:nth-child(even) { background:#f5f8ff; } tbody td { padding:7px 10px; border-bottom:1px solid #eee; }
    @media print { body { padding:16px; } }</style></head><body>
    <h1>Corridor's Plus — Material Inventory Report</h1>
    <div class="meta">Period: ${label} &nbsp;·&nbsp; Generated: ${displayDate(today())}</div>
    ${bodyHtml}
    <script>window.onload = () => window.print();<\/script></body></html>`;

    window.open(URL.createObjectURL(new Blob([html], { type: 'text/html' })), '_blank');
}

function exportMaterialsCSV(inRange, label) {
    const rows = [['MATERIAL', 'UNIT', 'TRADE', 'DATE', 'EVENT', 'QTY']];
    state.materials.forEach(mat => {
        _matLogInRange(mat, inRange).forEach(e => {
            rows.push([mat.name, mat.unit, mat.trade || '', displayDate(e.date), e.type === 'adjust' ? 'Count Update' : 'Delivery', e.qty]);
        });
    });
    if (rows.length === 1) { alert('No data in this period.'); return; }
    const csv  = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const name = `materials_${label.replace(/[^a-z0-9]/gi,'_')}.csv`;
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = name;
    a.click();
}

function updateExportFields() {
    const period = document.getElementById('exp_period').value;
    const fields = document.getElementById('exp_fields');
    if (period === 'daily') {
        fields.innerHTML = `<div class="form-group"><label>Date</label><input id="exp_date" type="date" value="${today()}" /></div>`;
    } else if (period === 'weekly') {
        fields.innerHTML = `<div class="form-group"><label>Any date in the week</label><input id="exp_week" type="date" value="${today()}" /></div>`;
    } else {
        fields.innerHTML = `<div class="form-group"><label>Month</label><input id="exp_month" type="month" value="${today().slice(0,7)}" /></div>`;
    }
}

// ── Firebase sync ─────────────────────────────────────────────────────────────
function initFirebase() {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();

    // Connection status indicator
    db.ref('.info/connected').on('value', snap => {
        const el = document.getElementById('syncIndicator');
        if (!el) return;
        if (snap.val()) {
            el.textContent = '● Live';
            el.style.display = '';
            el.style.background = 'rgba(34,197,94,0.25)';
            el.style.color = '#86efac';
        } else {
            el.textContent = '○ Offline';
            el.style.display = '';
            el.style.background = 'rgba(255,255,255,0.1)';
            el.style.color = 'rgba(255,255,255,0.5)';
        }
    });

    // Real-time listener — updates all devices when anyone saves
    db.ref('projects/' + syncCode + '/state').on('value', snap => {
        if (_localWrite) return;
        const remote = snap.val();
        if (remote && remote.floors && remote.floors.length > 0) {
            // Preserve local deletions that may not have reached Firebase yet
            const _localDeleted = [...(state.deletedMaterials || [])];
            state = remote;
            if (!state.floors) state.floors = [];
            if (!state.materials) state.materials = [];
            if (!state.attendance) state.attendance = [];
            if (!state.crew) state.crew = [];
            if (!state.reports) state.reports = {};
            if (!state.deletedMaterials) state.deletedMaterials = [];
            // Merge any local deletions the remote snapshot doesn't know about yet
            const _remoteDelKeys = new Set(state.deletedMaterials.map(d => (String(d.trade||'')+'||'+String(d.name||'')).toLowerCase()));
            _localDeleted.forEach(d => {
                const k = (String(d.trade||'')+'||'+String(d.name||'')).toLowerCase();
                if (!_remoteDelKeys.has(k)) state.deletedMaterials.push(d);
            });
            // Strip any materials that belong to the merged deletion list
            const _allDelNames = new Set(state.deletedMaterials.map(d => String(d.name||'').toLowerCase()));
            state.materials = state.materials.filter(m => !_allDelNames.has(m.name.toLowerCase()));
            state.floors.forEach(f => { (f.items || []).forEach(i => { if (!i.hoursLog) i.hoursLog = []; }); });
            // Normalize materials: ensure log array and backfill trade
            const _tradeLookup = {};
            DEFAULT_MATERIALS.forEach(d => { _tradeLookup[d.name.toLowerCase()] = d.trade; });
            let _tradeDirty = false;
            state.materials.forEach(m => {
                if (!m.log) m.log = [];
                if (!m.trade && _tradeLookup[m.name.toLowerCase()]) { m.trade = _tradeLookup[m.name.toLowerCase()]; _tradeDirty = true; }
            });
            // Patch Floor 4 start date
            const _f4 = state.floors.find(f => f.name === 'Floor 4');
            if (_f4 && _f4.startDate !== '2026-05-04') { _f4.startDate = '2026-05-04'; _tradeDirty = true; }
            // Patch Joint Compound unit
            const _jc = (state.materials || []).find(m => m.name === 'Joint Compound' && m.unit === 'bags');
            if (_jc) { _jc.unit = 'buckets'; _tradeDirty = true; }
            // Rename Drywall → Plaster
            (state.materials || []).forEach(m => { if (m.trade === 'Drywall') { m.trade = 'Plaster'; _tradeDirty = true; } });
            // Merge Wall Primer + Ceiling Primer → Primer
            const _wallP   = (state.materials || []).find(m => m.name === 'Wall Primer');
            const _ceilP   = (state.materials || []).find(m => m.name === 'Ceiling Primer');
            const _primerX = (state.materials || []).find(m => m.name === 'Primer');
            if ((_wallP || _ceilP) && !_primerX) {
                const _ml = [...(_wallP ? _wallP.log||[] : []), ...(_ceilP ? _ceilP.log||[] : [])];
                state.materials.push({ id: uid(), name: 'Primer', unit: 'buckets', trade: 'Paint', log: _ml });
                _tradeDirty = true;
            }
            if (_wallP) { state.materials = state.materials.filter(m => m.name !== 'Wall Primer'); _tradeDirty = true; }
            if (_ceilP) { state.materials = state.materials.filter(m => m.name !== 'Ceiling Primer'); _tradeDirty = true; }
            // Add / backfill Georgetown materials
            const _matByName = {};
            (state.materials || []).forEach(m => { _matByName[m.name] = m; });
            const _deletedNames = new Set((state.deletedMaterials || []).map(d => String(d.name || '').toLowerCase()));
            DEFAULT_MATERIALS.forEach(dm => {
                if (!_matByName[dm.name] && !_deletedNames.has(dm.name.toLowerCase())) {
                    state.materials.push({ id: uid(), name: dm.name, unit: dm.unit, trade: dm.trade, startQty: dm.startQty !== undefined ? dm.startQty : 0, log: [] });
                    _tradeDirty = true;
                } else {
                    const _ex = _matByName[dm.name];
                    if (_ex && (_ex.startQty === undefined || _ex.startQty === null) && dm.startQty !== undefined) { _ex.startQty = dm.startQty; _tradeDirty = true; }
                    if (_ex && !_ex.trade && dm.trade) { _ex.trade = dm.trade; _tradeDirty = true; }
                }
            });
            localStorage.setItem('hallway_tracker_v2', JSON.stringify(state));
            if (_tradeDirty) persist();
            render();
        } else {
            // Remote is empty or missing — push local data up and render
            render();
            db.ref('projects/' + syncCode + '/state').set(state);
        }
    });
}

function joinSync() {
    const raw = document.getElementById('syncCodeInput').value.trim();
    if (!raw || raw.length < 3) { alert('Enter a sync code (at least 3 characters).'); return; }
    syncCode = raw.toLowerCase().replace(/[^a-z0-9]/g, '-');
    localStorage.setItem('hallway_sync_code', syncCode);
    document.getElementById('syncOverlay').classList.remove('open');
    initFirebase();
    render();
}

function disconnectSync() {
    if (!confirm('Disconnect from "' + syncCode + '"? The app will ask for a sync code next time.')) return;
    if (db) db.ref('projects/' + syncCode + '/state').off();
    db = null; syncCode = null; _localWrite = false;
    localStorage.removeItem('hallway_sync_code');
    const el = document.getElementById('syncIndicator');
    if (el) el.style.display = 'none';
    document.getElementById('syncCodeInput').value = '';
    document.getElementById('syncOverlay').classList.add('open');
}

// ── Auto-seed any missing Georgetown Plaza floors + patch start dates ──────────
(function() {
    let dirty = false;
    // Patch Floor 4 start date to 2026-05-04
    const f4 = state.floors.find(f => f.name === 'Floor 4');
    if (f4 && f4.startDate !== '2026-05-04') { f4.startDate = '2026-05-04'; dirty = true; }
    // Patch Joint Compound unit from bags → buckets (legacy)
    const jc = (state.materials || []).find(m => m.name === 'Joint Compound' && m.unit === 'bags');
    if (jc) { jc.unit = 'buckets'; dirty = true; }
    // Rename Drywall trade → Plaster
    (state.materials || []).forEach(m => { if (m.trade === 'Drywall') { m.trade = 'Plaster'; dirty = true; } });
    // Merge Wall Primer + Ceiling Primer → Primer (legacy)
    const wallPrimer   = (state.materials || []).find(m => m.name === 'Wall Primer');
    const ceilPrimer   = (state.materials || []).find(m => m.name === 'Ceiling Primer');
    const primerExists = (state.materials || []).find(m => m.name === 'Primer');
    if ((wallPrimer || ceilPrimer) && !primerExists) {
        const mergedLog = [...(wallPrimer ? wallPrimer.log || [] : []), ...(ceilPrimer ? ceilPrimer.log || [] : [])];
        state.materials.push({ id: uid(), name: 'Primer', unit: 'buckets', trade: 'Paint', log: mergedLog });
        dirty = true;
    }
    if (wallPrimer) { state.materials = state.materials.filter(m => m.name !== 'Wall Primer'); dirty = true; }
    if (ceilPrimer) { state.materials = state.materials.filter(m => m.name !== 'Ceiling Primer'); dirty = true; }

    // Add / backfill Georgetown materials from DEFAULT_MATERIALS
    const matByName = {};
    (state.materials || []).forEach(m => { matByName[m.name] = m; });
    const deletedNames = new Set((state.deletedMaterials || []).map(d => String(d.name || '').toLowerCase()));
    DEFAULT_MATERIALS.forEach(dm => {
        if (!matByName[dm.name] && !deletedNames.has(dm.name.toLowerCase())) {
            // Add missing material
            state.materials.push({ id: uid(), name: dm.name, unit: dm.unit, trade: dm.trade, startQty: dm.startQty !== undefined ? dm.startQty : 0, log: [] });
            dirty = true;
        } else {
            const existing = matByName[dm.name];
            if (!existing) return; // deleted item — skip backfill
            // Backfill startQty if not yet set
            if ((existing.startQty === undefined || existing.startQty === null) && dm.startQty !== undefined) {
                existing.startQty = dm.startQty;
                dirty = true;
            }
            // Backfill trade if missing
            if (!existing.trade && dm.trade) { existing.trade = dm.trade; dirty = true; }
        }
    });

    const existing = new Set(state.floors.map(f => f.name));
    const toAdd = GEORGETOWN_SCHEDULE.filter(f => !existing.has(f.name));
    if (toAdd.length > 0) {
        toAdd.forEach(f => {
            state.floors.push({
                id: uid(),
                name: f.name,
                startDate: f.startDate,
                items: DEFAULT_ITEMS.map(n => ({ id: uid(), name: n, hoursLog: [], status: 'pending' }))
            });
        });
        dirty = true;
    }
    if (dirty) persist();
})();

// ── App icon (canvas-generated for PWA + favicon) ─────────────────────────────
(function() {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const ctx = c.getContext('2d');

    // Navy background
    ctx.fillStyle = '#1a3a5c';
    ctx.fillRect(0, 0, 180, 180);

    // Blueprint grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    const step = 18;
    for (let x = 0; x <= 180; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 180); ctx.stroke();
    }
    for (let y = 0; y <= 180; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(180, y); ctx.stroke();
    }

    // Subtle accent lines (thicker, lighter)
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.5;
    for (let x = 0; x <= 180; x += step * 3) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 180); ctx.stroke();
    }
    for (let y = 0; y <= 180; y += step * 3) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(180, y); ctx.stroke();
    }

    // C+ text — white, bold, centered
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 80px -apple-system, BlinkMacSystemFont, Arial, sans-serif';
    ctx.fillText('C+', 90, 93);

    const url = c.toDataURL('image/png');
    document.getElementById('appIcon').href = url;
    document.getElementById('favicon').href = url;
})();

    return (state.attendance || []).find(a => a.date === date) || null;
}

    return new Set(day ? day.workerIds : []);

    if (!date) return;

function toggleSignIn(workerId, date) {
    date = date || today();
    if (!state.attendance) state.attendance = [];
    if (!state.crew) state.crew = [];
    let day = state.attendance.find(a => a.date === date);
    if (!day) {
        day = { id: uid(), date: date, workerIds: [] };
        state.attendance.push(day);
    }
    const idx = day.workerIds.indexOf(workerId);
    if (idx === -1) {
        openSignInDetailModal(workerId, day);
    } else {
        day.workerIds.splice(idx, 1);
        if (day.details) delete day.details[workerId];
        if (day.workerIds.length === 0) state.attendance = state.attendance.filter(a => a.date !== date);
        persist();
        document.getElementById('app').innerHTML = renderAttendance();
    }
}

function openSignInDetailModal(workerId, day, afterSave) {
    const member = (state.crew || []).find(c => c.id === workerId);
    const existingDetail = (day.details || {})[workerId] || {};
    const floorCheckboxes = (state.floors || []).map(f =>
        `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f0">

    ).join('') || '<div style="color:#aaa;font-style:italic;font-size:13px">No floors added yet.</div>';

        (member ? member.name + ' — ' : '') + 'Sign In Details',
        `<div class="form-group">
            <label>Hours Worked</label>
            <input id="signin_hours" type="number" min="1" max="24" step="0.5" placeholder="e.g. 8" value="${existingDetail.hours || ''}" />

function crewSortOrder(trade) {
    if (trade === 'Supervisor') return 0;
    if (trade === 'Foreman') return 1;
    return 2;
}

function sortedWorkerIds(workerIds, crew) {
    return [...workerIds].sort((a, b) => {
        const ma = crew.find(c => c.id === a);
        const mb = crew.find(c => c.id === b);
        return crewSortOrder(ma?.trade) - crewSortOrder(mb?.trade);
    });
}

function exportWeeklyAttendancePDF() {
    const { start, end } = getWeekRange();
    const crew = state.crew || [];
    const weekDays = [];
    for (let d = new Date(start + 'T12:00:00'); d.toISOString().slice(0,10) <= end; d.setDate(d.getDate()+1)) {
        weekDays.push(d.toISOString().slice(0,10));
    }
    const dayLabels = weekDays.map(d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'}));
    const label = `${displayDate(start)} – ${displayDate(end)}`;

    // Build per-worker data
    const rows = crew.map(w => {
        const dayData = weekDays.map(date => {
            const att = (state.attendance||[]).find(a=>a.date===date);
            const detail = att ? (att.details||{})[w.id] : null;
            const present = att && (att.workerIds||[]).includes(w.id);
            return { present, hours: detail?.hours || 0 };
        });
        const totalHours = dayData.reduce((s,d)=>s+(d.hours||0),0);
        const daysWorked = dayData.filter(d=>d.present).length;
        if (daysWorked === 0) return null;
        return { w, dayData, totalHours, daysWorked };
    }).filter(Boolean).sort((a,b) => crewSortOrder(a.w.trade) - crewSortOrder(b.w.trade));

    const headerCells = dayLabels.map(l=>`<th style="padding:7px 8px;text-align:center;font-size:10px">${l}</th>`).join('');
    const bodyRows = rows.map(({w, dayData, totalHours}) => {
        const dayCells = dayData.map(d => d.present
            ? `<td style="padding:7px 8px;text-align:center;border-bottom:1px solid #eee;color:#1a3a5c;font-weight:700">${d.hours||'✓'}</td>`
            : `<td style="padding:7px 8px;text-align:center;border-bottom:1px solid #eee;color:#ddd">—</td>`
        ).join('');
        return `<tr>
            <td style="padding:7px 8px;border-bottom:1px solid #eee;font-weight:700">${w.name}</td>
            <td style="padding:7px 8px;border-bottom:1px solid #eee;color:#888;font-size:12px">${w.trade||'—'}</td>
            ${dayCells}
            <td style="padding:7px 8px;border-bottom:1px solid #eee;text-align:center;font-weight:800;color:#1a3a5c;background:#f0f4ff">${totalHours||'—'}</td>
        </tr>`;
    }).join('');

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Weekly Attendance</title>
    <style>* { box-sizing:border-box; margin:0; padding:0; } body { font-family:Arial,sans-serif; font-size:13px; color:#111; padding:28px; }
    h1 { font-size:18px; font-weight:800; color:#1a3a5c; margin-bottom:4px; }
    .meta { font-size:12px; color:#666; margin-bottom:20px; }
    table { width:100%; border-collapse:collapse; }
    th { background:#1a3a5c; color:white; padding:8px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
    @media print { body { padding:16px; } }</style></head><body>
    <h1>Corridor's Plus — Weekly Attendance</h1>
    <div class="meta">Week of ${label} &nbsp;·&nbsp; Generated ${displayDate(today())}</div>
    <table>
        <thead><tr>
            <th>Name</th><th>Trade</th>${headerCells}<th style="text-align:center;background:#0d2d4a">Total Hrs</th>
        </tr></thead>
        <tbody>${bodyRows || '<tr><td colspan="' + (weekDays.length+3) + '" style="padding:12px;color:#aaa;font-style:italic">No attendance this week.</td></tr>'}</tbody>
    </table>
    <script>window.onload=()=>window.print();<\/script></body></html>`;
    window.open(URL.createObjectURL(new Blob([html], { type: 'text/html' })), '_blank');
}

function submitAttendanceToday() {
    persist();
    const btn = document.getElementById('att_submit_btn');
    if (btn) { btn.textContent = '✓ Saved!'; btn.style.background = '#16a34a'; setTimeout(() => { btn.textContent = '✓ Submit Today\'s Attendance'; btn.style.background = ''; }, 2000); }
}

function renderAttendance() {
    const t    = today();
    const crew = state.crew || [];
    const checkedIds  = getCheckedIds(_attendanceDate);
    const presentCount = checkedIds.size;
    const isToday = _attendanceDate === t;
    const currentDay  = getAttendanceDay(_attendanceDate);
    const allChecked  = crew.length > 0 && presentCount === crew.length;

    let html = '';

    // Tab switcher
    html += `<div style="display:flex;gap:0;margin-bottom:16px;border:1.5px solid #e0e0e0;border-radius:10px;overflow:hidden">
        <button onclick="_attView='signin';document.getElementById('att_tab_signin').style.display='';document.getElementById('att_tab_roster').style.display='none';this.style.background='#1a3a5c';this.style.color='white';document.getElementById('att_roster_tab_btn').style.background='';document.getElementById('att_roster_tab_btn').style.color=''" id="att_signin_tab_btn"
            style="flex:1;padding:10px;border:none;cursor:pointer;font-size:14px;font-weight:600;background:${_attView==='signin'?'#1a3a5c':'white'};color:${_attView==='signin'?'white':'#555'}">
            Sign-In
        </button>
        <button onclick="_attView='roster';document.getElementById('att_tab_roster').style.display='';document.getElementById('att_tab_signin').style.display='none';this.style.background='#1a3a5c';this.style.color='white';document.getElementById('att_signin_tab_btn').style.background='';document.getElementById('att_signin_tab_btn').style.color=''" id="att_roster_tab_btn"
            style="flex:1;padding:10px;border:none;border-left:1.5px solid #e0e0e0;cursor:pointer;font-size:14px;font-weight:600;background:${_attView==='roster'?'#1a3a5c':'white'};color:${_attView==='roster'?'white':'#555'}">
            Manage Roster
        </button>
    </div>`;

    // ── Sign-In tab ──
    html += `<div id="att_tab_signin" style="display:${_attView==='roster'?'none':''}">`;

    if (crew.length === 0) {
        html += `<div class="card"><div class="empty-state">No crew roster yet.<br>Go to "Manage Roster" to add workers.</div></div>`;
    } else {
        // Back to Today button when viewing a past day
        if (!isToday) {
            html += `<button class="btn btn-secondary" style="width:100%;margin-bottom:12px" onclick="setAttendanceDate('${t}')">← Back to Today</button>`;
        }

        // Section header
        html += `<div class="section-header">
            <span class="section-title">${isToday ? 'Today' : displayDate(_attendanceDate)} · ${presentCount} on site</span>
            <div style="display:flex;gap:6px;align-items:center">
                <button class="icon-btn" onclick="${allChecked ? `deselectAllWorkers('${_attendanceDate}')` : `selectAllWorkers('${_attendanceDate}')`}">${allChecked ? 'Deselect All' : 'Select All'}</button>
                ${presentCount > 0 ? `<button class="icon-btn" onclick="exportAttendancePDF('${_attendanceDate}')">&#8681; PDF</button>` : ''}
            </div>
        </div>`;

        // Worker list
        html += `<div class="card" style="padding:8px 16px">`;
        crew.forEach(w => {
            const checked = checkedIds.has(w.id);
            const detail = (currentDay?.details || {})[w.id];
            const floorNames = (detail?.floorIds || []).map(fid => (state.floors||[]).find(f=>f.id===fid)?.name).filter(Boolean);
            const detailLine = checked && detail && (detail.hours || detail.task || floorNames.length > 0)
                ? `<div style="font-size:11px;color:#0891b2;margin-top:2px">${[detail.hours ? detail.hours + ' hrs' : '', detail.task, floorNames.join(', ')].filter(Boolean).join(' · ')}</div>`
                : '';
            html += `<div class="worker-row att-row${checked?' att-checked':''}" onclick="toggleSignIn('${w.id}','${_attendanceDate}')" style="cursor:pointer">
                <div style="display:flex;align-items:center;gap:12px">
                    <input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();toggleSignIn('${w.id}','${_attendanceDate}')"
                        style="width:20px;height:20px;accent-color:#0891b2;cursor:pointer;flex-shrink:0" />
                    <div>
                        <div class="worker-name">${w.name}</div>
                        ${w.trade ? `<div class="worker-trade">${w.trade}</div>` : ''}
                        ${detailLine}
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                    ${checked ? `<button class="edit-row" style="font-size:14px" onclick="event.stopPropagation();editSignInDetail('${w.id}','${_attendanceDate}')">&#9998;</button>` : ''}
                    ${checked ? `<span style="color:#0891b2;font-size:13px;font-weight:700">On site</span>` : `<span style="color:#ccc;font-size:13px">—</span>`}
                </div>
            </div>`;
        });
        html += `</div>`;

        // Action buttons
        if (isToday) {
            html += `<button id="att_submit_btn" class="btn btn-primary" style="width:100%;margin-top:8px;padding:14px;font-size:15px;font-weight:700" onclick="submitAttendanceToday()">✓ Submit Today's Attendance</button>`;
            html += `<button class="btn btn-secondary" style="width:100%;margin-top:6px" onclick="exportWeeklyAttendancePDF()">&#8681; Weekly Attendance PDF</button>`;
        } else {
            if (presentCount > 0) html += `<button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="exportAttendancePDF('${_attendanceDate}')">&#8681; Export PDF</button>`;
            html += `<button class="btn btn-danger" style="width:100%;margin-top:6px" onclick="deleteAttendanceDay('${_attendanceDate}')">Delete This Day</button>`;
        }

        // Recent Days list (only shown when viewing today)
        if (isToday) {
            const allPastDays = (state.attendance || []).filter(a => a.date !== t).sort((a,b) => b.date.localeCompare(a.date));
            const pastDays = _attShowAll ? allPastDays : allPastDays.slice(0, 10);

            html += `<div class="section-header" style="margin-top:20px"><span class="section-title">Recent Days</span></div>`;
            html += `<div style="margin-bottom:10px"><input type="date" style="width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;color:#1a1a2e" onchange="if(this.value)setAttendanceDate(this.value)" placeholder="Pick any date…" /></div>`;

            if (allPastDays.length > 0) {
                html += `<div class="card">`;
                pastDays.forEach(a => {
                    const names = (a.workerIds || []).map(id => { const m = crew.find(c => c.id === id); return m ? m.name.split(' ')[0] : null; }).filter(Boolean);
                    html += `<div class="worker-row" style="cursor:pointer" onclick="setAttendanceDate('${a.date}')">
                        <div>
                            <div class="worker-name">${displayDate(a.date)}</div>
                            <div class="worker-trade">${(a.workerIds||[]).length} on site · ${names.join(', ')}</div>
                        </div>
                        <span style="color:#ccc;font-size:20px">›</span>
                    </div>`;
                });
                html += `</div>`;
                if (allPastDays.length > 10) {
                    html += `<button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="_attShowAll=!_attShowAll;document.getElementById('app').innerHTML=renderAttendance()">${_attShowAll ? 'Show Less' : 'Show All ' + allPastDays.length + ' Days'}</button>`;
                }
            }
        }
    }

    html += `</div>`; // end sign-in tab

    // ── Roster tab ──
    html += `<div id="att_tab_roster" style="display:${_attView==='roster'?'':'none'}">`;
    html += `<div class="section-header"><span class="section-title">Crew Roster (${crew.length})</span></div>`;
    if (crew.length === 0) {
        html += `<div class="card"><div class="empty-state">No crew members yet.<br>Add everyone once, then check them in daily.</div></div>`;
    } else {
        html += `<div class="card" style="padding:8px 16px">`;
        crew.forEach(w => {
            html += `<div class="worker-row">
                <div>
                    <div class="worker-name">${w.name}</div>
                    ${w.trade ? `<div class="worker-trade">${w.trade}</div>` : ''}
                </div>
                <div style="display:flex;gap:8px">
                    <button class="edit-row" onclick="editCrewMember('${w.id}')">&#9998;</button>
                    <button class="delete-row" onclick="removeCrewMember('${w.id}')">×</button>
                </div>
            </div>`;
        });
        html += `</div>`;
    }
    html += `<button class="btn btn-primary" style="width:100%;margin-top:8px;padding:14px;font-size:15px" onclick="addCrewMember()">+ Add Crew Member</button>`;
    html += `</div>`; // end roster tab

    return html;
}

// ── Reports ──────────────────────────────────────────────────────────────────
function renderReports() {
    const dates = new Set();
    (state.attendance || []).forEach(a => dates.add(a.date));
    (state.floors || []).forEach(f => (f.items||[]).forEach(i => (i.hoursLog||[]).forEach(e => dates.add(e.date))));
    Object.keys(state.reports || {}).forEach(d => dates.add(d));

    const sorted = [...dates].sort((a,b) => b.localeCompare(a));

    if (sorted.length === 0) {
        return `<div class="card"><div class="empty-state">No reports yet.<br>Log labor or attendance to generate a report.</div></div>`;
    }

    let html = `<div style="margin-bottom:12px"><input type="date" style="width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;color:#1a1a2e" onchange="if(this.value)navigate('report',null,null,null,null,this.value)" placeholder="Pick any date…" /></div>`;
    sorted.forEach(date => {
        const att = (state.attendance||[]).find(a => a.date === date);
        const workerCount = att ? att.workerIds.length : 0;
        const dayMH = (state.floors||[]).reduce((s,f) => s + (f.items||[]).reduce((ss,i) => ss + (i.hoursLog||[]).filter(e=>e.date===date).reduce((sss,e)=>sss+entryManHours(e),0), 0), 0);
        const hasNotes = !!(state.reports?.[date]?.notes);
        html += `<div class="report-day-card" onclick="navigate('report',null,null,null,null,'${date}')">
            <div>
                <div class="report-day-date">${displayDate(date)}</div>
                <div class="report-day-meta">${workerCount > 0 ? workerCount + ' on site' : 'No attendance'}${dayMH > 0 ? ' · ' + dayMH + ' man-hrs' : ''}${hasNotes ? ' · 📝' : ''}</div>
            </div>
            <span style="color:#ccc;font-size:22px">›</span>
        </div>`;
    });
    return html;
}

function renderReport(date) {
    if (!date) return '<div class="empty-state">No date selected.</div>';
    const att = (state.attendance||[]).find(a => a.date === date);
    const crew = state.crew || [];
    const floors = state.floors || [];
    const report = (state.reports || {})[date] || {};

    // ── Summary stats
    const totalWorkers = att ? (att.workerIds || []).length : 0;
    let skilledMH = 0, laborerMH = 0;
    floors.forEach(f => (f.items||[]).forEach(i => (i.hoursLog||[]).filter(e=>e.date===date).forEach(e => {
        skilledMH  += (e.skilled  || 0) * (e.skilledHours  || 0);
        laborerMH  += (e.laborer  || 0) * (e.laborerHours  || 0);
    })));
    const totalMH = skilledMH + laborerMH;

    let html = `<div class="stats-row" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:16px">
        <div class="stat-card"><div class="stat-value" style="color:#1a3a5c">${totalMH}</div><div class="stat-label">Total MH</div></div>
        <div class="stat-card"><div class="stat-value" style="color:#0891b2">${skilledMH}</div><div class="stat-label">Skilled MH</div></div>
        <div class="stat-card"><div class="stat-value" style="color:#7c3aed">${laborerMH}</div><div class="stat-label">Laborer MH</div></div>
    </div>`;

    // ── Workers on site
    html += `<div class="section-header"><span class="section-title">Workers on Site</span></div>`;
    if (!att || att.workerIds.length === 0) {
        html += `<div class="report-section"><div style="color:#bbb;font-style:italic;font-size:14px">No attendance logged.</div></div>`;
    } else {
        html += `<div class="report-section">`;
        sortedWorkerIds(att.workerIds, crew).forEach(wid => {
            const member = crew.find(c => c.id === wid);
            if (!member) return;
            const detail = (att.details || {})[wid] || {};
            const floorNames = (detail.floorIds || []).map(fid => floors.find(f=>f.id===fid)?.name).filter(Boolean);
            html += `<div class="report-worker-row" style="display:flex;justify-content:space-between;align-items:center">
                <div>
                    <div style="font-weight:700;font-size:14px">${member.name}</div>
                    <div style="font-size:12px;color:#999;margin-top:2px">${member.trade || ''}${detail.task ? ' · ' + detail.task : ''}${floorNames.length > 0 ? ' · ' + floorNames.join(', ') : ''}</div>
                </div>
                <div style="white-space:nowrap;display:flex;gap:6px">
                    <button class="edit-row" style="font-size:14px" onclick="editSignInDetail('${wid}','${date}')">&#9998;</button>
                    <button class="delete-row" onclick="removeWorkerFromDay('${wid}','${date}')">×</button>
                </div>
            </div>`;
        });
        html += `</div>`;
    }

    // ── Labor by floor
    const floorData = [];
    floors.forEach(f => {
        const entries = (f.items||[]).flatMap(i => (i.hoursLog||[]).filter(e=>e.date===date).map(e=>({item:i.name, mh:entryManHours(e)})));
        if (entries.length > 0) {
            const total = entries.reduce((s,e)=>s+e.mh, 0);
            floorData.push({ name: f.name, total, entries });
        }
    });
    html += `<div class="section-header"><span class="section-title">Labor</span></div>`;
    if (floorData.length === 0) {
        html += `<div class="report-section"><div style="color:#bbb;font-style:italic;font-size:14px">No labor logged.</div></div>`;
    } else {
        html += `<div class="report-section">`;
        floorData.forEach(f => {
            html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0">
                <div>
                    <div style="font-weight:700;font-size:14px">${f.name}</div>
                    <div style="font-size:12px;color:#999;margin-top:2px">${f.entries.map(e=>e.item+' ('+e.mh+' mh)').join(', ')}</div>
                </div>
                <span style="font-weight:800;font-size:16px;color:#1a3a5c">${f.total} mh</span>
            </div>`;
        });
        html += `</div>`;
    }

    // ── Materials used
    const matUsed = (state.materials||[]).map(m => {
        const entries = (m.log||[]).filter(e=>e.type==='usage'&&e.date===date);
        const qty = entries.reduce((s,e)=>s+e.qty,0);
        return qty > 0 ? { name: m.name, unit: m.unit, qty } : null;
    }).filter(Boolean);
    html += `<div class="section-header"><span class="section-title">Materials Used</span></div>`;
    if (matUsed.length === 0) {
        html += `<div class="report-section"><div style="color:#bbb;font-style:italic;font-size:14px">No materials logged.</div></div>`;
    } else {
        html += `<div class="report-section">`;
        matUsed.forEach(m => {
            html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0">
                <span style="font-size:14px">${m.name}</span>
                <span style="font-weight:700;font-size:14px;color:#1a3a5c">${m.qty} ${m.unit}</span>
            </div>`;
        });
        html += `</div>`;
    }

    // ── Notes
    html += `<div class="section-header" style="display:flex;align-items:center;justify-content:space-between">
        <span class="section-title">Notes</span>
        <div style="display:flex;gap:8px">
            ${report.notes ? `<button class="notes-edit-btn" onclick="deleteDailyNotes('${date}')">Delete</button>` : ''}
            <button class="notes-edit-btn" onclick="_dnDate='${date}';navigate('dailynotes')">${report.notes ? 'Edit' : '+ Add Note'}</button>
        </div>
    </div>`;
    if (report.notes) {
        html += `<div class="notes-card"><div class="notes-card-text">${report.notes.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div></div>`;
    } else {
        html += `<div class="report-section"><div style="color:#bbb;font-style:italic;font-size:14px">No notes for this day.</div></div>`;
    }

    return html;
}

function saveReportNotes(date, notes) {
    if (!state.reports) state.reports = {};
    if (!state.reports[date]) state.reports[date] = {};
    state.reports[date].notes = notes;
    persist();
}

function exportDailyReportPDF(date) {

    const crew = state.crew||[];
    const floors = state.floors||[];

        ? sortedWorkerIds(att.workerIds, crew).map(wid => {
            const m = crew.find(c=>c.id===wid);

            const detail = (att.details||{})[wid]||{};
            const floorNames = (detail.floorIds||[]).map(fid=>floors.find(f=>f.id===fid)?.name).filter(Boolean);
            const taskStr = [detail.task, floorNames.join(', ')].filter(Boolean).join(' · ');
            return `<tr><td>${m.name}</td><td>${m.trade||'—'}</td><td>${taskStr||'—'}</td></tr>`;
          }).join('')
        : '<tr><td colspan="3" style="color:#aaa;font-style:italic">No attendance logged</td></tr>';

    let pdfSkilledMH = 0, pdfLaborerMH = 0;

        const total = entries.reduce((s,e)=>s+e.mh,0);

    const matRows = (state.materials||[]).map(m=>{

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Daily Report — ${dateStr}</title>
