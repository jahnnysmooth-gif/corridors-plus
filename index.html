// ── Cross-floor summary ───────────────────────────────────────────────────────
function exportCrossFloorSummary(floors, inRange, periodLabel) {
    let tableRows = '';
    let grandMH = 0, grandSk = 0, grandLb = 0, grandSess = 0;

    floors.forEach(floor => {
        const entries = floor.items.flatMap(i => i.hoursLog.filter(h => inRange(h.date)));
        const mh   = entries.reduce((s, e) => s + entryManHours(e), 0);
        if (mh === 0) return;
        const sk   = entries.reduce((s, e) => s + entrySkilledMH(e), 0);
        const lb   = entries.reduce((s, e) => s + entryLaborerMH(e), 0);
        const sess = entries.length;
        grandMH += mh; grandSk += sk; grandLb += lb; grandSess += sess;
        tableRows += `<tr>
            <td>${floor.name}${floor.completed ? ' ✓' : ''}</td>
            <td>${mh}</td><td>${sk}</td><td>${lb}</td><td>${sess}</td>
        </tr>`;
    });

    if (!tableRows) { alert('No hours logged for this period.'); return; }

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>Cross-Floor Summary</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:Arial,sans-serif; font-size:12px; color:#111; padding:32px; }
        h1 { font-size:20px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#1a3a5c; margin-bottom:4px; }
        .meta { font-size:12px; color:#666; margin-bottom:20px; }
        table { width:100%; border-collapse:collapse; }
        thead tr { background:#1a3a5c; color:white; }
        thead th { padding:9px 10px; text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
        tbody tr:nth-child(even) { background:#f5f8ff; }
        tbody td { padding:8px 10px; border-bottom:1px solid #eee; }
        .total-row td { font-weight:700; background:#e8eef8 !important; color:#1a3a5c; border-top:2px solid #1a3a5c; }
        @media print { body { padding:16px; } }
    </style></head><body>
    <h1>Corridor's Plus — Cross-Floor Summary</h1>
    <div class="meta">Period: ${periodLabel} &nbsp;|&nbsp; Generated: ${displayDate(today())}</div>
    <table>
        <thead><tr><th>Floor</th><th>Man-Hours</th><th>Skilled MH</th><th>Laborer MH</th><th>Sessions</th></tr></thead>

    window.open(url, '_blank');

}

// ── Materials export ──────────────────────────────────────────────────────────

    const mats = state.materials.filter(m => matDailyUsage(m).length > 0);

    let bodyHtml = '';

        const usage = matDailyUsage(mat);
        if (usage.length === 0) return;
        const totalUsed = usage.reduce((s,d) => s + d.used, 0);
        const totalDel  = usage.reduce((s,d) => s + d.delivered, 0);
        let rows = usage.map(d => `<tr>
            <td>${displayDate(d.date)}</td>
            <td>${d.delivered > 0 ? '+'+d.delivered : '—'}</td>
            <td>${d.onSite}</td>
            <td>${d.eodQty}</td>
            <td style="font-weight:700;color:#1a3a5c">${d.used}</td>

        <div style="margin-bottom:32px">

            <div style="text-align:right;margin-top:8px;font-size:13px;font-weight:700;color:#1a3a5c">
                Total Delivered: ${totalDel} ${mat.unit} &nbsp;·&nbsp; Total Used: ${totalUsed} ${mat.unit}

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>Material Inventory Report</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:Arial,sans-serif; font-size:12px; color:#111; padding:32px; }
        h1 { font-size:20px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#1a3a5c; margin-bottom:4px; }

    <div class="meta">Generated: ${displayDate(today())}</div>
    ${bodyHtml}

    const blob = new Blob([html], { type: 'text/html' });

}

function updateExportFields() {
    const period = document.getElementById('exp_period').value;
    const fields = document.getElementById('exp_fields');
    if (period === 'daily') {
        fields.innerHTML = `<div class="form-group"><label>Date</label><input id="exp_date" type="date" value="${today()}" /></div>`;
    } else if (period === 'weekly') {
        fields.innerHTML = `<div class="form-group"><label>Any date in the week</label><input id="exp_week" type="date" value="${today()}" /></div>`;
    } else {
        fields.innerHTML = `<div class="form-group"><label>Month</label><input id="exp_month" type="month" value="${today().slice(0,7)}" /></div>`;
    }
}

// ── Firebase sync ─────────────────────────────────────────────────────────────
function initFirebase() {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();

    // Connection status indicator
    db.ref('.info/connected').on('value', snap => {
        const el = document.getElementById('syncIndicator');
        if (!el) return;
        if (snap.val()) {
            el.textContent = '● Live';
            el.style.display = '';
            el.style.background = 'rgba(34,197,94,0.25)';
            el.style.color = '#86efac';
        } else {
            el.textContent = '○ Offline';
            el.style.display = '';
            el.style.background = 'rgba(255,255,255,0.1)';
            el.style.color = 'rgba(255,255,255,0.5)';
        }
    });

    // Real-time listener — updates all devices when anyone saves
    db.ref('projects/' + syncCode + '/state').on('value', snap => {
        if (_localWrite) return;
        const remote = snap.val();
        if (remote && remote.floors) {
            state = remote;
            if (!state.materials) state.materials = [];
            (state.floors || []).forEach(f => { (f.items || []).forEach(i => { if (!i.hoursLog) i.hoursLog = []; }); });
            // Normalize materials: ensure log array and backfill trade
            const _tradeLookup = {};
            DEFAULT_MATERIALS.forEach(d => { _tradeLookup[d.name.toLowerCase()] = d.trade; });
            let _tradeDirty = false;
            state.materials.forEach(m => {
                if (!m.log) m.log = [];
                if (!m.trade && _tradeLookup[m.name.toLowerCase()]) { m.trade = _tradeLookup[m.name.toLowerCase()]; _tradeDirty = true; }
            });
            localStorage.setItem('hallway_tracker_v2', JSON.stringify(state));
            if (_tradeDirty) persist();
            render();
        } else if (state.floors && state.floors.length > 0) {
            // First time connecting — push existing local data up
            db.ref('projects/' + syncCode + '/state').set(state);
        }
    });
}

function joinSync() {
    const raw = document.getElementById('syncCodeInput').value.trim();
    if (!raw || raw.length < 3) { alert('Enter a sync code (at least 3 characters).'); return; }
    syncCode = raw.toLowerCase().replace(/[^a-z0-9]/g, '-');
    localStorage.setItem('hallway_sync_code', syncCode);
    document.getElementById('syncOverlay').classList.remove('open');
    initFirebase();
    render();
}

function disconnectSync() {
    if (!confirm('Disconnect from "' + syncCode + '"? The app will ask for a sync code next time.')) return;
    if (db) db.ref('projects/' + syncCode + '/state').off();
    db = null; syncCode = null; _localWrite = false;
    localStorage.removeItem('hallway_sync_code');
    const el = document.getElementById('syncIndicator');
    if (el) el.style.display = 'none';
    document.getElementById('syncCodeInput').value = '';
    document.getElementById('syncOverlay').classList.add('open');
}

// ── Init ──────────────────────────────────────────────────────────────────────
const _savedCode = localStorage.getItem('hallway_sync_code');
if (_savedCode) {
    syncCode = _savedCode;
    render();          // show local data immediately while Firebase loads
    initFirebase();    // then connect — listener will re-render when data arrives
} else {
    document.getElementById('syncOverlay').classList.add('open');
}
</script>
