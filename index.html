<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Corridor's Plus</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">

    <!-- PWA / Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Corridor's Plus">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a3a5c">

    <!-- Firebase (CDN — no npm needed) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f3f8;
            color: #1a1a2e;
            min-height: 100vh;
        }

        header {
            background: #1a3a5c;
            color: white;
            padding: 16px 20px;
            padding-top: max(16px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        header h1 { font-size: 18px; font-weight: 600; flex: 1; }

        .header-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .container {
            padding: 16px;
            max-width: 640px;
            margin: 0 auto;
        }

        /* ── Stats row ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .stat-value { font-size: 26px; font-weight: 700; color: #1a3a5c; line-height: 1; }
        .stat-label { font-size: 11px; color: #999; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }

        /* ── Floor cards ── */
        .floor-card {
            background: white;
            border-radius: 12px;
            padding: 18px 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: box-shadow 0.15s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .floor-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
        .floor-card-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
        .floor-card-meta { font-size: 13px; color: #999; }
        .floor-card-right { display: flex; align-items: center; gap: 10px; }
        .floor-card-arrow { font-size: 22px; color: #ccc; }
        .floor-card.selected { border: 2px solid #1a3a5c; background: #f0f4ff; }
        .floor-card-checkbox { width: 22px; height: 22px; accent-color: #1a3a5c; cursor: pointer; flex-shrink: 0; margin-right: 4px; }
        .select-bar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
        .select-bar-info { flex: 1; font-size: 14px; font-weight: 600; color: #1a3a5c; }
        .delete-selected-btn { background: #dc2626; color: white; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .delete-selected-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* ── Progress pill ── */
        .progress-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .progress-0   { background: #f0f0f0; color: #aaa; }
        .progress-mid { background: #fef3c7; color: #92400e; }
        .progress-100 { background: #dcfce7; color: #166534; }

        /* ── Tile grid ── */
        .tile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 9px;
            margin-bottom: 12px;
        }

        .item-tile {
            border-radius: 12px;
            padding: 12px 11px;
            cursor: pointer;
            transition: box-shadow 0.15s, transform 0.1s;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 90px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            position: relative;
        }
        .item-tile:hover  { box-shadow: 0 3px 10px rgba(0,0,0,0.13); }
        .item-tile:active { transform: scale(0.96); }

        .tile-status-dot {
            position: absolute;
            top: 9px;
            right: 9px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-pending { background: rgba(0,0,0,0.18); }
        .dot-active  { background: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,0.25); }
        .dot-done    { background: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,0.25); }

        .item-tile-name {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.3;
            flex: 1;
            padding-right: 10px;
        }

        .item-tile-footer {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .item-tile-hrs  { font-size: 20px; font-weight: 800; line-height: 1; }
        .item-tile-unit { font-size: 9px; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; opacity: 0.6; }
        .item-tile-sessions { font-size: 10px; opacity: 0.5; text-align: right; }

        /* ── Log Today (big) button ── */
        .log-today-btn {
            width: 100%;
            padding: 15px;
            background: #1a3a5c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 14px;
            transition: background 0.15s;
        }
        .log-today-btn:hover { background: #15304d; }

        /* ── Add / util buttons ── */
        .add-btn {
            width: 100%;
            padding: 14px;
            border: 2px dashed #c8d0dc;
            background: none;
            border-radius: 12px;
            color: #7a8a9a;
            font-size: 14px;
            cursor: pointer;
            margin-top: 4px;
            transition: all 0.15s;
        }
        .add-btn:hover { border-color: #1a3a5c; color: #1a3a5c; background: #f0f5ff; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary   { background: #1a3a5c; color: white; }
        .btn-secondary { background: #e8ecf2; color: #333; }
        .btn-danger    { background: #fee2e2; color: #b91c1c; }
        .btn-sm        { padding: 6px 12px; font-size: 13px; }

        /* ── Section header ── */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 18px 0 8px;
        }
        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        /* ── Card ── */
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        /* ── Log table ── */
        .log-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .log-table th {
            text-align: left;
            padding: 6px 8px;
            color: #aaa;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid #eee;
        }
        .log-table td { padding: 10px 8px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
        .log-table tr:last-child td { border-bottom: none; }
        .man-hrs-cell { font-weight: 700; color: #1a3a5c; }

        .delete-row {
            color: #ddd;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 0 2px;
        }
        .delete-row:hover { color: #ef4444; }

        /* ── Empty state ── */
        .empty-state { text-align: center; padding: 28px 16px; color: #bbb; font-size: 14px; line-height: 1.6; }

        /* ── Delete zone ── */
        .delete-zone { margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }

        /* ── Status toggle ── */
        .status-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
        }
        .status-btn {
            flex: 1;
            padding: 8px 6px;
            border-radius: 8px;
            border: 1.5px solid #e0e0e0;
            background: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            color: #aaa;
        }
        .status-btn.active-pending { border-color: #aaa;    background: #f5f5f5;  color: #555; }
        .status-btn.active-active  { border-color: #f59e0b; background: #fef3c7;  color: #92400e; }
        .status-btn.active-done    { border-color: #22c55e; background: #dcfce7;  color: #166534; }

        /* ── Quick log ── */
        .quick-log-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .quick-log-date { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

        .date-chip {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
            background: #f0f3f8;
            color: #555;
        }
        .date-chip.active { background: #1a3a5c; color: white; border-color: #1a3a5c; }
        .date-chip:hover:not(.active) { border-color: #1a3a5c; color: #1a3a5c; }

        .date-picker-wrap { display: none; margin-top: 8px; }
        .date-picker-wrap.open { display: block; }
        .date-picker-wrap input[type=date] {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid #1a3a5c;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #1a3a5c;
            outline: none;
        }

        .cal-btn {
            padding: 5px 10px;
            border-radius: 20px;
            border: 1.5px solid transparent;
            background: #f0f3f8;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
        }
        .cal-btn:hover { border-color: #1a3a5c; background: #e8eef8; }
        .cal-btn.active { background: #1a3a5c; border-color: #1a3a5c; }
        .cal-btn.active svg { stroke: white; }
        .cal-btn svg { display: block; }

        .quick-log-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 8px;
            align-items: flex-end;
        }

        .quick-log-field label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }

        .quick-log-field input {
            width: 100%;
            padding: 10px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            outline: none;
            transition: border-color 0.15s;
        }
        .quick-log-field input:focus { border-color: #1a3a5c; }

        .log-btn {
            padding: 10px 14px;
            background: #1a3a5c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            align-self: flex-end;
        }
        .log-btn:hover { background: #15304d; }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: white;
            width: 100%;
            max-width: 640px;
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 36px;
            max-height: 88vh;
            overflow-y: auto;
        }

        .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 13px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.15s;
            background: white;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #1a3a5c; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; padding: 13px; }

        /* ── Daily log modal rows ── */
        .daily-floor-header {
            font-size: 13px;
            font-weight: 800;
            color: #1a3a5c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 0 6px;
            border-top: 1px solid #eee;
            margin-top: 8px;
        }
        .daily-floor-header:first-of-type { border-top: none; margin-top: 0; }

        .daily-row { padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
        .daily-row:last-child { border-bottom: none; }
        .daily-row-label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #1a1a2e; }

        /* ── Backup row ── */
        .backup-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .backup-row .btn { flex: 1; font-size: 13px; padding: 10px; }

        /* ── Backup warning ── */
        .backup-warning {
            background: #fef3c7;
            border: 1.5px solid #f59e0b;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #92400e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .backup-warn-btn {
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* ── Week summary ── */
        .week-summary {
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .week-summary-title { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
        .week-floor-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
        .week-floor-row:last-of-type { border-bottom: none; }
        .week-floor-total { font-weight: 700; color: #1a3a5c; }
        .week-grand { margin-top: 8px; text-align: right; font-size: 12px; font-weight: 700; color: #1a3a5c; padding-top: 6px; border-top: 1px solid #eee; }

        /* ── Notes card ── */
        .notes-card { background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
        .notes-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .notes-card-label { font-size: 11px; font-weight: 700; color: #92400e; text-transform: uppercase; letter-spacing: 0.5px; }
        .notes-card-text { font-size: 14px; color: #1a1a2e; line-height: 1.5; white-space: pre-wrap; }
        .notes-empty { font-size: 13px; color: #aaa; font-style: italic; }
        .notes-edit-btn { background: none; border: none; color: #92400e; font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 8px; border-radius: 4px; }
        .notes-edit-btn:hover { background: #fde68a; }

        /* ── Completed floors ── */
        .completed-section-header { font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.6px; padding: 16px 0 8px; border-top: 1px solid #eee; margin-top: 8px; }
        .floor-card.completed { opacity: 0.6; }

        /* ── Edit / icon row buttons ── */
        .edit-row { color: #bbb; background: none; border: none; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
        .edit-row:hover { color: #1a3a5c; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: #999; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
        .icon-btn:hover { background: #f0f3f8; color: #1a3a5c; }

        /* ── Quick log grid (2-col) ── */
        .quick-log-inputs { grid-template-columns: 1fr 1fr; }

        /* ── Home screen tiles ── */
        .home-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
        }
        .home-tile {
            background: white;
            border-radius: 18px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            border: none;
            width: 100%;
        }
        .home-tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.14); }
        .home-tile-icon { font-size: 48px; margin-bottom: 14px; display: block; }
        .home-tile-label { font-size: 15px; font-weight: 700; color: #1a3a5c; }
        .home-tile-sub { font-size: 12px; color: #999; margin-top: 4px; }
        .home-tile.labor { border-top: 4px solid #1a3a5c; }
        .home-tile.materials { border-top: 4px solid #16a34a; }
        .trade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 16px;
        }
        .trade-tile {
            background: white;
            border-radius: 16px;
            padding: 22px 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            border: none;
            width: 100%;
        }
        .trade-tile:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.13); }
        .trade-tile-icon { font-size: 36px; margin-bottom: 10px; display: block; }
        .trade-tile-label { font-size: 14px; font-weight: 700; color: #1a3a5c; }
        .trade-tile-sub { font-size: 11px; color: #999; margin-top: 3px; }
        .home-subtitle { text-align:center; font-size:13px; color:#aaa; margin-top:32px; }

        /* ── Materials screen ── */
        .mat-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: box-shadow 0.15s;
        }
        .mat-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
        .mat-name { font-size: 16px; font-weight: 700; color: #1a1a2e; }
        .mat-meta { font-size: 13px; color: #999; margin-top: 3px; }
        .mat-stock { text-align: right; }
        .mat-stock-num { font-size: 24px; font-weight: 800; color: #1a3a5c; line-height: 1; }
        .mat-stock-unit { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.4px; }
        .mat-stock-none { font-size: 13px; color: #ccc; font-style: italic; }
        .mat-action-row { display: flex; gap: 10px; margin-bottom: 14px; }
        .mat-action-btn { flex: 1; padding: 13px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .mat-delivery-btn { background: #1a3a5c; color: white; }
        .mat-eod-btn { background: #16a34a; color: white; }

        /* Material detail screen */
        .usage-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .usage-table th { background: #1a3a5c; color: white; padding: 8px 10px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .usage-table td { padding: 9px 10px; border-bottom: 1px solid #eee; }
        .usage-table tr:nth-child(even) td { background: #f5f8ff; }
        .usage-used { font-weight: 700; color: #1a3a5c; }

        /* ── Sync overlay ── */
        .sync-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #1a3a5c;
            z-index: 300;

            background: white;
            border-radius: 20px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;

        .sync-card h2 { font-size: 22px; font-weight: 800; color: #1a3a5c; margin-bottom: 8px; }
        .sync-card .sync-desc { font-size: 14px; color: #888; margin-bottom: 24px; line-height: 1.5; }
        .sync-card .sync-hint { margin-top: 16px; font-size: 12px; color: #bbb; line-height: 1.5; }

    </style>
</head>
<body>

<header>
    <button class="back-btn" id="backBtn" style="display:none">&#8592;</button>
    <h1 id="headerTitle">Corridor's Plus <span style="filter:brightness(0) invert(1)">➕</span></h1>
    <span class="sync-indicator" id="syncIndicator" style="display:none"></span>
    <button class="header-btn" id="homeBtn" onclick="navigate('home')" style="display:none">&#8962;</button>
    <button class="header-btn" id="exportBtn" onclick="openExportModal()" style="display:none">Export</button>
</header>

<div class="container" id="app"></div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>

        </div>
    </div>
</div>

<!-- Sync code overlay -->
<div class="sync-overlay" id="syncOverlay">
    <div class="sync-card">
        <h2>Corridor's Plus ➕</h2>
        <p class="sync-desc">Enter a team sync code to connect. Everyone on your crew uses the same code to share data in real time.</p>
        <div class="form-group" style="text-align:left">
            <label>Team Sync Code</label>
            <input id="syncCodeInput" type="text" placeholder="e.g. corridors-2026"
                style="text-transform:lowercase"
                onkeydown="if(event.key==='Enter')joinSync()" />
        </div>
        <button class="btn btn-primary" style="width:100%;padding:14px;font-size:16px;margin-top:4px" onclick="joinSync()">Connect</button>
        <p class="sync-hint">Share this code with your foreman so they can connect to the same data.<br>Keep it private — anyone with the code can view and edit.</p>
    </div>
</div>

<!-- Hidden file input for restore -->
<input type="file" id="restoreInput" accept=".json" style="display:none" onchange="restoreData(this)" />

<script>
// ── Firebase ──────────────────────────────────────────────────────────────────
const FIREBASE_CONFIG = {
    apiKey:            "AIzaSyA1qrqYCFXSfz2S4NkYYDp0j2mls6kviGk",
    authDomain:        "corridors-plus.firebaseapp.com",
    databaseURL:       "https://corridors-plus-default-rtdb.firebaseio.com",
    projectId:         "corridors-plus",
    storageBucket:     "corridors-plus.firebasestorage.app",
    messagingSenderId: "237703946611",
    appId:             "1:237703946611:web:d52dafcc7596060589a506"
};
let db         = null;
let syncCode   = null;
let _localWrite = false;
let _selectMode   = false;
let _selectedIds  = new Set();
let _floorSort    = 'default';

// ── Data ──────────────────────────────────────────────────────────────────────
let state = JSON.parse(localStorage.getItem('hallway_tracker_v2') || '{"floors":[],"materials":[]}');

// Normalize missing arrays
(state.floors || []).forEach(f => {
    (f.items || []).forEach(i => { if (!i.hoursLog) i.hoursLog = []; });
});
if (!state.materials) state.materials = [];

const DEFAULT_MATERIALS = [
    { name: 'Joint Compound',     unit: 'bags',  trade: 'Drywall'      },
    { name: 'Mesh Tape',          unit: 'rolls', trade: 'Drywall'      },
    { name: 'Corner Bead',        unit: 'pcs',   trade: 'Drywall'      },
    { name: 'Sandpaper',          unit: 'sheets',trade: 'Drywall'      },
    { name: 'Wall Primer',        unit: 'gal',   trade: 'Paint'        },
    { name: 'Ceiling Primer',     unit: 'gal',   trade: 'Paint'        },
    { name: 'Ceiling Paint',      unit: 'gal',   trade: 'Paint'        },
    { name: 'Door/Frame Paint',   unit: 'gal',   trade: 'Paint'        },
    { name: 'Frog Tape',          unit: 'rolls', trade: 'Paint'        },
    { name: 'Masking Tape',       unit: 'rolls', trade: 'Paint'        },
    { name: 'Wallcovering',       unit: 'rolls', trade: 'Wallcovering' },
    { name: 'Wallcovering Paste', unit: 'gal',   trade: 'Wallcovering' },
    { name: 'Baseboard',          unit: 'pcs',   trade: 'Carpentry'    },
    { name: 'Blocking',           unit: 'pcs',   trade: 'Carpentry'    },
    { name: 'Raceway',            unit: 'pcs',   trade: 'Carpentry'    },
    { name: 'Light Retrofit Kits',unit: 'units', trade: 'Electrical'   },
    { name: 'Outlets',            unit: 'pcs',   trade: 'Electrical'   },
    { name: 'Device Covers',      unit: 'pcs',   trade: 'Electrical'   },
    { name: 'Sconces',            unit: 'units', trade: 'Electrical'   },
    { name: 'EM Devices',         unit: 'pcs',   trade: 'Electrical'   },
];

// Backfill trade onto existing materials that predate the trade field
(function migrateTrades() {
    const lookup = {};
    DEFAULT_MATERIALS.forEach(d => { lookup[d.name.toLowerCase()] = d.trade; });
    let dirty = false;
    (state.materials || []).forEach(m => {
        if (!m.trade && lookup[m.name.toLowerCase()]) {
            m.trade = lookup[m.name.toLowerCase()];
            dirty = true;
        }
    });
    if (dirty) persist();
})();

function matCurrentStock(mat) {
    const log = mat.log || [];
    const eodEntries = log.filter(e => e.type === 'eod').sort((a,b) => b.date.localeCompare(a.date));
    return eodEntries.length > 0 ? eodEntries[0].qty : null;
}

function matLastEodDate(mat) {
    const eodEntries = (mat.log || []).filter(e => e.type === 'eod').sort((a,b) => b.date.localeCompare(a.date));
    return eodEntries.length > 0 ? eodEntries[0].date : null;
}

function matDailyUsage(mat) {
    const log = mat.log || [];
    const days = [...new Set(log.filter(e => e.type === 'eod').map(e => e.date))].sort();
    const result = [];
    days.forEach((date, i) => {
        const eodQty  = log.filter(e => e.type === 'eod' && e.date === date).reduce((s,e) => s + e.qty, 0);
        const delivered = log.filter(e => e.type === 'delivery' && e.date === date).reduce((s,e) => s + e.qty, 0);
        const prevDate  = i > 0 ? days[i-1] : null;
        const openingStock = prevDate ? log.filter(e => e.type === 'eod' && e.date === prevDate).reduce((s,e) => s + e.qty, 0) : 0;
        const onSite = openingStock + delivered;
        const used = Math.max(0, onSite - eodQty);
        result.push({ date, delivered, onSite, eodQty, used });
    });
    return result;
}

function persist() {
    localStorage.setItem('hallway_tracker_v2', JSON.stringify(state));
    if (db && syncCode) {
        _localWrite = true;
        db.ref('projects/' + syncCode + '/state').set(state)
          .then(() => setTimeout(() => { _localWrite = false; }, 500))
          .catch(() => { _localWrite = false; });
    }
}

function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function today() {
    return new Date().toISOString().slice(0, 10);
}

function yesterday() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return d.toISOString().slice(0, 10);
}

function formatDate(iso) {
    const [y, m, d] = iso.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(m)-1]} ${parseInt(d)}`;
}

function displayDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return `${m}-${d}-${y}`;
}

function addWeeks(iso, weeks) {
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + weeks * 7);
    return d.toISOString().slice(0, 10);
}

// ── View ──────────────────────────────────────────────────────────────────────
let view = { screen: 'home', floorId: null, itemId: null, matId: null };
let modalSaveFn = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
function entryManHours(e) {
    // new format: separate hours per type
    if (e.skilledHours !== undefined || e.laborerHours !== undefined) {
        return Number(e.skilled || 0) * Number(e.skilledHours || 0)
             + Number(e.laborer || 0) * Number(e.laborerHours || 0);
    }
    // previous format: skilled/laborer share one hours field
    if (e.skilled !== undefined || e.laborer !== undefined) {
        return (Number(e.skilled || 0) + Number(e.laborer || 0)) * Number(e.hours || 0);
    }
    // legacy format: workers field
    return Number(e.workers || 0) * Number(e.hours || 0);
}

function entryDisplay(e) {
    if (e.skilledHours !== undefined || e.laborerHours !== undefined) {
        return { skilled: Number(e.skilled||0), skilledHours: Number(e.skilledHours||0),
                 laborer: Number(e.laborer||0), laborerHours: Number(e.laborerHours||0) };
    }
    const skilled = e.skilled !== undefined ? Number(e.skilled) : Number(e.workers || 0);
    const laborer = e.laborer !== undefined ? Number(e.laborer) : 0;
    const h = Number(e.hours || 0);
    return { skilled, skilledHours: h, laborer, laborerHours: laborer > 0 ? h : 0 };
}

function itemManHours(item) {
    return (item.hoursLog || []).reduce((s, e) => s + entryManHours(e), 0);
}

function floorManHours(floor) {
    return (floor.items || []).reduce((s, i) => s + itemManHours(i), 0);
}

function floorProgress(floor) {
    if (!(floor.items || []).length) return 0;
    const done = floor.items.filter(i => (i.status || 'pending') === 'done').length;
    return Math.round((done / floor.items.length) * 100);
}

function getWeekRange() {
    const d   = new Date();
    const day = d.getDay();
    const mon = new Date(d); mon.setDate(d.getDate() - ((day + 6) % 7));
    const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
    return { start: mon.toISOString().slice(0, 10), end: fri.toISOString().slice(0, 10) };
}

function entrySkilledMH(e) {
    if (e.skilledHours !== undefined) return Number(e.skilled || 0) * Number(e.skilledHours || 0);
    if (e.skilled !== undefined)      return Number(e.skilled || 0) * Number(e.hours || 0);
    return Number(e.workers || 0) * Number(e.hours || 0);
}
function entryLaborerMH(e) {
    if (e.laborerHours !== undefined) return Number(e.laborer || 0) * Number(e.laborerHours || 0);
    if (e.laborer !== undefined)      return Number(e.laborer || 0) * Number(e.hours || 0);
    return 0;
}
function itemSkilledMH(item)  { return (item.hoursLog || []).reduce((s, e) => s + entrySkilledMH(e), 0); }
function itemLaborerMH(item)  { return (item.hoursLog || []).reduce((s, e) => s + entryLaborerMH(e), 0); }
function floorSkilledMH(floor) { return (floor.items || []).reduce((s, i) => s + itemSkilledMH(i), 0); }
function floorLaborerMH(floor) { return (floor.items || []).reduce((s, i) => s + itemLaborerMH(i), 0); }

function getFloor() { return state.floors.find(f => f.id === view.floorId); }
function getItem(f)  { return f.items.find(i => i.id === view.itemId); }

// ── Navigation ────────────────────────────────────────────────────────────────
function hasUnsavedHours() {
    if (view.screen !== 'item') return false;
    const s  = parseFloat(document.getElementById('ql_skilled')?.value)       || 0;
    const sh = parseFloat(document.getElementById('ql_skilled_hours')?.value) || 0;
    const l  = parseFloat(document.getElementById('ql_laborer')?.value)       || 0;
    const lh = parseFloat(document.getElementById('ql_laborer_hours')?.value) || 0;
    return (s + l + sh + lh) > 0;
}

function navigate(screen, floorId, itemId, matId, matTrade) {
    if (hasUnsavedHours() && !confirm('You have unsaved hours. Leave without logging?')) return;
    view = { screen, floorId: floorId || null, itemId: itemId || null, matId: matId || null, matTrade: matTrade || null };
    render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
    const app   = document.getElementById('app');
    const back  = document.getElementById('backBtn');
    const title = document.getElementById('headerTitle');
    const exp   = document.getElementById('exportBtn');

    back.style.display = 'none';
    exp.style.display  = 'none';
    document.getElementById('homeBtn').style.display = view.screen === 'home' ? 'none' : 'inline-block';

    if (view.screen === 'home') {
        title.innerHTML = `Corridor's Plus <span style="filter:brightness(0) invert(1)">➕</span>`;
        app.innerHTML = renderHome();

    } else if (view.screen === 'floors') {
        back.style.display = 'block';
        back.onclick = () => navigate('home');
        title.textContent = 'Labor Tracking';
        exp.style.display = state.floors.length > 0 ? 'block' : 'none';
        app.innerHTML = renderFloors();

    } else if (view.screen === 'floor') {
        const floor = getFloor();
        back.style.display = 'block';
        exp.style.display  = 'block';
        back.onclick = () => navigate('floors');
        title.textContent = floor.name;
        app.innerHTML = renderFloor(floor);

    } else if (view.screen === 'item') {
        const floor = getFloor();
        const item  = getItem(floor);
        back.style.display = 'block';
        exp.style.display  = 'block';
        back.onclick = () => navigate('floor', view.floorId);
        title.textContent = item.name;
        app.innerHTML = renderItem(floor, item);

    } else if (view.screen === 'materials') {
        back.style.display = 'block';
        if (view.matTrade) {
            back.onclick = () => navigate('materials');
            title.textContent = view.matTrade;
        } else {
            back.onclick = () => navigate('home');
            title.textContent = 'Material Inventory';
        }
        app.innerHTML = renderMaterials();

    } else if (view.screen === 'material') {
        back.style.display = 'block';
        back.onclick = () => navigate('materials', null, null, null, view.matTrade);
        const mat = state.materials.find(m => m.id === view.matId);
        title.textContent = mat ? mat.name : 'Material';
        app.innerHTML = renderMaterialDetail(mat);
    }
}

// ── Floors screen ─────────────────────────────────────────────────────────────
function renderFloorCard(floor) {
    const hrs  = floorManHours(floor);
    const pct  = floorProgress(floor);
    const pcls = floor.completed ? 'progress-100' : pct === 0 ? 'progress-0' : pct === 100 ? 'progress-100' : 'progress-mid';
    const plbl = floor.completed ? 'Complete' : pct === 0 ? 'Not started' : pct === 100 ? 'Complete' : `${pct}% done`;
    const checked = _selectedIds.has(floor.id);
    if (_selectMode) {
        return `<div class="floor-card${floor.completed ? ' completed' : ''}${checked ? ' selected' : ''}" onclick="toggleFloorSelect('${floor.id}')">
            <input type="checkbox" class="floor-card-checkbox" ${checked ? 'checked' : ''} onclick="event.stopPropagation();toggleFloorSelect('${floor.id}')">
            <div style="flex:1">
                <div class="floor-card-name">${floor.name}</div>
                <div class="floor-card-meta">Started ${displayDate(floor.startDate)} &nbsp;·&nbsp; Est. end ${floor.startDate ? displayDate(addWeeks(floor.startDate, 6)) : '—'} &nbsp;·&nbsp; ${hrs} man-hrs</div>
            </div>
            <span class="progress-pill ${pcls}">${plbl}</span>
        </div>`;
    }
    return `<div class="floor-card${floor.completed ? ' completed' : ''}" onclick="navigate('floor','${floor.id}')">
        <div>
            <div class="floor-card-name">${floor.name}</div>
            <div class="floor-card-meta">Started ${displayDate(floor.startDate)} &nbsp;·&nbsp; Est. end ${floor.startDate ? displayDate(addWeeks(floor.startDate, 6)) : '—'} &nbsp;·&nbsp; ${hrs} man-hrs</div>
        </div>
        <div class="floor-card-right">
            <span class="progress-pill ${pcls}">${plbl}</span>
            <span class="floor-card-arrow">›</span>
        </div>
    </div>`;
}

// ── Home screen ───────────────────────────────────────────────────────────────
function renderHome() {
    const totalFloors  = (state.floors || []).length;
    const totalHrs     = (state.floors || []).reduce((s,f) => s + floorManHours(f), 0);
    const matCount     = (state.materials || []).length;
    const lastEod      = (state.materials || []).reduce((latest, m) => {
        const d = matLastEodDate(m); return d && d > latest ? d : latest;
    }, '');

    return `
        <div class="home-grid">
            <button class="home-tile labor" onclick="navigate('floors')">
                <span class="home-tile-icon">👷</span>
                <div class="home-tile-label">Labor Tracking</div>
                <div class="home-tile-sub">${totalFloors} floor${totalFloors !== 1 ? 's' : ''} · ${totalHrs} man-hrs</div>
            </button>
            <button class="home-tile materials" onclick="navigate('materials')">
                <span class="home-tile-icon">🧰</span>
                <div class="home-tile-label">Material Inventory</div>
                <div class="home-tile-sub">${matCount} material${matCount !== 1 ? 's' : ''}${lastEod ? ' · last count ' + displayDate(lastEod) : ''}</div>
            </button>
        </div>
        <div class="home-subtitle">Georgetown Plaza · Corridor Renovation</div>`;
}

function renderFloors() {
    let html = '';

    // Backup warning
    const lastBackup  = localStorage.getItem('hallway_last_backup');
    const daysSince   = lastBackup ? Math.floor((new Date(today()) - new Date(lastBackup)) / 86400000) : null;
    if (state.floors.length > 0 && (daysSince === null || daysSince >= 7)) {
        const msg = lastBackup ? `Last backup was ${daysSince} day${daysSince !== 1 ? 's' : ''} ago.` : "You haven't backed up yet.";
        html += `<div class="backup-warning">
            <span>&#9888; ${msg} Back up your data.</span>
            <button class="backup-warn-btn" onclick="backupData()">Backup Now</button>
        </div>`;
    }

    const sortFloors = arr => {
        if (_floorSort === 'name')    return [...arr].sort((a,b) => a.name.localeCompare(b.name));
        if (_floorSort === 'date')    return [...arr].sort((a,b) => (a.startDate||'').localeCompare(b.startDate||''));
        if (_floorSort === 'hours')   return [...arr].sort((a,b) => floorManHours(b) - floorManHours(a));
        return arr;
    };
    const activeFloors    = sortFloors(state.floors.filter(f => !f.completed));
    const completedFloors = sortFloors(state.floors.filter(f =>  f.completed));

    if (state.floors.length === 0) {
        html += `<div class="empty-state">No floors yet.<br>Add your first floor below.</div>`;
    } else {
        const totalHrs   = state.floors.reduce((s, f) => s + floorManHours(f), 0);
        const totalItems = state.floors.reduce((s, f) => s + f.items.length, 0);

        html += `<div class="stats-row">
            <div class="stat-card"><div class="stat-value">${state.floors.length}</div><div class="stat-label">Floors</div></div>
            <div class="stat-card"><div class="stat-value">${totalItems}</div><div class="stat-label">Items</div></div>
            <div class="stat-card"><div class="stat-value">${totalHrs}</div><div class="stat-label">Man-Hrs</div></div>
        </div>`;

        // Overall progress bar
        const totalItemCount = state.floors.reduce((s, f) => s + (f.items || []).length, 0);
        const doneItemCount  = state.floors.reduce((s, f) => s + (f.items || []).filter(i => (i.status||'pending') === 'done').length, 0);
        const overallPct     = totalItemCount > 0 ? Math.round((doneItemCount / totalItemCount) * 100) : 0;
        html += `<div style="background:white;border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                <span style="font-size:13px;font-weight:600;color:#1a3a5c">Overall Project Progress</span>
                <span style="font-size:13px;font-weight:700;color:#1a3a5c">${overallPct}% &nbsp;·&nbsp; ${doneItemCount}/${totalItemCount} items done</span>
            </div>
            <div style="background:#e8eef8;border-radius:99px;height:10px;overflow:hidden">
                <div style="background:${overallPct===100?'#16a34a':'#1a3a5c'};height:100%;width:${overallPct}%;border-radius:99px;transition:width 0.3s"></div>
            </div>
        </div>`;

        // Week at a glance
        const { start: wStart, end: wEnd } = getWeekRange();
        const inWeek     = d => d >= wStart && d <= wEnd;
        const weekFloors = state.floors.map(f => ({
            name: f.name,
            hrs:  (f.items || []).reduce((s, i) => s + (i.hoursLog || []).filter(h => inWeek(h.date)).reduce((ss, e) => ss + entryManHours(e), 0), 0)
        })).filter(f => f.hrs > 0);
        const weekTotal = weekFloors.reduce((s, f) => s + f.hrs, 0);

        html += `<div class="week-summary">
            <div class="week-summary-title">This Week &nbsp;·&nbsp; ${displayDate(wStart)} – ${displayDate(wEnd)}</div>`;
        if (weekFloors.length === 0) {
            html += `<div class="notes-empty">No hours logged this week.</div>`;
        } else {
            weekFloors.forEach(f => {
                html += `<div class="week-floor-row"><span>${f.name}</span><span class="week-floor-total">${f.hrs} man-hrs</span></div>`;
            });
            html += `<div class="week-grand">WEEK TOTAL: ${weekTotal} MAN-HOURS</div>`;
        }
        html += `</div>`;

        html += `<button class="log-today-btn" onclick="openGlobalLogToday()">+ Log Today's Hours</button>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="font-size:13px;color:#999;white-space:nowrap">Sort:</span>
            <select onchange="_floorSort=this.value;render()" style="flex:1;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:white">
                <option value="default" ${_floorSort==='default'?'selected':''}>Default (added order)</option>
                <option value="name"    ${_floorSort==='name'   ?'selected':''}>Name (A–Z)</option>
                <option value="date"    ${_floorSort==='date'   ?'selected':''}>Start Date</option>
                <option value="hours"   ${_floorSort==='hours'  ?'selected':''}>Man-Hours (most first)</option>
            </select>
        </div>`;

        const allIds = state.floors.map(f => f.id);
        const allChecked = allIds.every(id => _selectedIds.has(id));
        html += `<div class="select-bar">
            <span class="select-bar-info">${_selectMode ? (_selectedIds.size > 0 ? `${_selectedIds.size} selected` : 'Tap floors to select') : ''}</span>
            ${_selectMode && _selectedIds.size > 0 ? `<button class="delete-selected-btn" onclick="deleteSelectedFloors()">Delete ${_selectedIds.size}</button>` : ''}
            ${_selectMode ? `<button class="btn btn-secondary" onclick="toggleSelectAll()">${allChecked ? 'Deselect All' : 'Select All'}</button>` : ''}
            <button class="btn btn-secondary" onclick="toggleSelectMode()">${_selectMode ? 'Cancel' : 'Select'}</button>
        </div>`;

        activeFloors.forEach(floor => { html += renderFloorCard(floor); });

        if (completedFloors.length > 0) {
            html += `<div class="completed-section-header">Completed Floors</div>`;
            completedFloors.forEach(floor => { html += renderFloorCard(floor); });
        }
    }

    if (state.floors.length === 0) {
        html += `<button class="add-btn" style="background:#1a3a5c;margin-bottom:10px" onclick="loadGeorgetownSchedule()">&#128203; Import Georgetown Plaza Schedule</button>`;
    } else {
        const allLoaded = GEORGETOWN_SCHEDULE.every(f => state.floors.some(sf => sf.name === f.name));
        if (!allLoaded) {
            html += `<button class="btn btn-secondary" style="width:100%;margin-bottom:10px;padding:12px" onclick="loadGeorgetownSchedule()">&#128203; Import Georgetown Plaza Schedule</button>`;
        }
    }
    html += `<button class="add-btn" onclick="openAddFloor()">+ Add Floor</button>`;
    html += `<div class="backup-row">
        <button class="btn btn-secondary" onclick="backupData()">&#8681; Backup</button>
        <button class="btn btn-secondary" onclick="document.getElementById('restoreInput').click()">&#8679; Restore</button>
        <button class="btn btn-secondary" onclick="disconnectSync()" title="Sync code: ${syncCode || '—'}">&#8635; Sync</button>
    </div>`;

    return html;
}

// ── Materials screen ──────────────────────────────────────────────────────────
const TRADE_ORDER  = ['Drywall','Paint','Wallcovering','Carpentry','Electrical','Other'];
const TRADE_ICONS  = { Drywall:'🧱', Paint:'🖌️', Wallcovering:'🌿', Carpentry:'🪚', Electrical:'⚡', Other:'📦' };
const TRADE_COLORS = { Drywall:'#b45309', Paint:'#1d4ed8', Wallcovering:'#15803d', Carpentry:'#92400e', Electrical:'#7c3aed', Other:'#475569' };

function renderMaterials() {
    const mats = state.materials || [];
    let html = '';

    if (mats.length === 0) {
        html += `<div class="empty-state">No materials yet.<br>Load defaults or add manually.</div>`;
        html += `<button class="add-btn" style="background:#1a3a5c;margin-bottom:10px" onclick="loadDefaultMaterials()">&#128230; Load Default Materials</button>`;
        html += `<button class="add-btn" onclick="openAddMaterial()">+ Add Material</button>`;
        return html;
    }

    // Group by trade
    const byTrade = {};
    mats.forEach(mat => {
        const t = mat.trade || 'Other';
        if (!byTrade[t]) byTrade[t] = [];
        byTrade[t].push(mat);
    });
    const tradeKeys = TRADE_ORDER.filter(t => byTrade[t]);
    Object.keys(byTrade).forEach(t => { if (!TRADE_ORDER.includes(t)) tradeKeys.push(t); });

    // If a trade is selected, show that trade's material list
    if (view.matTrade) {
        const tradeMats = byTrade[view.matTrade] || [];
        const delivToday = tradeMats.reduce((s,m) => s + (m.log||[]).filter(e => e.type==='delivery' && e.date===today()).reduce((ss,e) => ss+e.qty, 0), 0);
        html += `<div class="stats-row" style="grid-template-columns:1fr 1fr">
            <div class="stat-card"><div class="stat-value">${tradeMats.length}</div><div class="stat-label">Materials</div></div>
            <div class="stat-card"><div class="stat-value">${delivToday}</div><div class="stat-label">Delivered Today</div></div>
        </div>`;
        html += `<div class="mat-action-row">
            <button class="mat-action-btn mat-delivery-btn" onclick="openLogDeliveryForTrade('${view.matTrade}')">&#128666; Log Delivery</button>
            <button class="mat-action-btn mat-eod-btn" onclick="openLogEodForTrade('${view.matTrade}')">&#128337; Log EOD Count</button>
        </div>`;
        tradeMats.forEach(mat => {
            const stock    = matCurrentStock(mat);
            const lastDate = matLastEodDate(mat);
            const deliv    = (mat.log||[]).filter(e => e.type==='delivery' && e.date===today()).reduce((s,e) => s+e.qty, 0);
            html += `<div class="mat-card" onclick="navigate('material',null,null,'${mat.id}','${view.matTrade}')">
                <div>
                    <div class="mat-name">${mat.name}</div>
                    <div class="mat-meta">${mat.unit}${deliv > 0 ? ` &nbsp;·&nbsp; <span style="color:#16a34a;font-weight:600">+${deliv} delivered today</span>` : ''}</div>
                    ${lastDate ? `<div class="mat-meta">Last count: ${displayDate(lastDate)}</div>` : ''}
                </div>
                <div class="mat-stock">
                    ${stock !== null
                        ? `<div class="mat-stock-num">${stock}</div><div class="mat-stock-unit">${mat.unit}</div>`
                        : `<div class="mat-stock-none">No count yet</div>`}
                </div>
            </div>`;
        });
        html += `<button class="add-btn" onclick="openAddMaterial()">+ Add Material</button>`;
        return html;
    }

    // Trade tile grid
    const totalDeliveriesToday = mats.reduce((s, m) => s + (m.log||[]).filter(e => e.type==='delivery' && e.date===today()).reduce((ss,e) => ss+e.qty, 0), 0);
    html += `<div class="stats-row" style="grid-template-columns:1fr 1fr">
        <div class="stat-card"><div class="stat-value">${mats.length}</div><div class="stat-label">Materials</div></div>
        <div class="stat-card"><div class="stat-value">${totalDeliveriesToday}</div><div class="stat-label">Delivered Today</div></div>
    </div>`;
    html += `<div class="trade-grid">`;
    tradeKeys.forEach(trade => {
        const tradeMats = byTrade[trade];
        const color = TRADE_COLORS[trade] || '#475569';
        const icon  = TRADE_ICONS[trade]  || '📦';
        const deliv = tradeMats.reduce((s,m) => s + (m.log||[]).filter(e => e.type==='delivery' && e.date===today()).reduce((ss,e) => ss+e.qty, 0), 0);
        const sub   = deliv > 0 ? `+${deliv} delivered today` : `${tradeMats.length} item${tradeMats.length !== 1 ? 's' : ''}`;
        html += `<button class="trade-tile" style="border-top:4px solid ${color}" onclick="navigate('materials',null,null,null,'${trade}')">
            <span class="trade-tile-icon">${icon}</span>
            <div class="trade-tile-label">${trade}</div>
            <div class="trade-tile-sub">${sub}</div>
        </button>`;
    });
    html += `</div>`;
    html += `<button class="btn btn-secondary" style="width:100%;margin-bottom:10px;margin-top:20px" onclick="exportMaterialsReport()">&#8681; Export Usage Report</button>`;
    html += `<button class="add-btn" onclick="openAddMaterial()">+ Add Material</button>`;
    return html;
}

function renderMaterialDetail(mat) {
    if (!mat) return `<div class="empty-state">Material not found.</div>`;
    const usage  = matDailyUsage(mat);
    const stock  = matCurrentStock(mat);
    const totalUsed = usage.reduce((s, d) => s + d.used, 0);
    const totalDel  = (mat.log||[]).filter(e => e.type==='delivery').reduce((s,e) => s+e.qty, 0);

    let html = `<div class="stats-row">
        <div class="stat-card"><div class="stat-value">${stock !== null ? stock : '—'}</div><div class="stat-label">In Stock</div></div>
        <div class="stat-card"><div class="stat-value">${totalDel}</div><div class="stat-label">Total Delivered</div></div>
        <div class="stat-card"><div class="stat-value">${totalUsed}</div><div class="stat-label">Total Used</div></div>
    </div>`;

    html += `<div class="mat-action-row">
        <button class="mat-action-btn mat-delivery-btn" onclick="openLogDeliveryFor('${mat.id}')">&#128666; Log Delivery</button>
        <button class="mat-action-btn mat-eod-btn" onclick="openLogEodFor('${mat.id}')">&#128337; Log EOD Count</button>
    </div>`;

    if (usage.length === 0) {
        html += `<div class="card"><div class="empty-state">No EOD counts logged yet.</div></div>`;
    } else {
        html += `<div class="card"><table class="usage-table">
            <thead><tr><th>Date</th><th>Delivered</th><th>On Site</th><th>EOD Count</th><th>Used</th></tr></thead>
            <tbody>`;
        [...usage].reverse().forEach(d => {
            html += `<tr>
                <td>${displayDate(d.date)}</td>
                <td>${d.delivered > 0 ? `+${d.delivered}` : '—'}</td>
                <td>${d.onSite} ${mat.unit}</td>
                <td>${d.eodQty} ${mat.unit}</td>
                <td class="usage-used">${d.used} ${mat.unit}</td>

        });
        html += `</tbody></table></div>`;
    }

    html += `<div class="delete-zone">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-secondary btn-sm" onclick="renameMaterial('${mat.id}')">&#9998; Rename</button>
            <button class="btn btn-danger btn-sm" onclick="deleteMaterial('${mat.id}')">Delete Material</button>
        </div>
    </div>`;

    return html;
}

function renderFloor(floor) {
    const hrs       = floorManHours(floor);

    const done      = floor.items.filter(i => (i.status || 'pending') === 'done').length;

    let html = `<div class="stats-row">
        <div class="stat-card"><div class="stat-value">${hrs}</div><div class="stat-label">Man-Hours</div></div>
        <div class="stat-card"><div class="stat-value">${sessions}</div><div class="stat-label">Sessions</div></div>
        <div class="stat-card"><div class="stat-value">${done}/${floor.items.length}</div><div class="stat-label">Done</div></div>
    </div>
    <div class="stats-row" style="grid-template-columns:1fr 1fr;margin-bottom:8px">
        <div class="stat-card"><div class="stat-value">${skilledMH}</div><div class="stat-label">Skilled MH</div></div>
        <div class="stat-card"><div class="stat-value">${laborerMH}</div><div class="stat-label">Laborer MH</div></div>
    </div>`;

    // Notes card
    html += `<div class="notes-card">
        <div class="notes-card-header">
            <span class="notes-card-label">Floor Notes</span>
            <button class="notes-edit-btn" onclick="openEditNotes('${floor.id}')">${floor.notes ? 'Edit' : '+ Add'}</button>
        </div>
        ${floor.notes
            ? `<div class="notes-card-text">${floor.notes.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>`
            : `<div class="notes-empty">No notes yet.</div>`}
    </div>`;

    html += `<button class="log-today-btn" onclick="openFloorLogToday('${floor.id}')">+ Log Today's Hours</button>`;

    if (floor.items.length === 0) {
        html += `<div class="card"><div class="empty-state">No work items yet.</div></div>`;
    } else {
        html += `<div class="tile-grid">`;
        floor.items.forEach((item, idx) => {

// ── Quick log ─────────────────────────────────────────────────────────────────
function qlPreview() {
    const s  = parseFloat(document.getElementById('ql_skilled')?.value)       || 0;
    const sh = parseFloat(document.getElementById('ql_skilled_hours')?.value) || 0;
    const l  = parseFloat(document.getElementById('ql_laborer')?.value)       || 0;
    const lh = parseFloat(document.getElementById('ql_laborer_hours')?.value) || 0;
    const mh = s * sh + l * lh;
    const el = document.getElementById('ql_preview');
    if (el) el.value = mh > 0 ? String(mh) : '';
}

function quickLog(floorId, itemId) {
    const skilled       = parseFloat(document.getElementById('ql_skilled')?.value)       || 0;
    const skilledHours  = parseFloat(document.getElementById('ql_skilled_hours')?.value) || 0;
    const laborer       = parseFloat(document.getElementById('ql_laborer')?.value)       || 0;
    const laborerHours  = parseFloat(document.getElementById('ql_laborer_hours')?.value) || 0;
    const date          = document.getElementById('ql_date')?.value;
    const note          = (document.getElementById('ql_note')?.value || '').trim();
    if (skilled + laborer < 1) { alert('Enter at least one Skilled or Laborer worker.'); return; }
    if (skilled > 0 && skilledHours <= 0) { alert('Enter hours for Skilled workers.'); return; }
    if (laborer > 0 && laborerHours <= 0) { alert('Enter hours for Laborer workers.'); return; }
    if (skilledHours > 0 && skilled <= 0) { alert('Enter a Skilled worker count.'); return; }
    if (laborerHours > 0 && laborer <= 0) { alert('Enter a Laborer worker count.'); return; }
    const floor = state.floors.find(f => f.id === floorId);
    const item  = floor.items.find(i => i.id === itemId);
    const entry = { date, skilled, skilledHours, laborer, laborerHours };
    if (note) entry.note = note;
    item.hoursLog.push(entry);
    if ((item.status || 'pending') === 'pending') item.status = 'active';
    persist();
    render();
    if (skilledHours > 0) localStorage.setItem('hallway_last_skld_hrs', String(skilledHours));
    if (laborerHours > 0) localStorage.setItem('hallway_last_lab_hrs',  String(laborerHours));
    setTimeout(() => {
        document.getElementById('ql_skilled').value = '0';
        document.getElementById('ql_skilled_hours').value = '';
        document.getElementById('ql_laborer').value = '0';
        document.getElementById('ql_laborer_hours').value = '';
        const p = document.getElementById('ql_preview');
        if (p) p.value = '';
        const n = document.getElementById('ql_note');
        if (n) n.value = '';
        document.getElementById('ql_skilled_hours')?.focus();
    }, 50);
}

// ── Date chips ────────────────────────────────────────────────────────────────
function setQlDate(val) {
    const input = document.getElementById('ql_date');
    if (input) input.value = val;
    const t   = today();
    const yes = yesterday();
    document.getElementById('chip_today')?.classList.toggle('active', val === t);
    document.getElementById('chip_yesterday')?.classList.toggle('active', val === yes);
    const other = document.getElementById('chip_other');
    if (val !== t && val !== yes) {
        other?.classList.add('active');
    } else {
        other?.classList.remove('active');
        document.getElementById('date_picker_wrap')?.classList.remove('open');
    }
}

function toggleDatePicker() {
    const wrap = document.getElementById('date_picker_wrap');
    if (!wrap) return;
    wrap.classList.toggle('open');
    if (wrap.classList.contains('open')) {
        setTimeout(() => document.getElementById('ql_date_picker')?.showPicker?.(), 50);
    }
}

function setQlDateFromPicker(val) {
    if (!val) return;
    setQlDate(val);
    document.getElementById('date_picker_wrap')?.classList.remove('open');
}

// ── Status ────────────────────────────────────────────────────────────────────
function setStatus(floorId, itemId, status) {
    const floor = state.floors.find(f => f.id === floorId);
    const item  = floor.items.find(i => i.id === itemId);
    item.status = status;
    persist();
    render();
    setTimeout(() => {
        const h = document.getElementById('ql_hours');
        if (h) h.focus();
    }, 50);
}

// ── Modal helpers ─────────────────────────────────────────────────────────────
function openModal(title, bodyHtml, saveFn, hideActions) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML    = bodyHtml;
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('modalActions').style.display = hideActions ? 'none' : 'flex';

function _openLogTodayModal(floors) {
    const t   = today();
    const yes = yesterday();

    const calIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
    let rows = floors.map((floor, fi) => {
        const itemRows = floor.items.map((item, idx) => `
            <div class="daily-row">
                <div class="daily-row-label">${item.name}</div>
                <div class="form-row">
                    <div class="form-group" style="margin-bottom:0">
                        <label>Skilled</label>
                        <input type="number" min="0" id="lt_s_${fi}_${idx}" placeholder="—" />
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label>Skld Hrs</label>
                        <input type="number" min="0.5" step="0.5" id="lt_sh_${fi}_${idx}" placeholder="—" />
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label>Laborer</label>
                        <input type="number" min="0" id="lt_l_${fi}_${idx}" placeholder="—" />
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label>Lab Hrs</label>
                        <input type="number" min="0.5" step="0.5" id="lt_lh_${fi}_${idx}" placeholder="—" />
                    </div>
                </div>
            </div>`).join('');
        return `<div class="daily-floor-header">${floor.name}</div>${itemRows}`;
    }).join('');

    openModal("Log Today's Hours", `
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
            <button class="date-chip active" id="lt_chip_today"     onclick="setLtDate('${t}')">Today</button>
            <button class="date-chip"        id="lt_chip_yesterday" onclick="setLtDate('${yes}')">Yesterday</button>
            <button class="cal-btn"          id="lt_chip_other"     onclick="toggleLtPicker()">${calIcon}</button>
        </div>
        <div class="date-picker-wrap" id="lt_picker_wrap">
            <input type="date" id="lt_date_picker" onchange="setLtDateFromPicker(this.value)" style="margin-bottom:10px" />
        </div>
        <input type="hidden" id="lt_date" value="${t}" />
        <p style="font-size:13px;color:#999;margin-bottom:6px">Leave blank for items not worked today.</p>
        ${rows}
    `, () => {
        const date = document.getElementById('lt_date').value;
        let saved  = 0;
        floors.forEach((floor, fi) => {
            floor.items.forEach((item, idx) => {
                const skilled      = parseFloat(document.getElementById(`lt_s_${fi}_${idx}`)?.value)  || 0;
                const skilledHours = parseFloat(document.getElementById(`lt_sh_${fi}_${idx}`)?.value) || 0;
                const laborer      = parseFloat(document.getElementById(`lt_l_${fi}_${idx}`)?.value)  || 0;
                const laborerHours = parseFloat(document.getElementById(`lt_lh_${fi}_${idx}`)?.value) || 0;
                const mh = skilled * skilledHours + laborer * laborerHours;
                if (skilledHours > 0 && skilled <= 0) { alert(`${item.name}: enter a Skilled worker count.`); return; }
                if (laborerHours > 0 && laborer <= 0) { alert(`${item.name}: enter a Laborer worker count.`); return; }
                if (skilled > 0 && skilledHours <= 0) { alert(`${item.name}: enter hours for Skilled workers.`); return; }
                if (laborer > 0 && laborerHours <= 0) { alert(`${item.name}: enter hours for Laborer workers.`); return; }
                if (mh > 0) {
                    item.hoursLog.push({ date, skilled, skilledHours, laborer, laborerHours });
                    if ((item.status || 'pending') === 'pending') item.status = 'active';
                    saved++;
                }
            });
        });
        if (saved === 0) { alert('Fill in at least one item.'); return; }
        persist(); closeModal(); render();
    });
}

function setLtDate(val) {
    const input = document.getElementById('lt_date');
    if (input) input.value = val;
    const t   = today();
    const yes = yesterday();
    document.getElementById('lt_chip_today')?.classList.toggle('active', val === t);
    document.getElementById('lt_chip_yesterday')?.classList.toggle('active', val === yes);
    const other = document.getElementById('lt_chip_other');
    if (val !== t && val !== yes) {
        other?.classList.add('active');
    } else {
        other?.classList.remove('active');
        document.getElementById('lt_picker_wrap')?.classList.remove('open');
    }
}

// ── Backup / Restore ──────────────────────────────────────────────────────────
function backupData() {
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `hallway_backup_${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem('hallway_last_backup', today());
    render();
}

function restoreData(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.floors) throw new Error('Invalid file');
            if (!confirm(`This will replace all current data with the backup. Continue?`)) return;
            state = data;
            if (!state.materials) state.materials = [];
            (state.floors || []).forEach(f => { (f.items || []).forEach(i => { if (!i.hoursLog) i.hoursLog = []; }); });
            persist();
            render();
            alert('Data restored successfully.');
        } catch {
            alert('Invalid backup file. Please select a valid .json backup.');
        }
        input.value = '';
    };
    reader.readAsText(file);
}

                <option value="summary">Cross-Floor Summary (PDF)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Report Period</label>
            <select id="exp_period" onchange="updateExportFields()">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
        </div>
        <div id="exp_fields">
            <div class="form-group"><label>Date</label><input id="exp_date" type="date" value="${today()}" /></div>
        </div>
    `, () => {
        const period = document.getElementById('exp_period').value;
        let start, end, label;

        if (period === 'daily') {
            const d = document.getElementById('exp_date').value;
            start = d; end = d; label = d;
        } else if (period === 'weekly') {
            const d   = new Date(document.getElementById('exp_week').value + 'T00:00:00');
            const day = d.getDay();
            const mon = new Date(d); mon.setDate(d.getDate() - ((day + 6) % 7));
            const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
            start = mon.toISOString().slice(0, 10);
            end   = sun.toISOString().slice(0, 10);
            label = `week_${start}`;
        } else {
            const val = document.getElementById('exp_month').value;
            start = `${val}-01`;
            const last = new Date(val.split('-')[0], val.split('-')[1], 0);
            end   = last.toISOString().slice(0, 10);
            label = val;
        }

        const format   = document.getElementById('exp_format').value;
        const floorSel = document.getElementById('exp_floor').value;
        const floors   = floorSel === 'all' ? state.floors
                                             : state.floors.filter(f => f.id === floorSel);
        const inRange  = d => d >= start && d <= end;

        if (format === 'summary') {
            let periodLabel;
            if (period === 'weekly') periodLabel = `Week of ${shortDate(start)} - ${shortDate(end)}`;
            else if (period === 'monthly') { const [y,m]=start.split('-'); const mo=['January','February','March','April','May','June','July','August','September','October','November','December']; periodLabel=`${mo[parseInt(m)-1]} ${y}`; }
            else periodLabel = shortDate(start);
            exportCrossFloorSummary(state.floors, inRange, periodLabel);
        } else if (format === 'pdf') {
            exportPDF(floors, inRange, label, start, end, period);
        } else {
            const prefix = floorSel === 'all' ? 'all-floors' : floors[0].name.replace(/\s+/g, '-');
            const rows   = [['FLOOR', 'ITEM', 'DATE', 'SKILLED', 'SKILLED HRS', 'LABORER', 'LABORER HRS', 'MAN-HOURS']];
            floors.forEach(floor => {
                floor.items.forEach(item => {
                    const entries = item.hoursLog.filter(h => inRange(h.date));
                    if (entries.length === 0) return;
                    entries.forEach(h => {
                        const d = entryDisplay(h);
                        rows.push([floor.name, item.name, displayDate(h.date),
                            d.skilled, d.skilledHours, d.laborer, d.laborerHours, entryManHours(h)]);
                    });
                    const total  = entries.reduce((s, h) => s + entryManHours(h), 0);
                    const sk = entries.reduce((s, h) => s + entrySkilledMH(h), 0);
                    const lb = entries.reduce((s, h) => s + entryLaborerMH(h), 0);
                    rows.push([floor.name, item.name.toUpperCase() + ' — TOTAL', '', '', sk, '', lb, total]);
                    rows.push(['', '', '', '', '', '', '', '']);
                });
            });
            downloadCSV(toCSV(rows), `${prefix}-labor-${label}.csv`);
        }
        closeModal();
    });
}

function shortDate(iso) {
    const [y, m, d] = iso.split('-');
    return `${m}/${d}/${y.slice(2)}`;
}

function exportPDF(floors, inRange, label, start, end, period) {
    let periodLabel;
    if (period === 'weekly') {
        periodLabel = `Week of ${shortDate(start)} - ${shortDate(end)}`;
    } else if (period === 'monthly') {
        const [y, m] = start.split('-');
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        periodLabel = `${months[parseInt(m)-1]} ${y}`;
    } else {
        periodLabel = shortDate(start);
    }

    const isMulti    = floors.length > 1;
    const reportTitle = isMulti ? 'All Floors Labor Report' : `${floors[0].name} Labor Report`;
    let   bodyHtml   = '';
    let   overallTotal = 0, overallSk = 0, overallLb = 0;

    floors.forEach((floor, fi) => {
        let tableRows = '';
        let floorTotal = 0, floorSk = 0, floorLb = 0;

        floor.items.forEach(item => {
            const entries = item.hoursLog.filter(h => inRange(h.date));
            if (entries.length === 0) return;

            entries.forEach((h, hi) => {
                const d  = entryDisplay(h);
                const mh = entryManHours(h);
                const firstRow = hi === 0 ? ' class="item-first-row"' : '';
                tableRows += `<tr${firstRow}>
                    <td>${item.name}</td>
                    <td>${displayDate(h.date)}</td>
                    <td>${d.skilled}</td>
                    <td>${d.skilledHours}</td>
                    <td>${d.laborer}</td>
                    <td>${d.laborerHours || '—'}</td>
                    <td>${mh}</td>
                    <td style="color:#666;font-size:10px">${h.note || ''}</td>
                </tr>`;
            });

            const total = entries.reduce((s, h) => s + entryManHours(h), 0);
            const sk    = entries.reduce((s, h) => s + entrySkilledMH(h), 0);
            const lb    = entries.reduce((s, h) => s + entryLaborerMH(h), 0);
            floorTotal += total; floorSk += sk; floorLb += lb;
            tableRows += `<tr class="total-row">
                <td colspan="2">${item.name.toUpperCase()} — TOTAL</td>
                <td>—</td>
                <td>${sk}</td>
                <td>—</td>
                <td>${lb}</td>
                <td>${total}</td>
                <td></td>
            </tr>`;
        });

        if (!tableRows) return;
        overallTotal += floorTotal; overallSk += floorSk; overallLb += floorLb;

        const pageBreak = (isMulti && fi > 0) ? 'page-break-before:always;padding-top:24px;' : '';
        bodyHtml += `
        <div style="${pageBreak}">
            ${isMulti ? `<div class="floor-heading">${floor.name}</div>` : ''}
            <table>
                <thead><tr>
                    <th>Item</th><th>Date</th><th>Skilled</th><th>Skld Hrs</th><th>Laborer</th><th>Lab Hrs</th><th>Man-Hours</th><th>Note</th>
                </tr></thead>
                <tbody>${tableRows}</tbody>
            </table>
            <div class="floor-total">FLOOR TOTAL: ${floorTotal} MAN-HOURS &nbsp;·&nbsp; Skilled: ${floorSk} &nbsp;·&nbsp; Laborer: ${floorLb}</div>
        </div>`;
    });

    if (!bodyHtml) {
        alert('No hours logged for this period.');
        return;
    }

    const grandLine = isMulti
        ? `<div class="grand-total">GRAND TOTAL (ALL FLOORS): ${overallTotal} MAN-HOURS &nbsp;·&nbsp; Skilled: ${overallSk} &nbsp;·&nbsp; Laborer: ${overallLb}</div>`
        : `<div class="grand-total">GRAND TOTAL: ${overallTotal} MAN-HOURS &nbsp;·&nbsp; Skilled: ${overallSk} &nbsp;·&nbsp; Laborer: ${overallLb}</div>`;

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${reportTitle}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; font-size: 12px; color: #111; padding: 32px; }
        .header { margin-bottom: 24px; }
        .header h1 { font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #1a3a5c; }
        .header .meta { font-size: 12px; color: #666; margin-top: 4px; }
        .floor-heading { font-size: 15px; font-weight: 800; text-transform: uppercase; color: #1a3a5c; margin-bottom: 8px; border-top: 2px solid #1a3a5c; padding-bottom: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        thead tr { background: #1a3a5c; color: white; }
        thead th { padding: 9px 10px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        tbody tr:nth-child(even) { background: #f5f8ff; }
        tbody td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        .total-row td { font-weight: 700; text-transform: uppercase; background: #e8eef8 !important; color: #1a3a5c; border-top: 2px solid #1a3a5c; font-size: 11px; }
        .item-first-row td { border-top: 8px solid #d0d7e3; }
        .floor-total { margin-top: 12px; text-align: right; font-size: 13px; font-weight: 700; color: #1a3a5c; }
        .grand-total { margin-top: 20px; text-align: right; font-size: 14px; font-weight: 800; color: #1a3a5c; border-top: 2px solid #1a3a5c; padding-top: 10px; }
        @media print {
            body { padding: 16px; }
            button { display: none; }
        }
    </style>
    </head><body>
    <div class="header">
        <h1>Corridor's Plus — ${reportTitle}</h1>
        <div class="meta">Period: ${periodLabel} &nbsp;|&nbsp; Generated: ${displayDate(today())}</div>
    </div>
    ${bodyHtml}
    ${grandLine}
    <script>window.onload = () => window.print();<\/script>
    </body></html>`;

    const blob = new Blob([html], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 10000);
}
