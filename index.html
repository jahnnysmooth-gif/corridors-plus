<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Corridor's Plus</title>
    <link rel="icon" id="favicon" href="">
    <link rel="apple-touch-icon" id="appIcon" href="">

    <!-- PWA / Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Corridor's Plus">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a3a5c">

    <!-- Firebase (CDN — no npm needed) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f3f8;
            color: #1a1a2e;
            min-height: 100vh;
        }

        header {
            background: #1a3a5c;
            color: white;
            padding: 16px 20px;
            padding-top: max(16px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            line-height: 1;
        }

        @media (min-width: 768px) {
            header {
                padding-left: 72px;
            }
        }

        header h1 { font-size: 18px; font-weight: 600; flex: 1; }

        .header-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            white-space: nowrap;
            line-height: 1;
        }
        .back-btn:active, .header-btn:active { opacity: 0.6; }

        .container {
            padding: 16px;
            max-width: 640px;
            margin: 0 auto;
        }

        /* ── Stats row ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .stat-value { font-size: 26px; font-weight: 700; color: #1a3a5c; line-height: 1; }
        .stat-label { font-size: 11px; color: #999; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }

        /* ── Floor cards ── */
        .floor-card {
            background: white;
            border-radius: 12px;
            padding: 18px 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: box-shadow 0.15s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .floor-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
        .floor-card-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
        .floor-card-meta { font-size: 13px; color: #999; }
        .floor-card-right { display: flex; align-items: center; gap: 10px; }
        .floor-card-arrow { font-size: 22px; color: #ccc; }
        .floor-card.selected { border: 2px solid #1a3a5c; background: #f0f4ff; }
        .floor-card-checkbox { width: 22px; height: 22px; accent-color: #1a3a5c; cursor: pointer; flex-shrink: 0; margin-right: 4px; }
        .select-bar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
        .select-bar-info { flex: 1; font-size: 14px; font-weight: 600; color: #1a3a5c; }
        .delete-selected-btn { background: #dc2626; color: white; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .delete-selected-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* ── Progress pill ── */
        .progress-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .progress-0   { background: #f0f0f0; color: #aaa; }
        .progress-mid { background: #fef3c7; color: #92400e; }
        .progress-100 { background: #dcfce7; color: #166534; }

        /* ── Tile grid ── */
        .tile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 9px;
            margin-bottom: 12px;
        }

        .item-tile {
            border-radius: 12px;
            padding: 12px 11px;
            cursor: pointer;
            transition: box-shadow 0.15s, transform 0.1s;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 90px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            position: relative;
        }
        .item-tile:hover  { box-shadow: 0 3px 10px rgba(0,0,0,0.13); }
        .item-tile:active { transform: scale(0.96); }

        .tile-status-dot {
            position: absolute;
            top: 9px;
            right: 9px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-pending { background: rgba(0,0,0,0.18); }
        .dot-active  { background: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,0.25); }
        .dot-done    { background: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,0.25); }

        .item-tile-name {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.3;
            flex: 1;
            padding-right: 10px;
        }

        .item-tile-footer {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .item-tile-hrs  { font-size: 20px; font-weight: 800; line-height: 1; }
        .item-tile-unit { font-size: 9px; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; opacity: 0.6; }
        .item-tile-sessions { font-size: 10px; opacity: 0.5; text-align: right; }

        /* ── Log Today (big) button ── */
        .log-today-btn {
            width: 100%;
            padding: 15px;
            background: #1a3a5c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 14px;
            transition: background 0.15s;
        }
        .log-today-btn:hover { background: #15304d; }

        /* ── Add / util buttons ── */
        .add-btn {
            width: 100%;
            padding: 14px;
            border: 2px dashed #c8d0dc;
            background: none;
            border-radius: 12px;
            color: #7a8a9a;
            font-size: 14px;
            cursor: pointer;
            margin-top: 4px;
            transition: all 0.15s;
        }
        .add-btn:hover { border-color: #1a3a5c; color: #1a3a5c; background: #f0f5ff; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary   { background: #1a3a5c; color: white; }
        .btn-secondary { background: #e8ecf2; color: #333; }
        .btn-danger    { background: #fee2e2; color: #b91c1c; }
        .btn-sm        { padding: 6px 12px; font-size: 13px; }

        /* ── Section header ── */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 18px 0 8px;
        }
        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        /* ── Card ── */
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        /* ── Log table ── */
        .log-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .log-table th {
            text-align: left;
            padding: 6px 8px;
            color: #aaa;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid #eee;
        }
        .log-table td { padding: 10px 8px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
        .log-table tr:last-child td { border-bottom: none; }
        .man-hrs-cell { font-weight: 700; color: #1a3a5c; }

        .delete-row {
            color: #ddd;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 0 2px;
        }
        .delete-row:hover { color: #ef4444; }

        /* ── Empty state ── */
        .empty-state { text-align: center; padding: 28px 16px; color: #bbb; font-size: 14px; line-height: 1.6; }

        /* ── Delete zone ── */
        .delete-zone { margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }

        /* ── Status toggle ── */
        .status-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
        }
        .status-btn {
            flex: 1;
            padding: 8px 6px;
            border-radius: 8px;
            border: 1.5px solid #e0e0e0;
            background: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            color: #aaa;
        }
        .status-btn.active-pending { border-color: #aaa;    background: #f5f5f5;  color: #555; }
        .status-btn.active-active  { border-color: #f59e0b; background: #fef3c7;  color: #92400e; }
        .status-btn.active-done    { border-color: #22c55e; background: #dcfce7;  color: #166534; }

        /* ── Quick log ── */
        .quick-log-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .quick-log-date { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

        .date-chip {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
            background: #f0f3f8;
            color: #555;
        }
        .date-chip.active { background: #1a3a5c; color: white; border-color: #1a3a5c; }
        .date-chip:hover:not(.active) { border-color: #1a3a5c; color: #1a3a5c; }

        .date-picker-wrap { display: none; margin-top: 8px; }
        .date-picker-wrap.open { display: block; }
        .date-picker-wrap input[type=date] {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid #1a3a5c;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #1a3a5c;
            outline: none;
        }

        .cal-btn {
            padding: 5px 10px;
            border-radius: 20px;
            border: 1.5px solid transparent;
            background: #f0f3f8;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
        }
        .cal-btn:hover { border-color: #1a3a5c; background: #e8eef8; }
        .cal-btn.active { background: #1a3a5c; border-color: #1a3a5c; }
        .cal-btn.active svg { stroke: white; }
        .cal-btn svg { display: block; }

        .quick-log-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 8px;
            align-items: flex-end;
        }

        .quick-log-field label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }

        .quick-log-field input {
            width: 100%;
            padding: 10px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            outline: none;
            transition: border-color 0.15s;
        }
        .quick-log-field input:focus { border-color: #1a3a5c; }

        .log-btn {
            padding: 10px 14px;
            background: #1a3a5c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            align-self: flex-end;
        }
        .log-btn:hover { background: #15304d; }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: white;
            width: 100%;
            max-width: 640px;
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 36px;
            max-height: 88vh;
            overflow-y: auto;
        }

        .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 13px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.15s;
            background: white;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #1a3a5c; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; padding: 13px; }

        /* ── Daily log modal rows ── */
        .daily-floor-header {
            font-size: 13px;
            font-weight: 800;
            color: #1a3a5c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 0 6px;
            border-top: 1px solid #eee;
            margin-top: 8px;
        }
        .daily-floor-header:first-of-type { border-top: none; margin-top: 0; }

        .daily-row { padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
        .daily-row:last-child { border-bottom: none; }
        .daily-row-label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #1a1a2e; }

        /* ── Backup row ── */
        .backup-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .backup-row .btn { flex: 1; font-size: 13px; padding: 10px; }

        /* ── Backup warning ── */
        .backup-warning {
            background: #fef3c7;
            border: 1.5px solid #f59e0b;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #92400e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .backup-warn-btn {
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* ── Week summary ── */
        .week-summary {
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .week-summary-title { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
        .week-floor-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
        .week-floor-row:last-of-type { border-bottom: none; }
        .week-floor-total { font-weight: 700; color: #1a3a5c; }
        .week-grand { margin-top: 8px; text-align: right; font-size: 12px; font-weight: 700; color: #1a3a5c; padding-top: 6px; border-top: 1px solid #eee; }

        /* ── Notes card ── */
        .notes-card { background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
        .notes-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .notes-card-label { font-size: 11px; font-weight: 700; color: #92400e; text-transform: uppercase; letter-spacing: 0.5px; }
        .notes-card-text { font-size: 14px; color: #1a1a2e; line-height: 1.5; white-space: pre-wrap; }
        .notes-empty { font-size: 13px; color: #aaa; font-style: italic; }
        .notes-edit-btn { background: none; border: none; color: #92400e; font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 8px; border-radius: 4px; }
        .notes-edit-btn:hover { background: #fde68a; }

        /* ── Completed floors ── */
        .completed-section-header { font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.6px; padding: 16px 0 8px; border-top: 1px solid #eee; margin-top: 8px; }
        .floor-card.completed { opacity: 0.6; }

        /* ── Edit / icon row buttons ── */
        .edit-row { color: #bbb; background: none; border: none; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
        .edit-row:hover { color: #1a3a5c; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: #999; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
        .icon-btn:hover { background: #f0f3f8; color: #1a3a5c; }

        /* ── Quick log grid (2-col) ── */
        .quick-log-inputs { grid-template-columns: 1fr 1fr; }

        /* ── Home screen tiles ── */
        .home-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
        }
        .home-tile {
            background: white;
            border-radius: 18px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            border: none;
            width: 100%;
        }
        .home-tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.14); }
        .home-tile-icon { font-size: 48px; margin-bottom: 14px; display: block; }
        .home-tile-label { font-size: 15px; font-weight: 700; color: #1a3a5c; }
        .home-tile-sub { font-size: 12px; color: #999; margin-top: 4px; }
        .home-tile.labor { border-top: 4px solid #1a3a5c; }
        .home-tile.materials { border-top: 4px solid #16a34a; }
        .trade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 16px;
        }
        .trade-tile {
            background: white;
            border-radius: 16px;
            padding: 22px 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            border: none;
            width: 100%;
        }
        .trade-tile:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.13); }
        .trade-tile-icon { font-size: 36px; margin-bottom: 10px; display: block; }
        .trade-tile-label { font-size: 14px; font-weight: 700; color: #1a3a5c; }
        .trade-tile-sub { font-size: 11px; color: #999; margin-top: 3px; }
        .home-subtitle { text-align:center; font-size:13px; color:#aaa; margin-top:32px; }

        /* ── Materials screen ── */
        .mat-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: box-shadow 0.15s;
        }
        .mat-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
        .mat-name { font-size: 16px; font-weight: 700; color: #1a1a2e; }
        .mat-meta { font-size: 13px; color: #999; margin-top: 3px; }
        .mat-stock { text-align: right; }
        .mat-stock-num { font-size: 24px; font-weight: 800; color: #1a3a5c; line-height: 1; }
        .mat-stock-unit { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.4px; }
        .mat-stock-none { font-size: 13px; color: #ccc; font-style: italic; }
        .mat-card.low-stock { border-left: 4px solid #dc2626; background: #fff5f5; }
        .mat-stock-num.low { color: #dc2626; }
        .low-badge { display:inline-block; background:#dc2626; color:white; font-size:10px; font-weight:700; padding:2px 6px; border-radius:99px; margin-left:6px; vertical-align:middle; letter-spacing:0.4px; }
        .trade-tile-low { position:absolute; top:7px; right:7px; min-width:18px; height:18px; background:#dc2626; border-radius:99px; color:white; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 4px; line-height:1; }
        .trade-tile { position: relative; }

// Backfill trade onto existing materials that predate the trade field


(function migrateTrades() {
    const lookup = {};
    DEFAULT_MATERIALS.forEach(d => { lookup[d.name.toLowerCase()] = d.trade; });
    let dirty = false;
    (state.materials || []).forEach(m => {
        if (!m.trade && lookup[m.name.toLowerCase()]) {
            m.trade = lookup[m.name.toLowerCase()];
            dirty = true;
        }
    });
    if (dirty) persist();
})();

function matCurrentStock(mat) {
    const log = mat.log || [];
    // Preferred: latest manual count update as base + deliveries strictly after it
    const adjusts = log.filter(e => e.type === 'adjust').sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    if (adjusts.length > 0) {
        const last = adjusts[0];
        const delivAfter = log.filter(e => e.type === 'delivery' && (e.date > last.date || (e.date === last.date && e.id > last.id))).reduce((s,e) => s + e.qty, 0);
        return last.qty + delivAfter;
    }
    // Legacy EOD model
    if (mat.startQty === undefined || mat.startQty === null) {
        const eodEntries = log.filter(e => e.type === 'eod').sort((a,b) => b.date.localeCompare(a.date));
        return eodEntries.length > 0 ? eodEntries[0].qty : null;
    }
    // startQty + deliveries - usages
    const delivered = log.filter(e => e.type === 'delivery').reduce((s,e) => s + e.qty, 0);
    const used      = log.filter(e => e.type === 'usage').reduce((s,e) => s + e.qty, 0);
    return mat.startQty + delivered - used;
}

function matLastActivityDate(mat) {
    const dates = (mat.log || [])
        .filter(e => e.type === 'usage' || e.type === 'eod' || e.type === 'delivery')
        .map(e => e.date).sort();
    return dates.length > 0 ? dates[dates.length - 1] : null;
}
// backward-compat alias
function matLastEodDate(mat) { return matLastActivityDate(mat); }

function matDailyUsage(mat) {
    const log = mat.log || [];
    // Legacy EOD model
    if (mat.startQty === undefined || mat.startQty === null) {
        const days = [...new Set(log.filter(e => e.type === 'eod').map(e => e.date))].sort();
        const result = [];
        days.forEach((date, i) => {
            const eodQty    = log.filter(e => e.type === 'eod'      && e.date === date).reduce((s,e) => s + e.qty, 0);
            const delivered = log.filter(e => e.type === 'delivery' && e.date === date).reduce((s,e) => s + e.qty, 0);
            const prevDate  = i > 0 ? days[i-1] : null;
            const opening   = prevDate ? log.filter(e => e.type === 'eod' && e.date === prevDate).reduce((s,e) => s + e.qty, 0) : 0;
            const onSite    = opening + delivered;
            const used      = Math.max(0, onSite - eodQty);
            result.push({ date, delivered, used, balance: eodQty, floors: [] });
        });
        return result;
    }
    // New model: usage-based with running balance
    const allDates = [...new Set(
        log.filter(e => e.type === 'delivery' || e.type === 'usage').map(e => e.date)
    )].sort();
    if (allDates.length === 0) return [];
    const result = [];
    let balance = mat.startQty;
    allDates.forEach(date => {
        const delivered    = log.filter(e => e.type === 'delivery' && e.date === date).reduce((s,e) => s + e.qty, 0);
        const usageEntries = log.filter(e => e.type === 'usage'    && e.date === date);
        const used         = usageEntries.reduce((s,e) => s + e.qty, 0);
        const floorNames = [...new Set(
            usageEntries.filter(e => e.floorId).map(e => {
                const f = (state.floors || []).find(f => f.id === e.floorId);
                return f ? f.name : null;
            }).filter(Boolean)
        )];
        const itemNames = [...new Set(
            usageEntries.filter(e => e.itemId).map(e => {
                const f = (state.floors || []).find(f => f.id === e.floorId);
                const item = f ? (f.items || []).find(i => i.id === e.itemId) : null;
                return item ? item.name : null;
            }).filter(Boolean)
        )];
        balance = balance + delivered - used;
        result.push({ date, delivered, used, balance, floors: floorNames, items: itemNames });
    });
    return result;
}

function matDaysRemaining(mat) {
    const stock = matCurrentStock(mat);
    if (stock === null || stock === 0) return null;
    const usage = matDailyUsage(mat);
    if (usage.length === 0) return null;
    const totalUsed = usage.reduce((s, d) => s + d.used, 0);
    if (totalUsed === 0) return null;
    const avgDaily = totalUsed / usage.length;
    return Math.max(0, Math.round(stock / avgDaily));
}

function persist() {
    state.savedAt = Date.now();
    localStorage.setItem('hallway_tracker_v2', JSON.stringify(state));
    if (db && syncCode) {
        _localWrite = true;
        db.ref('projects/' + syncCode + '/state').set(state)
          .then(() => setTimeout(() => { _localWrite = false; }, 2000))
          .catch(() => { _localWrite = false; });
    }
}

    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    const toAdd = ['Baseboard Installation', 'Misc. Labor'];
    const skip  = new Set(['Floor 4', 'Floor 5']);
    let dirty = false;
    (state.floors || []).forEach(f => {
        if (skip.has(f.name)) return;
        const existing = new Set((f.items || []).map(i => i.name.trim().toLowerCase()));
        toAdd.forEach(name => {
            if (!existing.has(name.toLowerCase())) {

    return new Date().toISOString().slice(0, 10);

function yesterday() {
    const d = new Date();
    d.setDate(d.getDate() - 1);

}

function formatDate(iso) {
    const [y, m, d] = iso.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(m)-1]} ${parseInt(d)}`;
}

}

function _normalizeEtaDate(str) {
    if (!str) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
    const d = new Date(str);
    if (isNaN(d.getTime())) return '';
    return d.toISOString().slice(0, 10);
}

function etaDate(iso) {
    if (!iso) return '—';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        iso = d.toISOString().slice(0, 10);
    }
    const [y, m, d2] = iso.split('-');
    return `${parseInt(m)}-${parseInt(d2)}-${y.slice(2)}`;
}

function addWeeks(iso, weeks) {
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + weeks * 7);
    return d.toISOString().slice(0, 10);
}

let view = { screen: 'home', floorId: null, itemId: null, matId: null };
let modalSaveFn = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
function entryManHours(e) {
    // new format: separate hours per type
    if (e.skilledHours !== undefined || e.laborerHours !== undefined) {
        return Number(e.skilled || 0) * Number(e.skilledHours || 0)
             + Number(e.laborer || 0) * Number(e.laborerHours || 0);
    }
    // previous format: skilled/laborer share one hours field
    if (e.skilled !== undefined || e.laborer !== undefined) {
        return (Number(e.skilled || 0) + Number(e.laborer || 0)) * Number(e.hours || 0);
    }
    // legacy format: workers field
    return Number(e.workers || 0) * Number(e.hours || 0);
}

function entryDisplay(e) {
    if (e.skilledHours !== undefined || e.laborerHours !== undefined) {
        return { skilled: Number(e.skilled||0), skilledHours: Number(e.skilledHours||0),
                 laborer: Number(e.laborer||0), laborerHours: Number(e.laborerHours||0) };
    }
    const skilled = e.skilled !== undefined ? Number(e.skilled) : Number(e.workers || 0);
    const laborer = e.laborer !== undefined ? Number(e.laborer) : 0;
    const h = Number(e.hours || 0);
    return { skilled, skilledHours: h, laborer, laborerHours: laborer > 0 ? h : 0 };
}

function itemManHours(item) {
    return (item.hoursLog || []).reduce((s, e) => s + entryManHours(e), 0);
}

function floorManHours(floor) {
    return (floor.items || []).reduce((s, i) => s + itemManHours(i), 0);
}

function floorProgress(floor) {
    if (!(floor.items || []).length) return 0;
    const total = floor.items.reduce((s, i) => {
        const st = i.status || 'pending';
        if (st === 'done')    return s + 100;
        if (st === 'active')  return s + (i.progress || 0);
        return s;
    }, 0);
    return Math.round(total / floor.items.length);
}

function localISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}

function getWeekRange(offsetWeeks) {
    const d   = new Date();
    if (offsetWeeks) d.setDate(d.getDate() + offsetWeeks * 7);
    const day = d.getDay();
    const sun = new Date(d); sun.setDate(d.getDate() - day);
    const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
    return { start: localISO(sun), end: localISO(sat) };
}

function entrySkilledMH(e) {
    if (e.skilledHours !== undefined) return Number(e.skilled || 0) * Number(e.skilledHours || 0);
    if (e.skilled !== undefined)      return Number(e.skilled || 0) * Number(e.hours || 0);
    return Number(e.workers || 0) * Number(e.hours || 0);
}
function entryLaborerMH(e) {
    if (e.laborerHours !== undefined) return Number(e.laborer || 0) * Number(e.laborerHours || 0);
    if (e.laborer !== undefined)      return Number(e.laborer || 0) * Number(e.hours || 0);
    return 0;
}
function itemSkilledMH(item)  { return (item.hoursLog || []).reduce((s, e) => s + entrySkilledMH(e), 0); }
function itemLaborerMH(item)  { return (item.hoursLog || []).reduce((s, e) => s + entryLaborerMH(e), 0); }
function floorSkilledMH(floor) { return (floor.items || []).reduce((s, i) => s + itemSkilledMH(i), 0); }
function floorLaborerMH(floor) { return (floor.items || []).reduce((s, i) => s + itemLaborerMH(i), 0); }

function getFloor() { return state.floors.find(f => f.id === view.floorId); }
function getItem(f)  { return f.items.find(i => i.id === view.itemId); }

}

               value="${_matSearch.replace(/"/g,'&quot;')}" oninput="setMatSearch(this.value)" />
        ${_matSearch ? `<button class="mat-search-clear" onclick="setMatSearch('')">×</button>` : ''}
    </div>`;
}

function _matCardHtml(mat, tradeBadge) {
    const stock    = matCurrentStock(mat);
    const low      = stock !== null && mat.parQty > 0 && stock < mat.parQty;
    const deliv    = (mat.log||[]).filter(e => e.type==='delivery' && e.date===today()).reduce((s,e) => s+e.qty, 0);
    const trade    = mat.trade || 'Other';
    const ordered  = mat.procStatus && mat.procStatus.toLowerCase().includes('ordered');
    const cardHtml = `<div class="mat-card${low && !ordered ? ' low-stock' : ''}${ordered ? ' mat-card-ordered' : ''}" data-mat-name="${mat.name.toLowerCase()}" onclick="navigate('material',null,null,'${mat.id}','${trade}')">
        <div>
            <div class="mat-name">${mat.name}${low ? `<span class="low-badge">⚠ LOW</span>` : ''}${tradeBadge ? `<span class="mat-trade-badge">${trade}</span>` : ''}${ordered ? `<span class="proc-status-badge ordered-badge">&#128666; Ordered</span>` : (mat.procStatus ? `<span class="proc-status-badge">${mat.procStatus}</span>` : '')}</div>
            <div class="mat-meta">${mat.unit}${deliv > 0 ? ` &nbsp;·&nbsp; <span style="color:#16a34a;font-weight:600">+${deliv} today</span>` : ''}${mat.parQty > 0 ? ` &nbsp;·&nbsp; min: ${mat.parQty}` : ''}${mat.reorderQty > 0 ? ` &nbsp;·&nbsp; <span style="color:${ordered ? '#16a34a' : low ? '#dc2626' : '#9ca3af'}">order: ${mat.reorderQty}</span>` : ''}</div>
        </div>
        <div class="mat-stock">
            ${stock !== null
                ? `<div class="mat-stock-num${low ? ' low' : ''}">${stock}</div><div class="mat-stock-unit">${mat.unit}</div>`
                : `<div class="mat-stock-none">No count yet</div>`}
        </div>
    </div>`;
    if (ordered) {
        return cardHtml + `<button class="confirm-delivery-btn" onclick="event.stopPropagation();confirmDelivery('${mat.id}')">&#10003; Confirm Delivery${mat.reorderQty > 0 ? ' of ' + mat.reorderQty + ' ' + mat.unit : ''}</button>`;
    }
    return cardHtml;
}

function renderMaterials() {
    const mats = (state.materials || []).filter(m => !m.archived);
    let html = '';

    if (mats.length === 0) {
        html += `<div class="empty-state">No materials yet.<br>Load defaults or add manually.</div>`;
        html += `<button class="add-btn" style="background:#1a3a5c;margin-bottom:10px" onclick="loadDefaultMaterials()">&#128230; Load Default Materials</button>`;
        html += `<button class="add-btn" onclick="openAddMaterial()">+ Add Material</button>`;
        return html;
    }

    // Group by trade
    const byTrade = {};
    mats.forEach(mat => {
        const t = mat.trade || 'Other';
        if (!byTrade[t]) byTrade[t] = [];
        byTrade[t].push(mat);
    });
    const tradeKeys = TRADE_ORDER.filter(t => byTrade[t]);
    Object.keys(byTrade).forEach(t => { if (!TRADE_ORDER.includes(t)) tradeKeys.push(t); });

    // Search bar always at top
    html += _matSearchBar();

    // If a trade is selected, show that trade's material list
    if (view.matTrade) {
        const tradeMats = byTrade[view.matTrade] || [];
        const delivToday = tradeMats.reduce((s,m) => s + (m.log||[]).filter(e => e.type==='delivery' && e.date===today()).reduce((ss,e) => ss+e.qty, 0), 0);
        html += `<div class="stats-row" style="grid-template-columns:1fr 1fr">
            <div class="stat-card"><div class="stat-value">${tradeMats.length}</div><div class="stat-label">Materials</div></div>
            <div class="stat-card"><div class="stat-value">${delivToday}</div><div class="stat-label">Delivered Today</div></div>
        </div>`;
        html += `<div id="mat_card_list">`;
        tradeMats.forEach(mat => { html += _matCardHtml(mat, false); });
        html += `</div>`;
        html += `<button class="add-btn" onclick="openAddMaterial()">+ Add Material</button>`;
        return html;
    }

    // Trade tile grid (main screen)
    const isLow = m => { const s = matCurrentStock(m); return s !== null && m.parQty > 0 && s < m.parQty; };
    const totalDeliveriesToday = mats.reduce((s, m) => s + (m.log||[]).filter(e => e.type==='delivery' && e.date===today()).reduce((ss,e) => ss+e.qty, 0), 0);
    const lowCount = mats.filter(isLow).length;
    html += `<div class="stats-row" style="grid-template-columns:1fr 1fr">
        <div class="stat-card"><div class="stat-value">${mats.length}</div><div class="stat-label">Materials</div></div>
        <div class="stat-card"><div class="stat-value">${totalDeliveriesToday}</div><div class="stat-label">Delivered Today</div></div>
    </div>`;
    if (lowCount > 0) {
        html += `<div class="low-stock-bar"><span style="font-size:18px">⚠️</span><span class="low-stock-bar-text">${lowCount} material${lowCount !== 1 ? 's' : ''} below minimum stock</span></div>`;
    }

    // Trade tile grid — hidden when searching
    html += `<div id="mat_trade_grid"><div class="trade-grid">`;
    tradeKeys.forEach(trade => {
        const tradeMats = byTrade[trade];
        const color = TRADE_COLORS[trade] || '#475569';
        const icon  = TRADE_ICONS[trade]  || '📦';
        const deliv = tradeMats.reduce((s,m) => s + (m.log||[]).filter(e => e.type==='delivery' && e.date===today()).reduce((ss,e) => ss+e.qty, 0), 0);
        const sub   = deliv > 0 ? `+${deliv} delivered today` : `${tradeMats.length} item${tradeMats.length !== 1 ? 's' : ''}`;
        const lowInTrade = tradeMats.filter(isLow).length;
        html += `<button class="trade-tile" style="border-top:4px solid ${color}" onclick="navigate('materials',null,null,null,'${trade}')">
            ${lowInTrade > 0 ? `<div class="trade-tile-low">${lowInTrade}</div>` : ''}
            <span class="trade-tile-icon">${icon}</span>
            <div class="trade-tile-label">${trade}</div>
            <div class="trade-tile-sub">${sub}</div>
        </button>`;
    });
    html += `</div>`;
    const upcomingCount = (state.materials||[]).filter(m => m.deliveryEta).length;
    html += `<button class="btn btn-secondary" style="width:100%;margin-bottom:10px;margin-top:20px${upcomingCount > 0 ? ';background:#1a3a5c;color:white;border-color:#1a3a5c' : ''}" onclick="navigate('deliveries')">&#128666; Upcoming Deliveries${upcomingCount > 0 ? ` <span style="background:white;color:#1a3a5c;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:4px">${upcomingCount}</span>` : ''}</button>`;
    html += `<button class="btn btn-secondary" style="width:100%;margin-bottom:10px;background:${lowCount > 0 ? '#7c3aed' : ''};color:${lowCount > 0 ? 'white' : ''};border-color:${lowCount > 0 ? '#7c3aed' : ''}" onclick="navigate('reorder')">&#128203; Reorder List${lowCount > 0 ? ` <span style="background:white;color:#7c3aed;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:4px">${lowCount}</span>` : ''}</button>`;
    html += `<button class="btn btn-secondary" style="width:100%;margin-bottom:10px" onclick="navigate('orderhistory')">&#128220; Order History</button>`;
    html += `<button class="btn btn-secondary" style="width:100%;margin-bottom:10px" onclick="openSheetsSync()">&#9729; Google Sheets Sync${localStorage.getItem('hallway_sheets_url') ? ' <span style="display:inline-block;width:7px;height:7px;background:#16a34a;border-radius:50%;margin-left:4px;vertical-align:middle"></span>' : ''}</button>`;
    html += `<button class="add-btn" onclick="openAddMaterial()">+ Add Material</button>`;
    html += `</div>`;

    // Search results — all materials as cards, shown when searching
    html += `<div id="mat_search_results" style="display:none">`;
    html += `<div id="mat_no_results" class="empty-state" style="display:none">No materials found.</div>`;
    mats.forEach(mat => { html += _matCardHtml(mat, true); });
    html += `</div>`;

    // Archived section
    const archivedMats = (state.materials || []).filter(m => m.archived);
    if (archivedMats.length > 0) {
        html += `<div style="margin-top:24px">
            <button onclick="this.parentElement.querySelector('.archived-list').style.display = this.parentElement.querySelector('.archived-list').style.display === 'none' ? 'block' : 'none'; this.textContent = this.textContent.includes('Show') ? '&#128230; Archived (${archivedMats.length}) ▲' : '&#128230; Archived (${archivedMats.length}) ▼';"
                style="width:100%;padding:10px 14px;background:#f3f4f6;border:1.5px solid #e5e7eb;border-radius:10px;font-size:13px;font-weight:700;color:#666;cursor:pointer;text-align:left">
                &#128230; Archived (${archivedMats.length}) ▼</button>
            <div class="archived-list" style="display:none;margin-top:8px">`;
        archivedMats.forEach(mat => {
            html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:white;border-radius:10px;margin-bottom:6px;border:1px solid #e5e7eb;opacity:0.7">
                <div>
                    <div style="font-size:14px;font-weight:700;color:#555">${mat.name}</div>
                    <div style="font-size:12px;color:#aaa">${mat.trade || 'Other'}</div>
                </div>
                <button onclick="unarchiveMaterial('${mat.id}')" style="padding:6px 14px;background:#92400e;color:white;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer">Unarchive</button>
            </div>`;
        });
        html += `</div></div>`;
    }

    return html;
}

function renderMaterialDetail(mat) {
    if (!mat) return `<div class="empty-state">Material not found.</div>`;
    if (mat.archived) {
        return `<div style="background:#fef3c7;border:1.5px solid #d97706;border-radius:12px;padding:16px;margin-bottom:16px;text-align:center">
            <div style="font-size:15px;font-weight:700;color:#92400e">&#128230; Archived</div>
            <div style="font-size:13px;color:#78350f;margin-top:4px">This material is archived and hidden from the main list.</div>
            <button onclick="unarchiveMaterial('${mat.id}')" style="margin-top:12px;padding:10px 24px;background:#92400e;color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">&#8593; Unarchive</button>
        </div>`;
    }
    const stock    = matCurrentStock(mat);
    const totalDel = (mat.log||[]).filter(e => e.type==='delivery').reduce((s,e) => s+e.qty, 0);
    const low      = stock !== null && mat.parQty > 0 && stock < mat.parQty;
    const ordered  = mat.procStatus && mat.procStatus.toLowerCase().includes('ordered');

    // Stats
    const lastDeliv = (mat.log||[]).filter(e => e.type==='delivery').sort((a,b) => b.date.localeCompare(a.date))[0];
    let html = `<div class="stats-row">
        <div class="stat-card"><div class="stat-value">${stock !== null ? stock : '—'}</div><div class="stat-label">On Hand</div></div>
        <div class="stat-card"><div class="stat-value">${mat.parQty > 0 ? mat.parQty : '—'}</div><div class="stat-label">Min Stock</div></div>
        <div class="stat-card"><div class="stat-value">${lastDeliv ? displayDate(lastDeliv.date) : '—'}</div><div class="stat-label">Last Delivery</div></div>
    </div>`;

    // Confirm Delivery banner — prominent when ordered
    if (ordered) {
        html += `<button class="confirm-delivery-banner" onclick="confirmDelivery('${mat.id}')">
            &#10003; Confirm Delivery${mat.reorderQty > 0 ? ' of ' + mat.reorderQty + ' ' + mat.unit : ''}
            <span style="font-size:12px;font-weight:400;display:block;margin-top:2px;opacity:0.85">Tap to receive this order — count updates automatically</span>
        </button>`;
        html += `<button onclick="cancelOrder('${mat.id}')" style="width:100%;margin-bottom:10px;padding:10px;background:none;border:1.5px solid #dc2626;border-radius:10px;color:#dc2626;font-size:14px;font-weight:600;cursor:pointer">&#10007; Cancel Order</button>`;
    } else if (mat.procStatus) {
        html += `<button onclick="cancelOrder('${mat.id}')" style="width:100%;margin-bottom:10px;padding:10px;background:none;border:1.5px solid #dc2626;border-radius:10px;color:#dc2626;font-size:14px;font-weight:600;cursor:pointer">&#10007; Cancel Order</button>`;
    } else if (low) {
        const orderNote = mat.reorderQty > 0 ? ` — order ${mat.reorderQty} ${mat.unit}` : '';
        html += `<div class="low-stock-bar"><span style="font-size:18px">⚠️</span><span class="low-stock-bar-text">Below minimum${orderNote}</span></div>`;
    }

    html += `<div class="mat-info-card">`;
    if (mat.brand) html += `<div class="mat-info-row"><span class="mat-info-label">Brand</span><span>${mat.brand.replace(/</g,'&lt;')}</span></div>`;
    html += `<div class="mat-info-row">
        <span class="mat-info-label">Order Status</span>
        <div style="display:flex;gap:6px;flex:1;align-items:center">
            <input id="proc_status_input" value="${(mat.procStatus||'').replace(/"/g,'&quot;')}" placeholder="e.g. Review, Order Needed…"
                style="flex:1;padding:6px 10px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px"
                onchange="saveMatStatus('${mat.id}',this.value)" />
        </div>
    </div>`;
    if (mat.link) html += `<div class="mat-info-row"><span class="mat-info-label">Link</span><a href="${mat.link.replace(/"/g,'&quot;')}" target="_blank" rel="noopener" class="mat-info-link">View product ↗</a></div>`;
    html += `</div>`;

    html += `<div class="mat-action-row">
        <button class="mat-action-btn" style="background:#475569;color:white" onclick="updateCount('${mat.id}')">&#9998; Update Count</button>
        <button class="mat-action-btn" style="background:#92400e;color:white" onclick="placeOrder('${mat.id}')">&#128666; Place Order</button>
        <button class="mat-action-btn" style="background:#1a3a5c;color:white" onclick="openSheetsSync()">&#9729; Sync</button>
    </div>`;

    // History — deliveries and count updates
    const logEntries = (mat.log||[])
        .filter(e => e.type === 'delivery' || e.type === 'adjust')
        .sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));

    if (logEntries.length === 0) {
        html += `<div class="card"><div class="empty-state">No deliveries or count updates yet.</div></div>`;
    } else {
        // Compute running balance for each entry
        let balance = mat.startQty || 0;
        const withBalance = logEntries.map(e => {
            if (e.type === 'adjust')    { balance = e.qty; }
            else if (e.type === 'delivery') { balance += e.qty; }
            return { ...e, balance };
        });
        html += `<div class="card"><table class="usage-table">
            <thead><tr><th>Date</th><th>Event</th><th>Qty</th><th>On Hand</th><th></th></tr></thead>
            <tbody>`;
        [...withBalance].reverse().forEach(e => {
            const isAdj  = e.type === 'adjust';
            const color  = isAdj ? '#475569' : '#16a34a';
            const label  = isAdj ? 'Count updated' : 'Delivery' + (e.by ? ` · ${e.by}` : '');
            const qtyStr = isAdj ? `= ${e.qty}` : `+${e.qty}`;
            const balColor = e.balance <= (mat.parQty || 0) && mat.parQty > 0 ? '#dc2626' : '#1a3a5c';
            html += `<tr>
                <td>${displayDate(e.date)}</td>
                <td style="font-size:12px;color:#666">${label}</td>
                <td style="font-weight:700;color:${color}">${qtyStr} ${mat.unit}</td>
                <td style="font-weight:700;color:${balColor}">${e.balance} ${mat.unit}</td>
                <td><button onclick="deleteMatEntry('${mat.id}','${e.id}')" style="background:none;border:none;font-size:15px;cursor:pointer;color:#aaa;padding:2px 4px">🗑️</button></td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
    }

    // Notes
    html += `<div class="notes-card" style="margin-bottom:12px">
        <div class="notes-card-header">
            <span class="notes-card-label">Notes</span>
            <button class="notes-edit-btn" onclick="editMatNotes('${mat.id}')">${mat.notes ? 'Edit' : '+ Add'}</button>
        </div>
        ${mat.notes
            ? `<div class="notes-card-text">${mat.notes.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>`
            : `<div class="notes-empty">Vendor, SKU, contact info…</div>`}
    </div>`;

    html += `<div class="delete-zone">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-secondary btn-sm" onclick="renameMaterial('${mat.id}')">&#9998; Rename</button>
            <button class="btn btn-secondary btn-sm" onclick="setParQty('${mat.id}')">&#9651; Min${mat.parQty > 0 ? ': ' + mat.parQty : ''}</button>
            <button class="btn btn-secondary btn-sm" onclick="setReorderQty('${mat.id}')">&#128666; Order qty${mat.reorderQty > 0 ? ': ' + mat.reorderQty : ''}</button>
            <button class="btn btn-secondary btn-sm" style="background:#92400e;color:white;border-color:#92400e" onclick="archiveMaterial('${mat.id}')">&#128230; Archive</button>
            <button class="btn btn-danger btn-sm" onclick="deleteMaterial('${mat.id}')">Delete</button>
        </div>
    </div>`;

    return html;
}

// ── Order History screen ──────────────────────────────────────────────────────
function renderOrderHistory() {
    const mats = state.materials || [];
    // Collect all delivery entries across all materials
    const entries = [];
    mats.forEach(mat => {
        (mat.log || []).filter(e => e.type === 'delivery').forEach(e => {
            entries.push({ mat, entry: e });
        });
    });

    if (entries.length === 0) {
        return `<div style="text-align:center;padding:60px 20px">
            <div style="font-size:48px;margin-bottom:16px">📦</div>
            <div style="font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:8px">No deliveries yet</div>
            <div style="font-size:14px;color:#999">Confirmed deliveries will appear here.</div>
        </div>`;
    }

    // Sort newest first
    entries.sort((a, b) => b.entry.date.localeCompare(a.entry.date) || b.entry.id.localeCompare(a.entry.id));

    // Group by date
    const byDate = {};
    entries.forEach(({ mat, entry }) => {
        if (!byDate[entry.date]) byDate[entry.date] = [];
        byDate[entry.date].push({ mat, entry });
    });

    const totalQty = entries.reduce((s, { entry }) => s + entry.qty, 0);
    let html = `<div class="stats-row" style="grid-template-columns:1fr 1fr">
        <div class="stat-card"><div class="stat-value">${entries.length}</div><div class="stat-label">Total Deliveries</div></div>
        <div class="stat-card"><div class="stat-value">${totalQty}</div><div class="stat-label">Total Units Received</div></div>
    </div>`;

    Object.keys(byDate).sort((a, b) => b.localeCompare(a)).forEach(date => {
        html += `<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:#999;margin:16px 0 6px;padding:0 2px">${displayDate(date)}</div>`;
        html += `<div class="card" style="padding:0;overflow:hidden">`;
        byDate[date].forEach(({ mat, entry }, i) => {
            const color = TRADE_COLORS[mat.trade] || '#475569';
            const border = i > 0 ? 'border-top:1px solid #f0f3f8' : '';
            html += `<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;${border};cursor:pointer" onclick="navigate('material',null,null,'${mat.id}','${mat.trade||'Other'}')">
                <div style="width:4px;min-width:4px;height:36px;background:${color};border-radius:2px"></div>
                <div style="flex:1;min-width:0">
                    <div style="font-size:14px;font-weight:600;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${mat.name}</div>
                    <div style="font-size:12px;color:#888;margin-top:2px">${mat.trade || 'Other'}${entry.by ? ' · ' + entry.by : ''}</div>
                </div>
                <div style="text-align:right;flex-shrink:0">
                    <div style="font-size:16px;font-weight:700;color:#16a34a">+${entry.qty}</div>
                    <div style="font-size:11px;color:#aaa">${mat.unit || 'units'}</div>
                </div>
            </div>`;
        });
        html += `</div>`;
    });

    return html;
}

// ── Reorder List screen ───────────────────────────────────────────────────────
function renderUpcomingDeliveries() {
    const mats = (state.materials || []).filter(m => m.deliveryEta && !m.archived);
    if (mats.length === 0) {
        return `<div style="text-align:center;padding:60px 20px">
            <div style="font-size:48px;margin-bottom:16px">📭</div>
            <div style="font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:8px">No upcoming deliveries</div>
            <div style="font-size:14px;color:#999">When the office sets a Delivery ETA in the sheet, it will appear here.</div>
        </div>`;
    }
    const todayStr = today();
    const sorted = [...mats].sort((a, b) => a.deliveryEta.localeCompare(b.deliveryEta));
    const overdue  = sorted.filter(m => m.deliveryEta < todayStr);
    const todayDel = sorted.filter(m => m.deliveryEta === todayStr);
    const upcoming = sorted.filter(m => m.deliveryEta > todayStr);
    let html = `<div class="stats-row" style="grid-template-columns:1fr 1fr 1fr">
        <div class="stat-card"><div class="stat-value" style="color:${overdue.length > 0 ? '#dc2626' : 'inherit'}">${overdue.length}</div><div class="stat-label">Overdue</div></div>
        <div class="stat-card"><div class="stat-value" style="color:${todayDel.length > 0 ? '#16a34a' : 'inherit'}">${todayDel.length}</div><div class="stat-label">Today</div></div>
        <div class="stat-card"><div class="stat-value">${upcoming.length}</div><div class="stat-label">Upcoming</div></div>
    </div>`;
    function deliveryCard(mat, accent) {
        const stock = matCurrentStock(mat);
        const color = TRADE_COLORS[mat.trade] || '#475569';
        return `<div style="background:white;border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.08);border-left:4px solid ${accent};cursor:pointer" onclick="navigate('material',null,null,'${mat.id}','${mat.trade||''}')">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div style="flex:1">
                    <div style="font-size:15px;font-weight:700;color:#1a1a2e">${mat.name}</div>
                    <div style="font-size:12px;color:${color};font-weight:600;margin-top:2px">${mat.trade || ''}</div>
                    ${mat.reorderQty > 0 ? `<div style="font-size:13px;color:#555;margin-top:4px">Qty ordered: <strong>${mat.reorderQty} ${mat.unit || ''}</strong></div>` : ''}
                    ${mat.procStatus ? `<div style="font-size:12px;color:#888;margin-top:2px">Status: ${mat.procStatus}</div>` : ''}
                </div>
                <div style="text-align:right;margin-left:12px">
                    <div style="font-size:18px;font-weight:800;color:${accent}">${etaDate(mat.deliveryEta)}</div>
                    <div style="font-size:11px;color:#aaa;margin-top:2px">${stock !== null ? `${stock} ${mat.unit || ''} on hand` : 'no count'}</div>
                </div>
            </div>
            ${mat.procStatus && mat.procStatus.toLowerCase().includes('ordered') ? `<button onclick="event.stopPropagation();confirmDelivery('${mat.id}')" style="margin-top:10px;width:100%;padding:9px;background:#16a34a;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">✓ Confirm Delivery</button>` : ''}
        </div>`;
    }
    if (overdue.length > 0) {
        html += `<div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:#dc2626;margin:16px 0 8px">Overdue</div>`;
        overdue.forEach(m => { html += deliveryCard(m, '#dc2626'); });
    }
    if (todayDel.length > 0) {
        html += `<div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:#16a34a;margin:16px 0 8px">Today</div>`;
        todayDel.forEach(m => { html += deliveryCard(m, '#16a34a'); });
    }
    if (upcoming.length > 0) {
        html += `<div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:#1a3a5c;margin:16px 0 8px">Upcoming</div>`;
        upcoming.forEach(m => { html += deliveryCard(m, '#1a3a5c'); });
    }
    return html;
}

function renderOnHand() {
    const mats = (state.materials || []).filter(m => !m.archived);
    if (mats.length === 0) return `<div class="empty-state">No materials yet.</div>`;
    const byTrade = {};
    mats.forEach(mat => {
        const t = mat.trade || 'Other';
        if (!byTrade[t]) byTrade[t] = [];
        byTrade[t].push(mat);
    });
    const tradeKeys = TRADE_ORDER.filter(t => byTrade[t]);
    Object.keys(byTrade).forEach(t => { if (!TRADE_ORDER.includes(t)) tradeKeys.push(t); });
    const totalItems = mats.length;
    const knownCount = mats.filter(m => matCurrentStock(m) !== null).length;
    const isLow = m => { const s = matCurrentStock(m); return s !== null && m.parQty > 0 && s < m.parQty; };
    const lowCount = mats.filter(isLow).length;
    let html = `<div class="stats-row" style="grid-template-columns:1fr 1fr 1fr">
        <div class="stat-card"><div class="stat-value">${totalItems}</div><div class="stat-label">Materials</div></div>
        <div class="stat-card"><div class="stat-value">${knownCount}</div><div class="stat-label">Counted</div></div>
        <div class="stat-card"><div class="stat-value" style="color:${lowCount > 0 ? '#dc2626' : 'inherit'}">${lowCount}</div><div class="stat-label">Low Stock</div></div>
    </div>`;
    tradeKeys.forEach(trade => {
        const tradeMats = byTrade[trade];
        const color = TRADE_COLORS[trade] || '#475569';
        const icon  = TRADE_ICONS[trade]  || '📦';
        html += `<div class="onhand-section">
            <div class="onhand-trade-header" style="color:${color}">${icon} ${trade}</div>`;
        tradeMats.forEach(mat => {
            const stock = matCurrentStock(mat);
            const low   = stock !== null && mat.parQty > 0 && stock < mat.parQty;
            const qtyDisplay = stock !== null ? stock : '—';
            html += `<div class="onhand-row">
                <div class="onhand-name">${mat.name}${low ? ' <span class="low-badge">LOW</span>' : ''}</div>
                <div class="onhand-qty${low ? ' low' : ''}">${qtyDisplay}</div>
                <div class="onhand-unit">${mat.unit || ''}</div>
                <button class="onhand-update-btn" onclick="updateCountFromOnHand('${mat.id}')">Update</button>
            </div>`;
        });
        html += `</div>`;
    });
    return html;
}

function renderReorderList() {
    const mats  = (state.materials || []).filter(m => !m.archived);
    const isLow = m => { const s = matCurrentStock(m); return s !== null && m.parQty > 0 && s < m.parQty; };
    const low   = mats.filter(isLow);

    if (low.length === 0) {
        return `<div style="text-align:center;padding:60px 20px">
            <div style="font-size:48px;margin-bottom:16px">✅</div>
            <div style="font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:8px">All stocked up</div>
            <div style="font-size:14px;color:#999">No materials are below minimum stock.</div>
        </div>`;
    }

    // Group by trade
    const byTrade = {};
    low.forEach(m => {
        const t = m.trade || 'Other';
        if (!byTrade[t]) byTrade[t] = [];
        byTrade[t].push(m);
    });
    const tradeKeys = TRADE_ORDER.filter(t => byTrade[t]);
    Object.keys(byTrade).forEach(t => { if (!TRADE_ORDER.includes(t)) tradeKeys.push(t); });

    const totalOrderItems = low.filter(m => m.reorderQty > 0).length;
    let html = `<div class="stats-row" style="grid-template-columns:1fr 1fr">
        <div class="stat-card"><div class="stat-value">${low.length}</div><div class="stat-label">Need Restocking</div></div>
        <div class="stat-card"><div class="stat-value">${totalOrderItems}</div><div class="stat-label">Qty Set</div></div>
    </div>`;

    tradeKeys.forEach(trade => {
        const color = TRADE_COLORS[trade] || '#475569';
        html += `<div class="reorder-trade-header" style="color:${color}">${TRADE_ICONS[trade] || '📦'} ${trade}</div>`;
        byTrade[trade].forEach(mat => {
            const stock       = matCurrentStock(mat);
            const shortage    = mat.parQty - stock;
            const deliveries  = (mat.log||[]).filter(e => e.type === 'delivery').sort((a,b) => b.date.localeCompare(a.date));
            const lastDeliv   = deliveries[0];
            const delivMeta   = lastDeliv
                ? `Last delivery: ${displayDate(lastDeliv.date)} &nbsp;·&nbsp; ${lastDeliv.qty} ${mat.unit}`
                : 'No deliveries recorded';
            html += `<div class="reorder-card" style="border-left-color:${color}" onclick="navigate('material',null,null,'${mat.id}','${mat.trade||'Other'}')">
                <div class="reorder-name">${mat.name}</div>
                <div class="reorder-meta">In stock: <strong>${stock} ${mat.unit}</strong> &nbsp;·&nbsp; Min: ${mat.parQty} &nbsp;·&nbsp; Short by: ${shortage}</div>
                <div class="reorder-meta" style="margin-top:3px;color:#b45309">&#128666; ${delivMeta}</div>
                <div class="reorder-order${mat.reorderQty > 0 ? '' : ' unset'}">
                    ${mat.reorderQty > 0 ? `&#128666; Order ${mat.reorderQty} ${mat.unit}` : 'Order qty not set — tap to add'}
                </div>
            </div>`;
        });
    });

    return html;
}

function printReorderList() {
    const mats  = (state.materials || []).filter(m => !m.archived);
    const isLow = m => { const s = matCurrentStock(m); return s !== null && m.parQty > 0 && s < m.parQty; };
    const low   = mats.filter(isLow);
    if (low.length === 0) { alert('Nothing to reorder — all materials are above minimum stock.'); return; }

    const byTrade = {};
    low.forEach(m => {
        const t = m.trade || 'Other';
        if (!byTrade[t]) byTrade[t] = [];
        byTrade[t].push(m);
    });
    const tradeKeys = TRADE_ORDER.filter(t => byTrade[t]);
    Object.keys(byTrade).forEach(t => { if (!TRADE_ORDER.includes(t)) tradeKeys.push(t); });

    let bodyHtml = '';
    tradeKeys.forEach(trade => {
        bodyHtml += `<div style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:#7c3aed;margin:20px 0 8px;border-top:1px solid #e5e7eb;padding-top:16px">${trade}</div>`;
        byTrade[trade].forEach(m => {
            const stock      = matCurrentStock(m);
            const shortage   = m.parQty - stock;
            const lastDeliv  = (m.log||[]).filter(e => e.type==='delivery').sort((a,b) => b.date.localeCompare(a.date))[0];
            const delivNote  = lastDeliv ? `Last delivery: ${displayDate(lastDeliv.date)} (${lastDeliv.qty} ${m.unit})` : 'No deliveries recorded';
            bodyHtml += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0">
                <div>
                    <div style="font-size:15px;font-weight:700;color:#1a1a2e">${m.name}</div>
                    <div style="font-size:12px;color:#888;margin-top:2px">In stock: ${stock} ${m.unit} &nbsp;·&nbsp; Min: ${m.parQty} &nbsp;·&nbsp; Short by: ${shortage}</div>
                    <div style="font-size:11px;color:#b45309;margin-top:2px">${delivNote}</div>
                </div>
                <div style="font-size:15px;font-weight:800;color:#7c3aed;white-space:nowrap;margin-left:16px">
                    ${m.reorderQty > 0 ? `Order ${m.reorderQty} ${m.unit}` : '<span style="color:#aaa;font-weight:400;font-style:italic">Qty TBD</span>'}
                </div>
            </div>`;
        });
    });

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reorder List</title>
    <style>* { box-sizing:border-box; margin:0; padding:0; } body { font-family:Arial,sans-serif; font-size:13px; color:#111; padding:28px; max-width:600px; margin:0 auto; }
    h1 { font-size:20px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#1a3a5c; margin-bottom:4px; }
    .meta { font-size:12px; color:#666; margin-bottom:20px; }
    @media print { body { padding:16px; } }</style></head><body>
    <h1>Corridor's Plus — Reorder List</h1>
    <div class="meta">Generated: ${displayDate(today())} &nbsp;·&nbsp; ${low.length} item${low.length !== 1 ? 's' : ''} need restocking</div>
    ${bodyHtml}
    <script>window.onload = () => window.print();<\/script></body></html>`;

    window.open(URL.createObjectURL(new Blob([html], { type: 'text/html' })), '_blank');
}

// ── Floor screen ──────────────────────────────────────────────────────────────
const TILE_COLORS = [
    { bg: '#dbeafe', text: '#1e3a8a' },
    { bg: '#dcfce7', text: '#14532d' },
    { bg: '#fef9c3', text: '#713f12' },
    { bg: '#ffe4e6', text: '#881337' },
    { bg: '#f3e8ff', text: '#581c87' },
    { bg: '#ffedd5', text: '#7c2d12' },
    { bg: '#cffafe', text: '#164e63' },
    { bg: '#fae8ff', text: '#701a75' },
    { bg: '#d1fae5', text: '#064e3b' },
    { bg: '#fee2e2', text: '#7f1d1d' },
    { bg: '#e0e7ff', text: '#312e81' },
];

function renderFloor(floor) {
    const hrs       = floorManHours(floor);
    const skilledMH = floorSkilledMH(floor);
    const laborerMH = floorLaborerMH(floor);
    const sessions  = (floor.items || []).reduce((s, i) => s + (i.hoursLog || []).length, 0);
    const done    = floor.items.filter(i => (i.status || 'pending') === 'done').length;
    const pct     = floorProgress(floor);

    let html = `<div class="stats-row">
        <div class="stat-card"><div class="stat-value">${hrs}</div><div class="stat-label">Man-Hours</div></div>
        <div class="stat-card"><div class="stat-value">${sessions}</div><div class="stat-label">Sessions</div></div>
        <div class="stat-card"><div class="stat-value">${pct}%</div><div class="stat-label">Complete (${done}/${floor.items.length} done)</div></div>
    </div>
    <div class="stats-row" style="grid-template-columns:1fr 1fr;margin-bottom:8px">
        <div class="stat-card"><div class="stat-value">${skilledMH}</div><div class="stat-label">Skilled MH</div></div>
        <div class="stat-card"><div class="stat-value">${laborerMH}</div><div class="stat-label">Laborer MH</div></div>
    </div>`;

    // Notes card
    html += `<div class="notes-card">
        <div class="notes-card-header">
            <span class="notes-card-label">Floor Notes</span>
            <div style="display:flex;gap:8px">
                ${floor.notes ? `<button class="notes-edit-btn" onclick="printFloorNotes()">&#8681; Print</button>` : ''}
                <button class="notes-edit-btn" onclick="openEditNotes('${floor.id}')">${floor.notes ? 'Edit' : '+ Add'}</button>
            </div>
        </div>
        ${floor.notes
            ? `<div class="notes-card-text">${floor.notes.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>`
            : `<div class="notes-empty">No notes yet.</div>`}
    </div>`;

    html += `<button class="log-today-btn" onclick="openFloorLogToday('${floor.id}')">+ Log Today's Hours</button>`;

    if (floor.items.length === 0) {
        html += `<div class="card"><div class="empty-state">No work items yet.<br>Tap <strong>+ Add Item</strong> below to start tracking hours for this floor.</div></div>`;
    } else {
        const reordering = _reorderFloorId === floor.id;
        html += `<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px">
            ${reordering ? `<button class="notes-edit-btn" style="background:#1a3a5c;color:white;border-color:#1a3a5c" onclick="applyOrderToAllFloors('${floor.id}')">Apply to All Floors</button>` : ''}
            <button class="notes-edit-btn" onclick="toggleReorderMode('${floor.id}')">${reordering ? 'Done' : '⇅ Reorder'}</button>
        </div>`;

        if (reordering) {
            // Reorder list view
            html += `<div class="card" style="padding:8px">`;
            floor.items.forEach((item, idx) => {
                const status = item.status || 'pending';
                html += `<div style="display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #f0f0f0">
                    <span class="tile-status-dot dot-${status}" style="flex-shrink:0;margin:0"></span>
                    <span style="flex:1;font-size:14px;font-weight:600;color:#1a1a2e">${item.name}</span>
                    <div style="display:flex;gap:4px">
                        <button onclick="renameFloorItem('${floor.id}','${item.id}')"
                            style="width:34px;height:34px;border-radius:8px;border:1.5px solid #e0e0e0;background:white;font-size:15px;cursor:pointer;color:#1a3a5c">✏️</button>
                        <button onclick="moveFloorItem('${floor.id}',${idx},-1)" ${idx === 0 ? 'disabled' : ''}
                            style="width:34px;height:34px;border-radius:8px;border:1.5px solid #e0e0e0;background:${idx===0?'#f5f5f5':'white'};font-size:16px;cursor:${idx===0?'default':'pointer'};color:${idx===0?'#ccc':'#1a3a5c'}">↑</button>
                        <button onclick="moveFloorItem('${floor.id}',${idx},1)" ${idx === floor.items.length-1 ? 'disabled' : ''}
                            style="width:34px;height:34px;border-radius:8px;border:1.5px solid #e0e0e0;background:${idx===floor.items.length-1?'#f5f5f5':'white'};font-size:16px;cursor:${idx===floor.items.length-1?'default':'pointer'};color:${idx===floor.items.length-1?'#ccc':'#1a3a5c'}">↓</button>
                        <button onclick="deleteFloorItemInEdit('${floor.id}','${item.id}')"
                            style="width:34px;height:34px;border-radius:8px;border:1.5px solid #fee2e2;background:#fff5f5;font-size:15px;cursor:pointer;color:#dc2626">🗑️</button>
                    </div>
                </div>`;
            });
            html += `</div>`;
        } else {
            html += `<div class="tile-grid">`;
            floor.items.forEach((item, idx) => {
                const h      = itemManHours(item);
                const s      = (item.hoursLog || []).length;
                const status = item.status || 'pending';
                const prog   = (status === 'active' && item.progress != null) ? item.progress : null;
                const color  = TILE_COLORS[idx % TILE_COLORS.length];
                const progBar = prog != null ? `<div style="position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(0,0,0,.12);border-radius:0 0 12px 12px">
                    <div style="height:4px;width:${prog}%;background:rgba(0,0,0,.35);border-radius:0 0 0 12px;transition:width .3s"></div></div>` : '';
                const progLabel = prog != null ? `<span style="font-size:10px;font-weight:700;opacity:.75;margin-left:4px">${prog}%</span>` : '';
                html += `<div class="item-tile" style="background:${color.bg};color:${color.text};position:relative;overflow:hidden"
                    onclick="navigate('item','${floor.id}','${item.id}')"
                    oncontextmenu="quickStatusPicker(event,'${floor.id}','${item.id}');return false"
                    data-hold-floor="${floor.id}" data-hold-item="${item.id}">
                    <span class="tile-status-dot dot-${status}"></span>${progLabel}
                    <div class="item-tile-name">${item.name}</div>
                    <div class="item-tile-footer">
                        <div>
                            <div class="item-tile-hrs">${h}</div>
                            <div class="item-tile-unit">man-hrs</div>
                        </div>
                        <div class="item-tile-sessions">${s} session${s !== 1 ? 's' : ''}</div>
                    </div>
                    ${progBar}
                </div>`;
            });
            html += `</div>`;
        }
    }

    html += `<button class="add-btn" onclick="openAddItem('${floor.id}')">+ Add Work Item</button>`;

    // Materials used on this floor
    const floorMatUsage = [];
    (state.materials || []).forEach(mat => {
        const entries = (mat.log || []).filter(e => e.type === 'usage' && e.floorId === floor.id);
        if (entries.length > 0) {
            const total = entries.reduce((s, e) => s + e.qty, 0);
            floorMatUsage.push({ name: mat.name, unit: mat.unit, trade: mat.trade || 'Other', total, matId: mat.id });
        }
    });
    floorMatUsage.sort((a, b) => a.trade.localeCompare(b.trade) || a.name.localeCompare(b.name));

    html += `<div class="card" style="margin-top:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <span style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:#1a3a5c">Materials Used</span>
            <button onclick="navigate('materials')" style="background:none;border:none;font-size:12px;color:#1a3a5c;font-weight:600;cursor:pointer;padding:0">View All ›</button>
        </div>`;
    if (floorMatUsage.length === 0) {
        html += `<div style="font-size:13px;color:#aaa;font-style:italic;padding:4px 0">No materials logged for this floor yet.</div>`;
    } else {
        const byTrade = {};
        floorMatUsage.forEach(m => {
            if (!byTrade[m.trade]) byTrade[m.trade] = [];
            byTrade[m.trade].push(m);
        });
        const tradeKeys = TRADE_ORDER.filter(t => byTrade[t]);
        Object.keys(byTrade).forEach(t => { if (!TRADE_ORDER.includes(t)) tradeKeys.push(t); });
        tradeKeys.forEach(trade => {
            const color = TRADE_COLORS[trade] || '#475569';
            html += `<div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:${color};margin:10px 0 4px">${TRADE_ICONS[trade] || '📦'} ${trade}</div>`;
            byTrade[trade].forEach(m => {
                html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f5f5f5;cursor:pointer" onclick="navigate('material',null,null,'${m.matId}','${m.trade}')">
                    <span style="font-size:14px;color:#1a1a2e">${m.name}</span>
                    <span style="font-size:14px;font-weight:700;color:#1a3a5c">${m.total} <span style="font-size:11px;font-weight:400;color:#999">${m.unit}</span></span>
                </div>`;
            });
        });
    }
    html += `</div>`;

    html += `<div class="delete-zone">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-secondary btn-sm" onclick="renameFloor('${floor.id}')">&#9998; Rename Floor</button>
            <button class="btn btn-secondary btn-sm" onclick="toggleFloorComplete('${floor.id}')">${floor.completed ? '&#8635; Reopen Floor' : '&#10003; Mark Complete'}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteFloor('${floor.id}')">Delete This Floor</button>
        </div>
    </div>`;

    return html;
}

            </div>

        </div>
    </div>`;

    // History
    html += `<div class="section-header">
        <span class="section-title">History</span>
        ${item.hoursLog.length > 0 ? `<button class="icon-btn" onclick="exportItemHistory('${floor.id}','${item.id}')">&#8595; Export</button>` : ''}
    </div>`;

    if (item.hoursLog.length === 0) {
        html += `<div class="card"><div class="empty-state">No hours logged yet.<br>Use the form above to log your first entry.</div></div>`;
    } else {
        html += `<div class="card"><table class="log-table">
            <thead><tr><th>Date</th><th>Skilled</th><th>Skld Hrs</th><th>Laborer</th><th>Lab Hrs</th><th>Man-Hrs</th><th>Note</th><th></th></tr></thead><tbody>`;
        item.hoursLog.forEach((entry, idx) => {
            const d  = entryDisplay(entry);
            const mh = entryManHours(entry);
            const workerNames = (entry.workerIds || []).map(id => {
                const w = (state.crew || []).find(c => c.id === id);
                return w ? w.name.split(' ')[0] : null;
            }).filter(Boolean);
            html += `<tr>
                <td>${displayDate(entry.date)}${workerNames.length > 0 ? `<div style="font-size:10px;color:#1a73e8;margin-top:2px">${workerNames.join(', ')}</div>` : ''}</td>
                <td>${d.skilled}</td>
                <td>${d.skilledHours}</td>
                <td>${d.laborer}</td>
                <td>${d.laborerHours || '—'}</td>
                <td class="man-hrs-cell">${mh}</td>

        });

    }

    // Materials Used on this item
    const itemMatUsage = [];
    (state.materials || []).forEach(mat => {
        const entries = (mat.log || []).filter(e => e.type === 'usage' && e.itemId === item.id);
        if (entries.length > 0) {
            const total = entries.reduce((s, e) => s + e.qty, 0);
            itemMatUsage.push({ name: mat.name, unit: mat.unit, trade: mat.trade || 'Other', total, matId: mat.id });
        }
    });
    if (itemMatUsage.length > 0) {
        const byTrade = {};
        itemMatUsage.forEach(m => { (byTrade[m.trade] = byTrade[m.trade] || []).push(m); });
        html += `<div class="section-header"><span class="section-title">Materials Used</span></div>

        Object.entries(byTrade).forEach(([trade, mats]) => {

        });
