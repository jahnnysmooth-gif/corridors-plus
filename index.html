// ── Firebase sync ─────────────────────────────────────────────────────────────
function initFirebase() {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();

    // Connection status indicator
    db.ref('.info/connected').on('value', snap => {
        const el = document.getElementById('syncIndicator');
        if (!el) return;
        if (snap.val()) {
            el.textContent = '● Live';
            el.style.display = '';
            el.style.background = 'rgba(34,197,94,0.25)';
            el.style.color = '#86efac';
        } else {
            el.textContent = '○ Offline';
            el.style.display = '';
            el.style.background = 'rgba(255,255,255,0.1)';
            el.style.color = 'rgba(255,255,255,0.5)';
        }
    });

    // Real-time listener — updates all devices when anyone saves
    db.ref('projects/' + syncCode + '/state').on('value', snap => {
        if (_localWrite) return;
        const remote = snap.val();
        // Reject remote state that is older than what we already have locally
        if (remote && remote.savedAt && state.savedAt && remote.savedAt < state.savedAt) return;
        if (remote && remote.floors && remote.floors.length > 0) {
            // Preserve local deletions that may not have reached Firebase yet
            const _localDeleted = [...(state.deletedMaterials || [])];
            state = remote;
            if (!state.floors) state.floors = [];
            if (!state.materials) state.materials = [];
            if (!state.attendance) state.attendance = [];
            if (!state.crew) state.crew = [];
            if (!state.reports) state.reports = {};
            if (!state.deletedMaterials) state.deletedMaterials = [];
            // Auto-populate sheets URL from Firebase so new devices don't need to re-enter it
            if (state.sheetsUrl && !localStorage.getItem('hallway_sheets_url')) {
                localStorage.setItem('hallway_sheets_url', state.sheetsUrl);
            }
            // Merge any local deletions the remote snapshot doesn't know about yet
            const _remoteDelKeys = new Set(state.deletedMaterials.map(d => (String(d.trade||'')+'||'+String(d.name||'')).toLowerCase()));
            _localDeleted.forEach(d => {
                const k = (String(d.trade||'')+'||'+String(d.name||'')).toLowerCase();
                if (!_remoteDelKeys.has(k)) state.deletedMaterials.push(d);
            });
            // Strip any materials that belong to the merged deletion list (match by trade+name)
            const _allDelKeys = new Set(state.deletedMaterials.map(d => (String(d.trade||'')+'||'+String(d.name||'')).toLowerCase()));
            state.materials = state.materials.filter(m => !_allDelKeys.has((String(m.trade||'')+'||'+String(m.name||'')).toLowerCase()));
            state.floors.forEach(f => { (f.items || []).forEach(i => { if (!i.hoursLog) i.hoursLog = []; }); });
            // Normalize materials: ensure log array and backfill trade
            const _tradeLookup = {};
            DEFAULT_MATERIALS.forEach(d => { _tradeLookup[d.name.toLowerCase()] = d.trade; });
            let _tradeDirty = false;
            state.materials.forEach(m => {
                if (!m.log) m.log = [];
                if (!m.trade && _tradeLookup[m.name.toLowerCase()]) { m.trade = _tradeLookup[m.name.toLowerCase()]; _tradeDirty = true; }
            });
            // Patch Floor 4 start date
            const _f4 = state.floors.find(f => f.name === 'Floor 4');
            if (_f4 && _f4.startDate !== '2026-05-04') { _f4.startDate = '2026-05-04'; _tradeDirty = true; }
            // Patch Joint Compound unit
            const _jc = (state.materials || []).find(m => m.name === 'Joint Compound' && m.unit === 'bags');
            if (_jc) { _jc.unit = 'buckets'; _tradeDirty = true; }
            // Rename Drywall → Plaster
            (state.materials || []).forEach(m => { if (m.trade === 'Drywall') { m.trade = 'Plaster'; _tradeDirty = true; } });
            // Merge Wall Primer + Ceiling Primer → Primer
            const _wallP   = (state.materials || []).find(m => m.name === 'Wall Primer');
            const _ceilP   = (state.materials || []).find(m => m.name === 'Ceiling Primer');
            const _primerX = (state.materials || []).find(m => m.name === 'Primer');
            if ((_wallP || _ceilP) && !_primerX) {
                const _ml = [...(_wallP ? _wallP.log||[] : []), ...(_ceilP ? _ceilP.log||[] : [])];
                state.materials.push({ id: uid(), name: 'Primer', unit: 'buckets', trade: 'Paint', log: _ml });
                _tradeDirty = true;
            }
            if (_wallP) { state.materials = state.materials.filter(m => m.name !== 'Wall Primer'); _tradeDirty = true; }
            if (_ceilP) { state.materials = state.materials.filter(m => m.name !== 'Ceiling Primer'); _tradeDirty = true; }
            // Add / backfill Georgetown materials
            const _matByName = {};
            (state.materials || []).forEach(m => { _matByName[m.name] = m; });
            const _deletedNames = new Set((state.deletedMaterials || []).map(d => String(d.name || '').toLowerCase()));
            DEFAULT_MATERIALS.forEach(dm => {
                if (!_matByName[dm.name] && !_deletedNames.has(dm.name.toLowerCase())) {
                    state.materials.push({ id: uid(), name: dm.name, unit: dm.unit, trade: dm.trade, startQty: dm.startQty !== undefined ? dm.startQty : 0, log: [] });
                    _tradeDirty = true;
                } else {
                    const _ex = _matByName[dm.name];
                    if (_ex && (_ex.startQty === undefined || _ex.startQty === null) && dm.startQty !== undefined) { _ex.startQty = dm.startQty; _tradeDirty = true; }
                    if (_ex && !_ex.trade && dm.trade) { _ex.trade = dm.trade; _tradeDirty = true; }
                }
            });
            localStorage.setItem('hallway_tracker_v2', JSON.stringify(state));
            if (_tradeDirty) persist();
            render();
        } else if (!snap.exists()) {
            // Remote path truly doesn't exist — push local data up
            render();
            db.ref('projects/' + syncCode + '/state').set(state);
        } else {
            // Remote exists but returned null (likely a permissions/rules error) — keep local state
            render();
        }
    });
}

function joinSync() {
    const raw = document.getElementById('syncCodeInput').value.trim();
    if (!raw || raw.length < 3) { alert('Enter a sync code (at least 3 characters).'); return; }
    syncCode = raw.toLowerCase().replace(/[^a-z0-9]/g, '-');
    localStorage.setItem('hallway_sync_code', syncCode);
    document.getElementById('syncOverlay').classList.remove('open');
    initFirebase();
    render();
}

function disconnectSync() {
    if (!confirm('Disconnect from "' + syncCode + '"? The app will ask for a sync code next time.')) return;
    if (db) db.ref('projects/' + syncCode + '/state').off();
    db = null; syncCode = null; _localWrite = false;
    localStorage.removeItem('hallway_sync_code');
    const el = document.getElementById('syncIndicator');
    if (el) el.style.display = 'none';
    document.getElementById('syncCodeInput').value = '';
    document.getElementById('syncOverlay').classList.add('open');
}

// ── Auto-seed any missing Georgetown Plaza floors + patch start dates ──────────
(function() {
    let dirty = false;
    // Patch Floor 4 start date to 2026-05-04
    const f4 = state.floors.find(f => f.name === 'Floor 4');
    if (f4 && f4.startDate !== '2026-05-04') { f4.startDate = '2026-05-04'; dirty = true; }
    // Patch Joint Compound unit from bags → buckets (legacy)
    const jc = (state.materials || []).find(m => m.name === 'Joint Compound' && m.unit === 'bags');
    if (jc) { jc.unit = 'buckets'; dirty = true; }
    // Rename Drywall trade → Plaster
    (state.materials || []).forEach(m => { if (m.trade === 'Drywall') { m.trade = 'Plaster'; dirty = true; } });
    // Merge Wall Primer + Ceiling Primer → Primer (legacy)
    const wallPrimer   = (state.materials || []).find(m => m.name === 'Wall Primer');
    const ceilPrimer   = (state.materials || []).find(m => m.name === 'Ceiling Primer');
    const primerExists = (state.materials || []).find(m => m.name === 'Primer');
    if ((wallPrimer || ceilPrimer) && !primerExists) {
        const mergedLog = [...(wallPrimer ? wallPrimer.log || [] : []), ...(ceilPrimer ? ceilPrimer.log || [] : [])];
        state.materials.push({ id: uid(), name: 'Primer', unit: 'buckets', trade: 'Paint', log: mergedLog });
        dirty = true;
    }
    if (wallPrimer) { state.materials = state.materials.filter(m => m.name !== 'Wall Primer'); dirty = true; }
    if (ceilPrimer) { state.materials = state.materials.filter(m => m.name !== 'Ceiling Primer'); dirty = true; }

    // Add / backfill Georgetown materials from DEFAULT_MATERIALS
    const matByName = {};
    (state.materials || []).forEach(m => { matByName[m.name] = m; });
    const deletedNames = new Set((state.deletedMaterials || []).map(d => String(d.name || '').toLowerCase()));
    DEFAULT_MATERIALS.forEach(dm => {
        if (!matByName[dm.name] && !deletedNames.has(dm.name.toLowerCase())) {
            // Add missing material
            state.materials.push({ id: uid(), name: dm.name, unit: dm.unit, trade: dm.trade, startQty: dm.startQty !== undefined ? dm.startQty : 0, log: [] });
            dirty = true;
        } else {
            const existing = matByName[dm.name];
            if (!existing) return; // deleted item — skip backfill
            // Backfill startQty if not yet set
            if ((existing.startQty === undefined || existing.startQty === null) && dm.startQty !== undefined) {
                existing.startQty = dm.startQty;
                dirty = true;
            }
            // Backfill trade if missing
            if (!existing.trade && dm.trade) { existing.trade = dm.trade; dirty = true; }
        }
    });

    const existing = new Set(state.floors.map(f => f.name));
    const toAdd = GEORGETOWN_SCHEDULE.filter(f => !existing.has(f.name));
    if (toAdd.length > 0) {
        toAdd.forEach(f => {
            state.floors.push({
                id: uid(),
                name: f.name,
                startDate: f.startDate,
                items: DEFAULT_ITEMS.map(n => ({ id: uid(), name: n, hoursLog: [], status: 'pending' }))
            });
        });
        dirty = true;
    }
    if (dirty) persist();
})();

// ── App icon (canvas-generated for PWA + favicon) ─────────────────────────────
(function() {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const ctx = c.getContext('2d');

    // Navy background
    ctx.fillStyle = '#1a3a5c';
    ctx.fillRect(0, 0, 180, 180);

    // Blueprint grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    const step = 18;
    for (let x = 0; x <= 180; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 180); ctx.stroke();
    }
    for (let y = 0; y <= 180; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(180, y); ctx.stroke();
    }

    // Subtle accent lines (thicker, lighter)
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.5;
    for (let x = 0; x <= 180; x += step * 3) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 180); ctx.stroke();
    }
    for (let y = 0; y <= 180; y += step * 3) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(180, y); ctx.stroke();
    }

    // C+ text — white, bold, centered
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 80px -apple-system, BlinkMacSystemFont, Arial, sans-serif';
    ctx.fillText('C+', 90, 93);

    const url = c.toDataURL('image/png');
    document.getElementById('appIcon').href = url;
    document.getElementById('favicon').href = url;
})();

let _attendanceDate = today();
let _attView = 'signin'; // 'signin' | 'roster'
let _attShowAll = false;
let _attShowOlder = false;

function getAttendanceDay(date) {
    return (state.attendance || []).find(a => a.date === date) || null;
}

function getCheckedIds(date) {
    const day = getAttendanceDay(date);
    return new Set(day ? day.workerIds : []);
}

function setAttendanceDate(date) {
    if (!date) return;
    _attendanceDate = date;
    document.getElementById('app').innerHTML = renderAttendance();
}

function toggleSignIn(workerId, date) {
    date = date || today();
    if (!state.attendance) state.attendance = [];
    if (!state.crew) state.crew = [];
    let day = state.attendance.find(a => a.date === date);
    if (!day) {
        day = { id: uid(), date: date, workerIds: [] };
        state.attendance.push(day);
    }
    const idx = day.workerIds.indexOf(workerId);
    if (idx === -1) {
        openSignInDetailModal(workerId, day);
    } else {
        day.workerIds.splice(idx, 1);
        if (day.details) delete day.details[workerId];
        if (day.workerIds.length === 0) state.attendance = state.attendance.filter(a => a.date !== date);
        persist();
        document.getElementById('app').innerHTML = renderAttendance();
    }
}

function openSignInDetailModal(workerId, day, afterSave) {
    const member = (state.crew || []).find(c => c.id === workerId);
    const existingDetail = (day.details || {})[workerId] || {};
    openModal(
        (member ? member.name + ' — ' : '') + 'Sign In',
        `<div class="form-group">
            <label>Hours Worked</label>
            <input id="signin_hours" type="number" min="1" max="24" step="0.5" value="${existingDetail.hours || 8}" />
        </div>`,
        () => {
            const hours = parseFloat(document.getElementById('signin_hours')?.value) || 0;
            if (!day.details) day.details = {};
            if (!day.workerIds.includes(workerId)) day.workerIds.push(workerId);
            day.details[workerId] = { hours };
            persist();
            closeModal();
            if (afterSave) afterSave(); else document.getElementById('app').innerHTML = renderAttendance();
        }
    );
}

function editSignInDetail(workerId, date) {
    date = date || today();
    if (!state.attendance) return;
    let day = state.attendance.find(a => a.date === date);
    if (!day) return;
    const afterSave = view.screen === 'report'
        ? () => navigate('report', null, null, null, null, date)
        : () => { document.getElementById('app').innerHTML = renderAttendance(); };
    openSignInDetailModal(workerId, day, afterSave);
}

function findWorker(id) {
    return (state.crew || []).find(c => c.id === id) || (state.formerCrew || []).find(c => c.id === id) || null;
}

function removeCrewMember(id) {
    if (!confirm('Remove this person from the crew roster?')) return;
    const worker = (state.crew || []).find(c => c.id === id);
    state.crew = (state.crew || []).filter(c => c.id !== id);
    // Move to formerCrew so historical attendance and reports still resolve their name
    if (worker) {
        if (!state.formerCrew) state.formerCrew = [];
        if (!state.formerCrew.find(c => c.id === id)) state.formerCrew.push(worker);
    }
    // Attendance records are kept intact — do not purge historical data
    persist();
    document.getElementById('app').innerHTML = renderAttendance();
}

function toggleCrewActive(id) {
    const w = (state.crew || []).find(c => c.id === id);
    if (!w) return;
    w.active = w.active === false ? true : false;
    persist();
    document.getElementById('app').innerHTML = renderAttendance();
}

function crewSortOrder(trade) {
    if (trade === 'Supervisor') return 0;
    if (trade === 'Foreman') return 1;
    return 2;
}

function sortedWorkerIds(workerIds, crew) {
    return [...workerIds].sort((a, b) => {
        const ma = findWorker(a);
        const mb = findWorker(b);
        return crewSortOrder(ma?.trade) - crewSortOrder(mb?.trade);
    });
}

function exportAttendancePDF(date) {
    date = date || _attendanceDate;
    const day = getAttendanceDay(date);
    const checkedIds = new Set(day ? day.workerIds : []);
    const crew = state.crew || [];
    const present = crew.filter(c => checkedIds.has(c.id)).sort((a,b) => crewSortOrder(a.trade) - crewSortOrder(b.trade));
    const dateStr = new Date(date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const rows = present.map(w =>
        `<tr><td>${w.name}</td><td>${w.trade || '—'}</td></tr>`

function selectAllWorkers(date) {
    date = date || today();
    if (!state.attendance) state.attendance = [];
    if (!state.crew) state.crew = [];
    const activeCrew = state.crew.filter(c => c.active !== false);
    let day = state.attendance.find(a => a.date === date);
    if (!day) { day = { id: uid(), date: date, workerIds: [] }; state.attendance.push(day); }
    day.workerIds = activeCrew.map(c => c.id);
    day.details = day.details || {};
    activeCrew.forEach(c => {
        if (!day.details[c.id]) day.details[c.id] = { hours: 8 };
        else if (!day.details[c.id].hours) day.details[c.id].hours = 8;
    });
    persist();
    document.getElementById('app').innerHTML = renderAttendance();
}

function deselectAllWorkers(date) {
    date = date || today();
    state.attendance = (state.attendance || []).filter(a => a.date !== date);
    persist();
    document.getElementById('app').innerHTML = renderAttendance();
}

function viewPastAttendance(date) {
    setAttendanceDate(date);
}

function removeWorkerFromDay(workerId, date) {
    if (!confirm('Remove this worker from ' + displayDate(date) + '?')) return;
    const day = (state.attendance || []).find(a => a.date === date);
    if (!day) return;
    day.workerIds = day.workerIds.filter(id => id !== workerId);
    if (day.details) delete day.details[workerId];
    if (day.workerIds.length === 0) state.attendance = state.attendance.filter(a => a.date !== date);
    persist();
    navigate('report', null, null, null, null, date);
}

function deleteAttendanceDay(date) {
    if (!confirm('Delete attendance record for ' + displayDate(date) + '?')) return;
    state.attendance = (state.attendance || []).filter(a => a.date !== date);
    persist();
    closeModal();
    document.getElementById('app').innerHTML = renderAttendance();
}

function openWeeklyAttendancePicker() {
    // Collect all unique Sun–Sat weeks that have at least one attendance record
    const allDates = (state.attendance || []).map(a => a.date).sort();
    if (allDates.length === 0) { alert('No attendance records found.'); return; }

    const weeks = [];
    const seen  = new Set();
    allDates.forEach(date => {
        const d   = new Date(date + 'T12:00:00');
        const sun = new Date(d); sun.setDate(d.getDate() - d.getDay());
        const key = sun.toISOString().slice(0, 10);
        if (!seen.has(key)) {
            seen.add(key);
            const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
            weeks.push({ start: key, end: localISO(sat) });
        }
    });
    weeks.sort((a, b) => b.start.localeCompare(a.start)); // newest first

    // Also include current week if not already listed
    const { start: cStart, end: cEnd } = getWeekRange();
    if (!seen.has(cStart)) weeks.unshift({ start: cStart, end: cEnd });

    let body = `<div style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:2px">`;
    weeks.forEach(({ start, end }) => {
        const count = (state.attendance || []).filter(a => a.date >= start && a.date <= end).length;
        body += `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1.5px solid #e0e0e0;border-radius:10px;background:#f9f9f9">
            <div>
                <div style="font-size:14px;font-weight:700">${displayDate(start)} – ${displayDate(end)}</div>
                <div style="font-size:12px;color:#999;margin-top:2px">${count} day${count !== 1 ? 's' : ''} recorded</div>
            </div>
            <button class="btn btn-primary" style="padding:7px 14px;font-size:13px" onclick="closeModal();exportWeeklyAttendancePDF('${start}','${end}')">🖨️ PDF</button>
        </div>`;
    });
    body += `</div>`;
    openModal('Weekly Attendance', body, null, true);
}

function exportWeeklyAttendancePDF(start, end) {
    if (!start || !end) {
        const range = getWeekRange();
        start = range.start; end = range.end;
    }
    const crew = state.crew || [];
    const weekDays = [];
    for (let d = new Date(start + 'T12:00:00'); d.toISOString().slice(0,10) <= end; d.setDate(d.getDate()+1)) {
        weekDays.push(d.toISOString().slice(0,10));
    }
    const dayLabels = weekDays.map(d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'}));
    const label = `${displayDate(start)} – ${displayDate(end)}`;

    // Build per-worker data
    const rows = crew.map(w => {
        const dayData = weekDays.map(date => {
            const att = (state.attendance||[]).find(a=>a.date===date);
            const detail = att ? (att.details||{})[w.id] : null;
            const present = att && (att.workerIds||[]).includes(w.id);
            return { present, hours: detail?.hours || 0 };
        });
        const totalHours = dayData.reduce((s,d)=>s+(d.hours||0),0);
        const daysWorked = dayData.filter(d=>d.present).length;
        if (daysWorked === 0) return null;
        return { w, dayData, totalHours, daysWorked };
    }).filter(Boolean).sort((a,b) => crewSortOrder(a.w.trade) - crewSortOrder(b.w.trade));

    const headerCells = dayLabels.map(l=>`<th style="padding:7px 8px;text-align:center;font-size:10px">${l}</th>`).join('');
    const bodyRows = rows.map(({w, dayData, totalHours}) => {
        const dayCells = dayData.map(d => d.present
            ? `<td style="padding:7px 8px;text-align:center;border-bottom:1px solid #eee;color:#1a3a5c;font-weight:700">${d.hours||'✓'}</td>`
            : `<td style="padding:7px 8px;text-align:center;border-bottom:1px solid #eee;color:#ddd">—</td>`
        ).join('');
        return `<tr>
            <td style="padding:7px 8px;border-bottom:1px solid #eee;font-weight:700">${w.name}</td>
            <td style="padding:7px 8px;border-bottom:1px solid #eee;color:#888;font-size:12px">${w.trade||'—'}</td>
            ${dayCells}
            <td style="padding:7px 8px;border-bottom:1px solid #eee;text-align:center;font-weight:800;color:#1a3a5c;background:#f0f4ff">${totalHours||'—'}</td>
        </tr>`;
    }).join('');

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Weekly Attendance</title>
    <style>* { box-sizing:border-box; margin:0; padding:0; } body { font-family:Arial,sans-serif; font-size:13px; color:#111; padding:28px; }
    h1 { font-size:18px; font-weight:800; color:#1a3a5c; margin-bottom:4px; }
    .meta { font-size:12px; color:#666; margin-bottom:20px; }
    table { width:100%; border-collapse:collapse; }
    th { background:#1a3a5c; color:white; padding:8px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
    @media print { body { padding:16px; } }</style></head><body>
    <h1>Corridor's Plus — Weekly Attendance</h1>
    <div class="meta">Week of ${label} &nbsp;·&nbsp; Generated ${displayDate(today())}</div>
    <table>
        <thead><tr>
            <th>Name</th><th>Trade</th>${headerCells}<th style="text-align:center;background:#0d2d4a">Total Hrs</th>
        </tr></thead>
        <tbody>${bodyRows || '<tr><td colspan="' + (weekDays.length+3) + '" style="padding:12px;color:#aaa;font-style:italic">No attendance this week.</td></tr>'}</tbody>
    </table>
    <script>window.onload=()=>window.print();<\/script></body></html>`;
    window.open(URL.createObjectURL(new Blob([html], { type: 'text/html' })), '_blank');
}

function renderAttendance() {
    const t           = today();
    const crew        = state.crew || [];
    const activeCrew  = crew.filter(w => w.active !== false);
    const inactiveCrew = crew.filter(w => w.active === false);
    const checkedIds  = getCheckedIds(_attendanceDate);
    const presentCount = checkedIds.size;
    const isToday     = _attendanceDate === t;
    const currentDay  = getAttendanceDay(_attendanceDate);
    const allChecked  = activeCrew.length > 0 && activeCrew.every(w => checkedIds.has(w.id));

    // Sub-header — always visible
    const subHeader = `<div style="display:flex;gap:8px;margin-bottom:16px">
        <button onclick="exportAttendancePDF('${_attendanceDate}')" style="flex:1;padding:10px;background:#f1f5f9;border:1.5px solid #e0e0e0;border-radius:10px;font-size:13px;font-weight:600;color:#1a3a5c;cursor:pointer">🖨️ Daily PDF</button>
        <button onclick="openWeeklyAttendancePicker()" style="flex:1;padding:10px;background:#f1f5f9;border:1.5px solid #e0e0e0;border-radius:10px;font-size:13px;font-weight:600;color:#1a3a5c;cursor:pointer">📄 Weekly PDF</button>
        <button onclick="_attView='roster';document.getElementById('app').innerHTML=renderAttendance()" style="flex:1;padding:10px;background:#f1f5f9;border:1.5px solid #e0e0e0;border-radius:10px;font-size:13px;font-weight:600;color:#1a3a5c;cursor:pointer">👥 Manage Roster</button>
    </div>`;

    let html = subHeader;

    // ── Roster view ──
    if (_attView === 'roster') {
        html += `<div class="section-header"><span class="section-title">Crew Roster</span>
            <button class="icon-btn" onclick="_attView='signin';document.getElementById('app').innerHTML=renderAttendance()">← Back</button>
        </div>`;

        if (crew.length === 0) {
            html += `<div class="card"><div class="empty-state">No crew members yet.<br>Add everyone here once, then sign them in daily.</div></div>`;
        } else {
            // Active crew
            if (activeCrew.length > 0) {
                html += `<div style="font-size:11px;font-weight:700;color:#16a34a;text-transform:uppercase;letter-spacing:0.6px;margin:8px 0 6px">Active (${activeCrew.length})</div>`;
                html += `<div class="card" style="padding:8px 16px">`;
                activeCrew.forEach(w => {
                    html += `<div class="worker-row">
                        <div>
                            <div class="worker-name">${w.name}</div>
                            ${w.trade ? `<div class="worker-trade">${w.trade}</div>` : ''}
                        </div>
                        <div style="display:flex;gap:8px;align-items:center">
                            <button class="edit-row" onclick="editCrewMember('${w.id}')">&#9998;</button>
                            <button onclick="toggleCrewActive('${w.id}')" style="padding:4px 10px;border:1.5px solid #e5e7eb;border-radius:99px;font-size:11px;font-weight:600;color:#6b7280;background:none;cursor:pointer">Set Inactive</button>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            }

            // Inactive crew
            if (inactiveCrew.length > 0) {
                html += `<div style="font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:0.6px;margin:16px 0 6px">Inactive (${inactiveCrew.length})</div>`;
                html += `<div class="card" style="padding:8px 16px;opacity:0.6">`;
                inactiveCrew.forEach(w => {
                    html += `<div class="worker-row">
                        <div>
                            <div class="worker-name" style="color:#9ca3af">${w.name}</div>
                            ${w.trade ? `<div class="worker-trade">${w.trade}</div>` : ''}
                        </div>
                        <div style="display:flex;gap:8px;align-items:center">
                            <button onclick="toggleCrewActive('${w.id}')" style="padding:4px 10px;border:1.5px solid #16a34a;border-radius:99px;font-size:11px;font-weight:600;color:#16a34a;background:none;cursor:pointer">Reactivate</button>
                            <button class="delete-row" onclick="removeCrewMember('${w.id}')">×</button>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            }
        }

        html += `<button class="btn btn-primary" style="width:100%;margin-top:12px;padding:14px;font-size:15px" onclick="addCrewMember()">+ Add Crew Member</button>`;
        return html;
    }

    // ── Sign-In view ──
    if (activeCrew.length === 0) {
        html += `<div class="card"><div class="empty-state">No active crew members.<br>Tap <strong>Manage Roster</strong> above to add or reactivate crew.</div></div>`;
        return html;
    }

    // Back to Today button when viewing a past day
    if (!isToday) {
        html += `<button style="width:100%;margin-bottom:12px;padding:12px;background:#fff7ed;border:1.5px solid #f97316;border-radius:10px;color:#c2410c;font-size:14px;font-weight:700;cursor:pointer" onclick="setAttendanceDate('${t}')">← Back to Today</button>`;
    }

    // Section header
    html += `<div class="section-header">
        <span class="section-title">${isToday ? 'Today' : displayDate(_attendanceDate)} · ${presentCount} of ${activeCrew.length} on site</span>
        <button class="icon-btn" onclick="${allChecked ? `deselectAllWorkers('${_attendanceDate}')` : `selectAllWorkers('${_attendanceDate}')`}">${allChecked ? 'Deselect All' : 'Select All'}</button>
    </div>`;

    // Worker list
    html += `<div class="card" style="padding:8px 16px">`;
    activeCrew.forEach(w => {
        const checked = checkedIds.has(w.id);
        const detail  = (currentDay?.details || {})[w.id];
        const hoursLine = checked && detail?.hours
            ? `<div style="font-size:11px;color:#0891b2;margin-top:2px">${detail.hours} hrs</div>`
            : '';
        html += `<div class="worker-row att-row${checked?' att-checked':''}" onclick="toggleSignIn('${w.id}','${_attendanceDate}')" style="cursor:pointer">
            <div style="display:flex;align-items:center;gap:12px">
                <input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();toggleSignIn('${w.id}','${_attendanceDate}')"
                    style="width:20px;height:20px;accent-color:#0891b2;cursor:pointer;flex-shrink:0" />
                <div>
                    <div class="worker-name">${w.name}</div>
                    ${w.trade ? `<div class="worker-trade">${w.trade}</div>` : ''}
                    ${hoursLine}
                </div>
            </div>
            ${checked ? `<button class="edit-row" style="font-size:14px" onclick="event.stopPropagation();editSignInDetail('${w.id}','${_attendanceDate}')">&#9998;</button>` : ''}
        </div>`;
    });
    html += `</div>`;

    // Buttons
    if (!isToday) {
        html += `<button class="btn btn-danger" style="width:100%;margin-top:6px" onclick="deleteAttendanceDay('${_attendanceDate}')">Delete This Day</button>`;
    }

    // Recent Days — last 7 days + collapsible Older Records
    if (isToday) {
        const cutoff    = addWeeks(t, -1);
        const allDays   = (state.attendance || []).slice().sort((a,b) => b.date.localeCompare(a.date));
        const recentDays = allDays.filter(a => a.date >= cutoff);
        const olderDays  = allDays.filter(a => a.date < cutoff);

        const dayRow = (a) => {
            const isCurrentDay = a.date === t;
            const names = (a.workerIds || []).map(id => { const m = findWorker(id); return m ? m.name.split(' ')[0] : null; }).filter(Boolean);
            return `<div class="worker-row" style="cursor:pointer${isCurrentDay?';background:#f0f9ff':''}" onclick="setAttendanceDate('${a.date}')">
                <div>
                    <div class="worker-name">${isCurrentDay ? 'Today ✓' : displayDate(a.date)}</div>
                    <div class="worker-trade">${(a.workerIds||[]).length} on site · ${names.join(', ')}</div>
                </div>
                <span style="color:#ccc;font-size:20px">›</span>
            </div>`;
        };

        if (recentDays.length > 0) {
            html += `<div class="section-header" style="margin-top:20px"><span class="section-title">Recent Days</span></div>`;
            html += `<div class="card">` + recentDays.map(dayRow).join('') + `</div>`;
        }

        if (olderDays.length > 0) {
            html += `<div class="card" style="margin-top:10px">
                <div class="worker-row" style="cursor:pointer" onclick="_attShowOlder=!_attShowOlder;document.getElementById('app').innerHTML=renderAttendance()">
                    <div>
                        <div class="worker-name">Older Records</div>
                        <div class="worker-trade">${olderDays.length} day${olderDays.length===1?'':'s'}</div>
                    </div>
                    <span style="color:#ccc;font-size:20px">${_attShowOlder ? '▾' : '▸'}</span>
                </div>
                ${_attShowOlder ? olderDays.map(dayRow).join('') : ''}
            </div>`;
        }
    }

    return html;
}

function renderDailyReports() {
    const dates = new Set();
    (state.attendance || []).forEach(a => dates.add(a.date));
    (state.floors || []).forEach(f => (f.items||[]).forEach(i => (i.hoursLog||[]).forEach(e => dates.add(e.date))));
    Object.keys(state.reports || {}).forEach(d => dates.add(d));

    const sorted = [...dates].sort((a,b) => b.localeCompare(a));

    if (sorted.length === 0) {
        return `<div class="card"><div class="empty-state">No reports yet.<br>Log labor or attendance to generate a report.</div></div>`;
    }

    let html = `<div style="margin-bottom:12px"><input type="date" style="width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;color:#1a1a2e" onchange="if(this.value)navigate('report',null,null,null,null,this.value)" placeholder="Pick any date…" /></div>`;
    sorted.slice(0, 5).forEach(date => {
        const att = (state.attendance||[]).find(a => a.date === date);
        const workerCount = att ? att.workerIds.length : 0;
        const dayMH = (state.floors||[]).reduce((s,f) => s + (f.items||[]).reduce((ss,i) => ss + (i.hoursLog||[]).filter(e=>e.date===date).reduce((sss,e)=>sss+entryManHours(e),0), 0), 0);
        const hasNotes = !!(state.reports?.[date]?.notes);
        html += `<div class="report-day-card" onclick="navigate('report',null,null,null,null,'${date}')">
            <div>
                <div class="report-day-date">${displayDate(date)}</div>
                <div class="report-day-meta">${workerCount > 0 ? workerCount + ' on site' : 'No attendance'}${dayMH > 0 ? ' · ' + dayMH + ' man-hrs' : ''}${hasNotes ? ' · 📝' : ''}</div>
            </div>
            <span style="color:#ccc;font-size:22px">›</span>
        </div>`;
    });
    return html;
}

function renderReport(date) {
    if (!date) return '<div class="empty-state">No date selected.</div>';
    const att = (state.attendance||[]).find(a => a.date === date);
    const crew = state.crew || [];
    const floors = state.floors || [];
    const report = (state.reports || {})[date] || {};

    // ── Summary stats
    const totalWorkers = att ? (att.workerIds || []).length : 0;
    let skilledMH = 0, laborerMH = 0;
    floors.forEach(f => (f.items||[]).forEach(i => (i.hoursLog||[]).filter(e=>e.date===date).forEach(e => {
        skilledMH += entrySkilledMH(e);
        laborerMH += entryLaborerMH(e);
    })));
    const totalMH = skilledMH + laborerMH;

    let html = `<div class="stats-row" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:16px">
        <div class="stat-card"><div class="stat-value" style="color:#1a3a5c">${totalMH}</div><div class="stat-label">Total MH</div></div>
        <div class="stat-card"><div class="stat-value" style="color:#0891b2">${skilledMH}</div><div class="stat-label">Skilled MH</div></div>
        <div class="stat-card"><div class="stat-value" style="color:#7c3aed">${laborerMH}</div><div class="stat-label">Laborer MH</div></div>
    </div>`;

    // ── Workers on site
    html += `<div class="section-header"><span class="section-title">Workers on Site</span></div>`;
    if (!att || att.workerIds.length === 0) {

    } else {
        html += `<div class="report-section">`;
        sortedWorkerIds(att.workerIds, crew).forEach(wid => {
            const member = findWorker(wid);
            if (!member) return;
            const detail = (att.details || {})[wid] || {};

                </div>
            </div>`;
        });
        html += `</div>`;
    }

    // ── Labor by floor
    const floorData = [];
    floors.forEach(f => {
        const entries = (f.items||[]).flatMap(i => (i.hoursLog||[]).filter(e=>e.date===date).map(e=>({
            item:    i.name,
            mh:      entryManHours(e),
            workers: (e.workerIds||[]).map(id => (findWorker(id)?.name||'').split(' ')[0]).filter(Boolean)
        })));
        if (entries.length > 0) {
            const total = entries.reduce((s,e)=>s+e.mh, 0);
            floorData.push({ name: f.name, total, entries });
        }
    });
    html += `<div class="section-header"><span class="section-title">Labor</span></div>`;
    if (floorData.length === 0) {
        html += `<div class="report-section"><div style="color:#bbb;font-style:italic;font-size:14px">No labor logged.</div></div>`;
    } else {
        html += `<div class="report-section">`;
        floorData.forEach(f => {
            html += `<div style="padding:8px 0;border-bottom:1px solid #f0f0f0">
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <div style="font-weight:700;font-size:14px">${f.name}</div>
                    <span style="font-weight:800;font-size:16px;color:#1a3a5c">${f.total} mh</span>
                </div>
                ${f.entries.map(e => `<div style="font-size:12px;color:#666;margin-top:4px;padding-left:8px">
                    <span style="color:#333;font-weight:600">${e.item}</span>
                    <span style="color:#999"> · ${e.mh} mh</span>
                    ${e.workers.length ? `<span style="color:#1a73e8;font-weight:600"> · ${e.workers.join(', ')}</span>` : ''}
                </div>`).join('')}
            </div>`;
        });
        html += `</div>`;
    }

    // ── Materials used
    const matUsed = (state.materials||[]).map(m => {
        const entries = (m.log||[]).filter(e=>e.type==='usage'&&e.date===date);
        const qty = entries.reduce((s,e)=>s+e.qty,0);
        return qty > 0 ? { name: m.name, unit: m.unit, qty } : null;
    }).filter(Boolean);
    html += `<div class="section-header"><span class="section-title">Materials Used</span></div>`;
    if (matUsed.length === 0) {
        html += `<div class="report-section"><div style="color:#bbb;font-style:italic;font-size:14px">No materials logged.</div></div>`;
    } else {
        html += `<div class="report-section">`;
        matUsed.forEach(m => {
            html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0">

                <span style="font-weight:700;font-size:14px;color:#1a3a5c">${m.qty} ${m.unit}</span>
            </div>`;
        });
        html += `</div>`;
    }

    // ── Notes (inline editor)
    html += `<div class="section-header"><span class="section-title">Notes</span></div>
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:8px">
        <textarea id="dn_text" rows="6" placeholder="Observations, delays, scope changes, site conditions…"
            style="width:100%;padding:14px;border:none;outline:none;font-size:14px;line-height:1.7;resize:vertical;font-family:inherit;color:#1a1a2e;box-sizing:border-box">${(report.notes||'').replace(/</g,'&lt;')}</textarea>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
        <button class="btn btn-primary" style="flex:2" onclick="saveDailyNotes('${date}')">Save Notes</button>
        <button class="btn btn-secondary" style="flex:1" onclick="printDailyNotes('${date}')">&#8681; Print</button>
    </div>`;

    return html;
}

function parseSheetDate(str) {
    if (!str) return null;
    const s = String(str).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const parts = s.split('/');
    if (parts.length >= 2) {
        const m = parts[0].trim().padStart(2, '0');
        const d = parts[1].trim().padStart(2, '0');
        const rawY = parts[2] ? parts[2].trim() : '';
        const y = rawY.length === 2 ? '20' + rawY : (rawY.length === 4 ? rawY : String(new Date().getFullYear()));
        if (!isNaN(m) && !isNaN(d) && !isNaN(y)) return `${y}-${m}-${d}`;
    }
    return null;
}

// ── Payroll export ────────────────────────────────────────────────────────────
function getPayPeriod(offsetWeeks) {
    const d = new Date();
    if (offsetWeeks) d.setDate(d.getDate() + offsetWeeks * 7);
    const daysSinceWed = (d.getDay() + 4) % 7;
    const wed = new Date(d); wed.setDate(d.getDate() - daysSinceWed);
    const tue = new Date(wed); tue.setDate(wed.getDate() + 6);
    return { start: localISO(wed), end: localISO(tue) };
}

function openPayrollExport() {
    const gasUrl = localStorage.getItem('hallway_sheets_url');
    if (!gasUrl) { alert('Connect to Google Sheets first (tap ↺ Sync on the home screen).'); return; }

    const periods = [];
    const seen = new Set();
    for (let i = 0; i >= -7; i--) {
        const { start, end } = getPayPeriod(i);
        if (seen.has(start)) continue;
        seen.add(start);
        const label = i === 0 ? `Current  (${shortDate(start)} – ${shortDate(end)})` : `${shortDate(start)} – ${shortDate(end)}`;
        periods.push({ start, end, label });
    }

    const storedUrl = localStorage.getItem('hallway_payroll_url');
    const linkHtml  = storedUrl
        ? `<div style="margin-top:10px;font-size:13px;color:#1a73e8"><a href="${storedUrl}" target="_blank" style="color:#1a73e8">📊 Open Payroll Spreadsheet</a></div>`
        : '';

    openModal('Export Payroll', `
        <div class="form-group">
            <label>Pay Period (Wed – Tue)</label>
            <select id="pr_period" style="width:100%;padding:10px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px">
                ${periods.map((p, i) => `<option value="${i}">${p.label}</option>`).join('')}
            </select>
        </div>
        <p style="font-size:13px;color:#999;margin-top:8px">Pushes to the Payroll Google Sheet as a new tab. Re-pushing the same period overwrites it.</p>
        ${linkHtml}
    `, () => {
        const idx = parseInt(document.getElementById('pr_period').value);
        sendPayrollToSheets(periods[idx].start, periods[idx].end);
    });
}

async function sendPayrollToSheets(start, end) {
    const gasUrl = localStorage.getItem('hallway_sheets_url');
    if (!gasUrl) return;

    const crew       = state.crew || [];
    const attendance = state.attendance || [];

    // Build ordered date array for the period (Wed → Fri, Mon → Tue — no weekends)
    const dates = [];
    const cur   = new Date(start + 'T00:00:00');
    const endD  = new Date(end   + 'T00:00:00');
    while (cur <= endD) {
        const day = cur.getDay();
        if (day !== 0 && day !== 6) dates.push(cur.toISOString().slice(0, 10));
        cur.setDate(cur.getDate() + 1);
    }

    // Build per-worker data — only include workers with hours this period
    const workers = crew.map(w => {
        const dayHours = dates.map(date => {
            const att = attendance.find(a => a.date === date);
            if (!att || !(att.workerIds || []).includes(w.id)) return 0;
            return (att.details?.[w.id]?.hours) || 0;
        });
        return { name: w.name, trade: w.trade || '', dayHours, total: dayHours.reduce((s, h) => s + h, 0) };
    }).filter(w => w.total > 0);

    openModal('Sending…', `<p style="text-align:center;padding:24px 0;color:#888;font-size:14px">Pushing to Google Sheets…</p>`, null, true);

    try {
        const resp   = await fetch(gasUrl, { method: 'POST', body: JSON.stringify({ type: 'payroll', start, end, dates, workers }) });
        const result = await resp.json();
        closeModal();
        if (result.error) throw new Error(result.error);
        if (result.spreadsheetUrl) localStorage.setItem('hallway_payroll_url', result.spreadsheetUrl);
        alert(`✓ Payroll sheet updated!\n\nTab: ${result.tabName}\n\nOpen the spreadsheet to share it with payroll.`);
    } catch(err) {
        closeModal();
        alert('Failed to send payroll: ' + err.message);
    }
}

async function syncPull() {
    const url = localStorage.getItem('hallway_sheets_url');
    if (!url) return false;
    const toast = _showSyncToast('Pulling from Google Sheets…');
    try {
        const resp = await fetch(url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const rows = await resp.json();
        if (rows && rows.error) throw new Error(rows.error);

        const deletedKeys  = new Set((state.deletedMaterials || []).map(d => (String(d.trade||'') + '||' + String(d.name||'')).toLowerCase()));
        const confirmedKeys = new Set((state.pendingConfirms || []).map(d => (String(d.trade||'') + '||' + String(d.name||'')).toLowerCase()));
        let added = 0, updated = 0;
        (rows || []).forEach(row => {
            const name = String(row['Material'] || '').trim();
            if (!name) return;
            // Skip materials that were deleted or archived in the app
            const dKey = (String(row['Trade']||'') + '||' + name).toLowerCase();
            if (deletedKeys.has(dKey)) return;
            let mat = state.materials.find(m => m.name.toLowerCase() === name.toLowerCase());
            if (mat && mat.archived) return;
            const isNewMat = !mat;
            if (!mat) {
                mat = {
                    id: uid(), name,
                    trade: row['Trade'] || 'Misc.',
                    unit: row['Unit'] || '',
                    startQty: parseFloat(row['On Hand']) || 0,
                    parQty: parseFloat(row['Min Stock']) || 0,
                    reorderQty: parseFloat(row['To Order']) || 0,
                    log: [],
                    brand: row['Brand/Type'] || '',
                    notes: row['Notes'] || '',
                    link: row['Link'] || '',
                    procStatus: row['Order Status'] || '',
                    deliveryEta: _normalizeEtaDate(row['Delivery ETA'] || '')
                };
                state.materials.push(mat);
                added++;
            } else {
                mat.brand      = row['Brand/Type'] || mat.brand || '';
                mat.link       = row['Link']       || mat.link  || '';
                mat.parQty     = row['Min Stock'] !== '' && row['Min Stock'] !== undefined ? (parseFloat(row['Min Stock']) || 0) : (mat.parQty || 0);
                // Check confirmedKeys using both the sheet's trade and the app's trade (handles mismatch)
                const matKeyByRow = (String(row['Trade']||'') + '||' + name).toLowerCase();
                const matKeyByMat = (String(mat.trade||'')   + '||' + name).toLowerCase();
                const _isConfirmed = confirmedKeys.has(matKeyByRow) || confirmedKeys.has(matKeyByMat);
                const _toOrder = parseFloat(row['To Order']);
                if (!_isConfirmed) {
                    if (!isNaN(_toOrder)) mat.reorderQty = _toOrder;
                    mat.procStatus  = row['Order Status'] || mat.procStatus || '';
                    mat.deliveryEta = _normalizeEtaDate(row['Delivery ETA'] || '');
                }
                mat.notes = row['Notes'] || '';
                if (row['Trade']) mat.trade = row['Trade'];
                updated++;
            }
            // Import last delivery — skip for brand new materials (startQty already accounts for it)
            if (isNewMat) return;
            const isoDate  = parseSheetDate(row['Last Delivery Date']);
            const sheetQty = parseFloat(row['Last Delivery Qty']);
            if (isoDate && !isNaN(sheetQty) && sheetQty > 0) {
                const alreadyHas = (mat.log || []).some(e => e.type === 'delivery' && e.date === isoDate && e.qty === sheetQty);
                if (!alreadyHas) {
                    const lastDel = (mat.log || []).filter(e => e.type === 'delivery').sort((a,b) => b.date.localeCompare(a.date))[0];
                    if (!lastDel || isoDate >= lastDel.date) {
                        if (!mat.log) mat.log = [];
                        mat.log.push({ id: uid(), date: isoDate, type: 'delivery', qty: sheetQty, by: row['Ordered By'] || '' });
                    }
                }
            }
        });

        // Ensure no undefined fields that Firebase rejects
        state.materials.forEach(m => {
            if (!m.procStatus) m.procStatus = '';
            if (!m.brand)      m.brand      = '';
            if (!m.link)       m.link       = '';
        });
        persist(); render();
        localStorage.setItem('hallway_sheets_last_sync', new Date().toISOString());
        _showSyncToast(`&#10003; Pulled: ${added} added, ${updated} updated`, toast, 3500);
        return true;
    } catch(err) {
        _showSyncToast('&#10007; Pull failed: ' + err.message, toast, 4500);
        return false;
    }
}

async function syncPush() {
    const url = localStorage.getItem('hallway_sheets_url');
    if (!url) return;
    const toast = _showSyncToast('Pushing to Google Sheets…');
    const materials = (state.materials || []).filter(m => !m.archived).map(mat => {
        const lastDel = (mat.log || []).filter(e => e.type === 'delivery').sort((a,b) => b.date.localeCompare(a.date))[0];
        const stock = matCurrentStock(mat);
        return {
            'Trade':               mat.trade || 'Misc.',
            'Material':            mat.name,
            'Brand/Type':          mat.brand || '',
            'Unit':                mat.unit  || '',
            'On Hand':             stock !== null ? stock : '',
            'Min Stock':           mat.parQty    || '',
            'Last Delivery Date':  lastDel ? lastDel.date : '',
            'Last Delivery Qty':   lastDel ? lastDel.qty  : '',
            'Ordered By':          lastDel ? (lastDel.by || '') : '',
            'To Order':            mat.reorderQty > 0 ? mat.reorderQty : '',
            'Order Status':        mat.procStatus || '',
            'Delivery ETA':        mat.deliveryEta || '',
            'Link':                mat.link  || ''
        };
    });
    const deletions = (state.deletedMaterials || []).map(d => ({ name: d.name, trade: d.trade }));
    const archives  = (state.materials || []).filter(m => m.archived).map(m => ({ name: m.name, trade: m.trade || '' }));
    try {
        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ materials, deletions, archives })
        });
        const result = await resp.json().catch(() => ({}));
        if (result.error) throw new Error(result.error);
        localStorage.setItem('hallway_sheets_last_sync', new Date().toISOString());
        state.pendingConfirms  = [];
        // Trim deletedMaterials — sheet has processed them; keep last 100 as a safety buffer
        if ((state.deletedMaterials || []).length > 100) {
            state.deletedMaterials = state.deletedMaterials.slice(-100);
        }
        persist();
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    } catch(err) {
        _showSyncToast('&#10007; Push failed: ' + err.message, toast, 5000);
    }
}

function _showSyncToast(msg, existingToast, autoDismissMs) {
    let toast = existingToast;
    if (!toast) {
        toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a3a5c;color:white;padding:10px 22px;border-radius:99px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,0.22);transition:opacity .3s';
        document.body.appendChild(toast);
    }
    toast.innerHTML = msg;
    if (autoDismissMs) setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, autoDismissMs);
    return toast;
}

// ── Init ──────────────────────────────────────────────────────────────────────
const _savedCode = localStorage.getItem('hallway_sync_code');
if (_savedCode) {
    syncCode = _savedCode;
    render();          // show local data immediately while Firebase loads
    initFirebase();    // then connect — listener will re-render when data arrives
} else {
    document.getElementById('syncOverlay').classList.add('open');
}

// ── Pull-to-refresh ───────────────────────────────────────────────────────────
(function() {
    const THRESHOLD = 72;
    let startY = 0, pulling = false, indicator = null;

    function getIndicator() {
        if (!indicator) {
            indicator = document.createElement('div');
            indicator.style.cssText = 'position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;height:0;overflow:hidden;background:#1a3a5c;color:white;font-size:13px;font-weight:600;transition:height 0.15s;z-index:200;gap:8px';
            document.body.appendChild(indicator);
        }
        return indicator;
    }

    document.addEventListener('touchstart', e => {
        if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; }
    }, { passive: true });

    document.addEventListener('touchmove', e => {
        if (!pulling) return;
        const dist = Math.min(e.touches[0].clientY - startY, THRESHOLD * 1.5);
        if (dist <= 0) return;
        const ind = getIndicator();
        const ready = dist >= THRESHOLD;
        ind.style.height = Math.min(dist, THRESHOLD) + 'px';
        ind.innerHTML = ready ? '↻ Release to sync' : '↓ Pull to sync';
    }, { passive: true });

    document.addEventListener('touchend', e => {
        if (!pulling) return;
        pulling = false;
        const dist = e.changedTouches[0].clientY - startY;
        const ind = getIndicator();
        ind.style.height = '0';
        if (dist >= THRESHOLD && db && syncCode) {
            ind.innerHTML = '↻ Syncing…';
            ind.style.height = '44px';
            db.ref('projects/' + syncCode + '/state').once('value').then(snap => {
                ind.style.height = '0';
                const remote = snap.val();
                if (remote && remote.floors && remote.floors.length > 0 &&
                    !(remote.savedAt && state.savedAt && remote.savedAt < state.savedAt)) {
                    state = remote;
                    localStorage.setItem('hallway_tracker_v2', JSON.stringify(state));
                    render();
                }
                _showSyncToast('Synced ✓', null, 1800);
            }).catch(() => { ind.style.height = '0'; _showSyncToast('Sync failed', null, 1800); });
        }
    }, { passive: true });
})();

// Auto-sync with Google Sheets every 15 minutes (only when URL is configured)
setInterval(() => {
    if (localStorage.getItem('hallway_sheets_url')) {
        syncPull().then(ok => { if (ok) syncPush(); });
    }
}, 15 * 60 * 1000);
</script>
