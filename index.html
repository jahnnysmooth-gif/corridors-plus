        .footer{margin-top:32px;font-size:11px;color:#bbb;border-top:1px solid #eee;padding-top:12px}
    </style></head><body>
    <h1>Corridor's Plus — Georgetown Plaza</h1>
    <div class="sub">Daily Report &nbsp;·&nbsp; ${dateStr}</div>
    <div style="display:flex;gap:16px;margin-bottom:24px">
        <div style="flex:1;border:1.5px solid #e0e0e0;border-radius:8px;padding:12px;text-align:center">
            <div style="font-size:22px;font-weight:800;color:#1a3a5c">${pdfSkilledMH+pdfLaborerMH}</div>
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#888">Total MH</div>
        </div>
        <div style="flex:1;border:1.5px solid #e0e0e0;border-radius:8px;padding:12px;text-align:center">
            <div style="font-size:22px;font-weight:800;color:#0891b2">${pdfSkilledMH}</div>
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#888">Skilled MH</div>
        </div>
        <div style="flex:1;border:1.5px solid #e0e0e0;border-radius:8px;padding:12px;text-align:center">
            <div style="font-size:22px;font-weight:800;color:#7c3aed">${pdfLaborerMH}</div>
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#888">Laborer MH</div>
        </div>
    </div>

    <h2>Workers on Site</h2>
    <table><thead><tr><th>Name</th><th>Trade</th><th>Task / Floor</th></tr></thead><tbody>${workerRows}</tbody></table>

    ${laborRows ? `<h2>Labor</h2><table><thead><tr><th>Floor</th><th>Work</th><th>Man-Hrs</th></tr></thead><tbody>${laborRows}</tbody></table>` : ''}

    ${matRows ? `<h2>Materials Used</h2><table><thead><tr><th>Material</th><th>Quantity</th></tr></thead><tbody>${matRows}</tbody></table>` : ''}

    ${report.notes ? `<h2>Notes</h2><div class="notes">${report.notes}</div>` : ''}

    <div class="footer">Generated by Corridor's Plus &nbsp;·&nbsp; ${new Date().toLocaleString()}</div>
    <script>window.onload=()=>window.print();<\/script>
    </body></html>`;
    window.open(URL.createObjectURL(new Blob([html], { type: 'text/html' })), '_blank');
}

// ── Google Sheets Sync ────────────────────────────────────────────────────────
function parseSheetDate(str) {
    if (!str) return null;
    const s = String(str).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const parts = s.split('/');
    if (parts.length >= 2) {
        const m = parts[0].trim().padStart(2, '0');
        const d = parts[1].trim().padStart(2, '0');
        const rawY = parts[2] ? parts[2].trim() : '';
        const y = rawY.length === 2 ? '20' + rawY : (rawY.length === 4 ? rawY : String(new Date().getFullYear()));
        if (!isNaN(m) && !isNaN(d) && !isNaN(y)) return `${y}-${m}-${d}`;
    }
    return null;
}

function openSheetsSync() {
    const url = localStorage.getItem('hallway_sheets_url');
    const lastSync = localStorage.getItem('hallway_sheets_last_sync');
    const lastSyncStr = lastSync ? new Date(lastSync).toLocaleString() : null;

    if (!url) {
        openModal('Connect Google Sheets', `
            <p style="font-size:14px;color:#555;margin-bottom:14px">Paste the Google Apps Script Web App URL to sync your material inventory with your team's Google Sheet.</p>
            <div class="form-group">
                <label>Apps Script Web App URL</label>
                <input id="sheets_url_input" placeholder="https://script.google.com/macros/s/…" style="font-size:12px" />
            </div>
            <p style="font-size:12px;color:#aaa;margin-top:6px">In your Google Sheet: Extensions → Apps Script → Deploy → Manage deployments → copy the Web App URL.</p>
        `, () => {
            const val = document.getElementById('sheets_url_input').value.trim();
            if (!val.startsWith('https://')) { alert('Enter a valid Apps Script URL.'); return; }
            localStorage.setItem('hallway_sheets_url', val);
            closeModal();
            syncPull();
        });
        return;
    }

    syncPull().then(ok => { if (ok) syncPush(); });
    openModal('Google Sheets Sync', `
        ${lastSyncStr ? `<div class="sheets-last-sync">Last synced: ${lastSyncStr}</div>` : ''}
        <p style="font-size:13px;color:#555;margin-bottom:16px">Syncing with Google Sheets…</p>
        <hr style="margin:0 0 12px;border:none;border-top:1px solid #eee">
        <button onclick="if(confirm('Disconnect Google Sheets?')){localStorage.removeItem('hallway_sheets_url');closeModal();render();}" style="background:none;border:none;font-size:12px;color:#bbb;cursor:pointer;width:100%">Disconnect</button>
    `, null, true);
}

async function syncPull() {
    const url = localStorage.getItem('hallway_sheets_url');
    if (!url) return false;
    const toast = _showSyncToast('Pulling from Google Sheets…');
    try {
        const resp = await fetch(url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const rows = await resp.json();
        if (rows && rows.error) throw new Error(rows.error);

        const deletedKeys  = new Set((state.deletedMaterials || []).map(d => (String(d.trade||'') + '||' + String(d.name||'')).toLowerCase()));
        const confirmedKeys = new Set((state.pendingConfirms || []).map(d => (String(d.trade||'') + '||' + String(d.name||'')).toLowerCase()));
        let added = 0, updated = 0;
        (rows || []).forEach(row => {
            const name = String(row['Material'] || '').trim();
            if (!name) return;
            // Skip materials that were deleted in the app
            const dKey = (String(row['Trade']||'') + '||' + name).toLowerCase();
            if (deletedKeys.has(dKey)) return;
            let mat = state.materials.find(m => m.name.toLowerCase() === name.toLowerCase());
            if (!mat) {
                mat = {
                    id: uid(), name,
                    trade: row['Trade'] || 'Misc.',
                    unit: row['Unit'] || '',
                    startQty: parseFloat(row['On Hand']) || 0,
                    parQty: parseFloat(row['Min Stock']) || 0,
                    reorderQty: parseFloat(row['To Order']) || 0,
                    log: [],
                    brand: row['Brand/Type'] || '',
                    notes: row['Notes'] || '',
                    link: row['Link'] || '',
                    procStatus: row['Order Status'] || '',
                    deliveryEta: row['Delivery ETA'] || ''
                };
                state.materials.push(mat);
                added++;
            } else {
                mat.brand      = row['Brand/Type'] || mat.brand || '';
                mat.link       = row['Link']       || mat.link  || '';
                if (!(mat.parQty > 0)) { const _pq = parseFloat(row['Min Stock']); if (!isNaN(_pq)) mat.parQty = _pq; }
                const matKey = (String(row['Trade']||'') + '||' + name).toLowerCase();
                const _toOrder = parseFloat(row['To Order']);
                if (!isNaN(_toOrder)) mat.reorderQty = _toOrder;
                if (!confirmedKeys.has(matKey)) {
                    mat.procStatus = row['Order Status'] || mat.procStatus || '';
                    mat.deliveryEta = row['Delivery ETA'] || mat.deliveryEta || '';
                }
                mat.notes = row['Notes'] || '';
                if (row['Trade']  && !mat.trade) mat.trade = row['Trade'];
                updated++;
            }
            // Import last delivery as a delivery log entry if it's newer than the last recorded delivery
            const isoDate  = parseSheetDate(row['Last Delivery Date']);
            const sheetQty = parseFloat(row['Last Delivery Qty']);
            if (isoDate && !isNaN(sheetQty) && sheetQty > 0) {
                const alreadyHas = (mat.log || []).some(e => e.type === 'delivery' && e.date === isoDate && e.qty === sheetQty);
                if (!alreadyHas) {
                    const lastDel = (mat.log || []).filter(e => e.type === 'delivery').sort((a,b) => b.date.localeCompare(a.date))[0];
                    if (!lastDel || isoDate >= lastDel.date) {
                        if (!mat.log) mat.log = [];
                        mat.log.push({ id: uid(), date: isoDate, type: 'delivery', qty: sheetQty, by: row['Ordered By'] || '' });
                    }
                }
            }
        });

        // Ensure no undefined fields that Firebase rejects
        state.materials.forEach(m => {
            if (!m.procStatus) m.procStatus = '';
            if (!m.brand)      m.brand      = '';
            if (!m.link)       m.link       = '';
        });
        persist(); render();
        localStorage.setItem('hallway_sheets_last_sync', new Date().toISOString());
        _showSyncToast(`&#10003; Pulled: ${added} added, ${updated} updated`, toast, 3500);
        return true;
    } catch(err) {
        _showSyncToast('&#10007; Pull failed: ' + err.message, toast, 4500);
        return false;
    }
}

async function syncPush() {
    const url = localStorage.getItem('hallway_sheets_url');
    if (!url) return;
    const toast = _showSyncToast('Pushing to Google Sheets…');
    const materials = (state.materials || []).map(mat => {
        const lastDel = (mat.log || []).filter(e => e.type === 'delivery').sort((a,b) => b.date.localeCompare(a.date))[0];
        const stock = matCurrentStock(mat);
        return {
            'Trade':               mat.trade || 'Misc.',
            'Material':            mat.name,
            'Brand/Type':          mat.brand || '',
            'Unit':                mat.unit  || '',
            'On Hand':             stock !== null ? stock : '',
            'Min Stock':           mat.parQty    || '',
            'Last Delivery Date':  lastDel ? lastDel.date : '',
            'Last Delivery Qty':   lastDel ? lastDel.qty  : '',
            'Ordered By':          lastDel ? (lastDel.by || '') : '',
            'To Order':            mat.reorderQty > 0 ? mat.reorderQty : '',
            'Order Status':        mat.procStatus || '',
            'Delivery ETA':        mat.deliveryEta || '',
            'Link':                mat.link  || ''
        };
    });
    const deletions = (state.deletedMaterials || []).map(d => ({ name: d.name, trade: d.trade }));
    try {
        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ materials, deletions })
        });
        const result = await resp.json().catch(() => ({}));
        if (result.error) throw new Error(result.error);
        localStorage.setItem('hallway_sheets_last_sync', new Date().toISOString());
        state.pendingConfirms  = [];
        persist();
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    } catch(err) {
        _showSyncToast('&#10007; Push failed: ' + err.message, toast, 5000);
    }
}

function _showSyncToast(msg, existingToast, autoDismissMs) {
    let toast = existingToast;
    if (!toast) {
        toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a3a5c;color:white;padding:10px 22px;border-radius:99px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,0.22);transition:opacity .3s';
        document.body.appendChild(toast);
    }
    toast.innerHTML = msg;
    if (autoDismissMs) setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, autoDismissMs);
    return toast;
}

// ── Init ──────────────────────────────────────────────────────────────────────
const _savedCode = localStorage.getItem('hallway_sync_code');
if (_savedCode) {
    syncCode = _savedCode;
    render();          // show local data immediately while Firebase loads
    initFirebase();    // then connect — listener will re-render when data arrives
} else {
    document.getElementById('syncOverlay').classList.add('open');
}

// Auto-sync with Google Sheets every 15 minutes (only when URL is configured)
setInterval(() => {
    if (localStorage.getItem('hallway_sheets_url')) {
        syncPull().then(ok => { if (ok) syncPush(); });
    }
}, 15 * 60 * 1000);
</script>
