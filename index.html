    }

    html += `<div class="delete-zone">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-secondary btn-sm" onclick="renameItem('${floor.id}','${item.id}')">&#9998; Rename Item</button>
            <button class="btn btn-danger btn-sm" onclick="deleteItem('${floor.id}','${item.id}')">Delete This Item</button>
        </div>
    </div>`;

    return html;
}

// ── Quick log ─────────────────────────────────────────────────────────────────
function qlPreview() {
    const s  = parseFloat(document.getElementById('ql_skilled')?.value)       || 0;
    const sh = parseFloat(document.getElementById('ql_skilled_hours')?.value) || 0;
    const l  = parseFloat(document.getElementById('ql_laborer')?.value)       || 0;
    const lh = parseFloat(document.getElementById('ql_laborer_hours')?.value) || 0;
    const mh = s * sh + l * lh;
    const el = document.getElementById('ql_preview');
    if (el) el.value = mh > 0 ? String(mh) : '';
}

function quickLog(floorId, itemId) {
    const skilled       = parseFloat(document.getElementById('ql_skilled')?.value)       || 0;
    const skilledHours  = parseFloat(document.getElementById('ql_skilled_hours')?.value) || 0;
    const laborer       = parseFloat(document.getElementById('ql_laborer')?.value)       || 0;
    const laborerHours  = parseFloat(document.getElementById('ql_laborer_hours')?.value) || 0;
    const date          = document.getElementById('ql_date')?.value;
    const note          = (document.getElementById('ql_note')?.value || '').trim();
    if (skilled + laborer < 1) { alert('Enter at least one Skilled or Laborer worker.'); return; }
    if (skilled > 0 && skilledHours <= 0) { alert('Enter hours for Skilled workers.'); return; }
    if (laborer > 0 && laborerHours <= 0) { alert('Enter hours for Laborer workers.'); return; }
    if (skilledHours > 0 && skilled <= 0) { alert('Enter a Skilled worker count.'); return; }
    if (laborerHours > 0 && laborer <= 0) { alert('Enter a Laborer worker count.'); return; }
    const floor = state.floors.find(f => f.id === floorId);
    const item  = floor.items.find(i => i.id === itemId);
    const entry = { date, skilled, skilledHours, laborer, laborerHours };
    if (note) entry.note = note;
    if (_qlWorkerIds.size > 0) entry.workerIds = [..._qlWorkerIds];
    _qlWorkerIds.clear();
    item.hoursLog.push(entry);
    if ((item.status || 'pending') === 'pending') item.status = 'active';
    persist();
    render();
    if (skilledHours > 0) localStorage.setItem('hallway_last_skld_hrs', String(skilledHours));
    if (laborerHours > 0) localStorage.setItem('hallway_last_lab_hrs',  String(laborerHours));
    setTimeout(() => {
        document.getElementById('ql_skilled').value = '';
        document.getElementById('ql_skilled_hours').value = '';
        document.getElementById('ql_laborer').value = '';
        document.getElementById('ql_laborer_hours').value = '';
        const p = document.getElementById('ql_preview');
        if (p) p.value = '';
        const n = document.getElementById('ql_note');
        if (n) n.value = '';
        document.getElementById('ql_skilled_hours')?.focus();
    }, 50);
}

// ── Quick log worker chips ────────────────────────────────────────────────────
let _qlWorkerIds = new Set();

function _qlWorkerChipsHtml(date) {
    const att     = (state.attendance || []).find(a => a.date === date);
    const crew    = state.crew || [];
    const present = att
        ? (att.workerIds || []).map(id => findWorker(id)).filter(Boolean)
        : crew;
    if (present.length === 0) return '';
    const label = att ? 'Who worked this task?' : 'Who worked this task? (all crew)';
    return `<div style="margin-top:10px">
        <div style="font-size:11px;color:#888;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">${label}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${present.map(w => `<button type="button" id="qlw_${w.id}" onclick="toggleQlWorker('${w.id}')"
                style="padding:5px 12px;border-radius:99px;border:1.5px solid #d1d5db;background:white;font-size:12px;font-weight:600;cursor:pointer;color:#374151;transition:all .15s">${w.name}</button>`).join('')}
        </div>
    </div>`;
}

function toggleQlWorker(id) {
    if (_qlWorkerIds.has(id)) { _qlWorkerIds.delete(id); } else { _qlWorkerIds.add(id); }
    const btn = document.getElementById('qlw_' + id);
    if (btn) {
        const sel = _qlWorkerIds.has(id);
        btn.style.background   = sel ? '#1a3a5c' : 'white';
        btn.style.color        = sel ? 'white'   : '#374151';
        btn.style.borderColor  = sel ? '#1a3a5c' : '#d1d5db';
    }
}

function _qlRefreshWorkerChips(date) {
    const section = document.getElementById('ql_worker_section');
    if (section) section.innerHTML = _qlWorkerChipsHtml(date);

}

function setQlDate(val) {
    const input = document.getElementById('ql_date');
    if (input) input.value = val;
    const t   = today();
    const yes = yesterday();
    document.getElementById('chip_today')?.classList.toggle('active', val === t);
    document.getElementById('chip_yesterday')?.classList.toggle('active', val === yes);
    const other = document.getElementById('chip_other');

        other?.classList.add('active');
    } else {
        other?.classList.remove('active');

// ── Quick status picker — right-click or long-press on floor tile ─────────────
function quickStatusPicker(e, floorId, itemId) {
    e.preventDefault();
    e.stopPropagation();
    document.getElementById('_qsp')?.remove();

    const floor  = state.floors.find(f => f.id === floorId);
    const item   = floor?.items.find(i => i.id === itemId);
    if (!item) return;

    const current = item.status || 'pending';
    const options = [
        { label: '⬜ Not Started', value: 'pending' },
        { label: '🟡 In Progress', value: 'active'  },
        { label: '🟢 Done',        value: 'done'    },
    ];

    const menu = document.createElement('div');
    menu.id = '_qsp';
    menu.style.cssText = 'position:fixed;z-index:9999;background:white;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.22);padding:6px;min-width:190px;';

    const title = document.createElement('div');
    title.style.cssText = 'font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;padding:6px 10px 4px';
    title.textContent = item.name;
    menu.appendChild(title);

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.style.cssText = `display:block;width:100%;text-align:left;padding:9px 14px;border:none;border-radius:8px;font-size:14px;font-weight:${opt.value === current ? '700' : '500'};background:${opt.value === current ? '#f0f4ff' : 'transparent'};cursor:pointer;color:#1a1a2e`;
        btn.textContent = opt.label;
        btn.onclick = function(ev) {
            ev.stopPropagation();
            if (opt.value !== 'active') delete item.progress;
            setStatus(floorId, itemId, opt.value);
            menu.remove();
        };
        menu.appendChild(btn);
    });

    // Position near tap/click
    const x = e.clientX || (e.touches && e.touches[0]?.clientX) || window.innerWidth / 2;
    const y = e.clientY || (e.touches && e.touches[0]?.clientY) || window.innerHeight / 2;
    menu.style.left = Math.min(x, window.innerWidth  - 190) + 'px';
    menu.style.top  = Math.min(y, window.innerHeight - 160) + 'px';

    document.body.appendChild(menu);
    setTimeout(() => document.addEventListener('click', function dismiss() {
        menu.remove(); document.removeEventListener('click', dismiss);
    }), 10);
}


// Long-press support for touch devices
(function() {

let _reorderFloorsMode = false;

function moveFloor(idx, dir) {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= state.floors.length) return;
    [state.floors[idx], state.floors[newIdx]] = [state.floors[newIdx], state.floors[idx]];

}

}

function moveFloorItem(floorId, idx, dir) {
    const floor = state.floors.find(f => f.id === floorId);
    const items = floor.items;

}

function applyOrderToAllFloors(floorId) {
    const template = state.floors.find(f => f.id === floorId);
    if (!template) return;
    const others = state.floors.filter(f => f.id !== floorId);
    if (!confirm(`Sync all ${others.length} other floors to match this floor's item list and order?\n\n• Missing items will be added\n• Renamed items will be renamed everywhere\n• Items not in this template (with no logged hours) will be removed\n• Items with logged hours are never deleted`)) return;

    // Template: index → { name, lowerName }
    const templateItems = template.items.map((ti, pos) => ({ pos, name: ti.name, key: ti.name.trim().toLowerCase() }));
    const templateKeys  = new Set(templateItems.map(t => t.key));

    others.forEach(f => {
        // Each floor item gets matched to a template slot by index position
        // (items were synced before, so same-position items are the "same" item even if renamed)
        const result = [];

        templateItems.forEach(ti => {
            // 1. Exact name match — item already in sync
            const exact = f.items.find(i => i.name.trim().toLowerCase() === ti.key);
            if (exact) {
                result.push({ pos: ti.pos, item: exact });
                return;
            }
            // 2. No exact match — check if there's an item at the same position on this floor
            //    that doesn't match any template key (i.e. it was renamed on the template side)
            const samePos = f.items[ti.pos];
            if (samePos && !templateKeys.has(samePos.name.trim().toLowerCase())) {
                // Rename it in-place, preserving all logged data
                samePos.name = ti.name;
                result.push({ pos: ti.pos, item: samePos });
                return;
            }
            // 3. Genuinely missing — add a new empty item
            result.push({ pos: ti.pos, item: { id: uid(), name: ti.name, hoursLog: [], status: 'pending' } });
        });

        result.sort((a, b) => a.pos - b.pos);

        // Collect floor items that had no template match and haven't been placed yet
        const placedIds = new Set(result.map(r => r.item.id));
        const leftover  = f.items.filter(i => !placedIds.has(i.id));

        // Keep leftover items only if they have logged hours
        const keepLeftover = leftover.filter(i => (i.hoursLog || []).length > 0);

        f.items = [...result.map(r => r.item), ...keepLeftover];
    });

    persist();
    alert(`Done! All ${others.length} floor${others.length !== 1 ? 's' : ''} synced to this template.`);
    document.getElementById('app').innerHTML = renderFloor(template);
}

function _openLogTodayModal(floors) {
    const t   = today();
    const yes = yesterday();

    const calIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
    let rows = floors.map((floor, fi) => {
        const itemRows = floor.items.map((item, idx) => `
            <div class="daily-row">
                <div class="daily-row-label">${item.name}</div>
                <div class="form-row">
                    <div class="form-group" style="margin-bottom:0">
                        <label>Skilled</label>
                        <input type="number" min="0" id="lt_s_${fi}_${idx}" placeholder="—" />
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label>Skld Hrs</label>
                        <input type="number" min="0.5" step="0.5" id="lt_sh_${fi}_${idx}" placeholder="—" />
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label>Laborer</label>
                        <input type="number" min="0" id="lt_l_${fi}_${idx}" placeholder="—" />
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label>Lab Hrs</label>
                        <input type="number" min="0.5" step="0.5" id="lt_lh_${fi}_${idx}" placeholder="—" />
                    </div>
                </div>
            </div>`).join('');
        return `<div class="daily-floor-header">${floor.name}</div>${itemRows}`;
    }).join('');

    openModal("Log Today's Hours", `
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
            <button class="date-chip active" id="lt_chip_today"     onclick="setLtDate('${t}')">Today</button>
            <button class="date-chip"        id="lt_chip_yesterday" onclick="setLtDate('${yes}')">Yesterday</button>
            <button class="cal-btn"          id="lt_chip_other"     onclick="toggleLtPicker()">${calIcon}</button>
        </div>
        <div class="date-picker-wrap" id="lt_picker_wrap">
            <input type="date" id="lt_date_picker" onchange="setLtDateFromPicker(this.value)" style="margin-bottom:10px" />
        </div>
        <input type="hidden" id="lt_date" value="${t}" />
        <p style="font-size:13px;color:#999;margin-bottom:6px">Leave blank for items not worked today.</p>
        ${rows}
    `, () => {
        const date = document.getElementById('lt_date').value;
        let saved  = 0;
        floors.forEach((floor, fi) => {
            floor.items.forEach((item, idx) => {
                const skilled      = parseFloat(document.getElementById(`lt_s_${fi}_${idx}`)?.value)  || 0;
                const skilledHours = parseFloat(document.getElementById(`lt_sh_${fi}_${idx}`)?.value) || 0;
                const laborer      = parseFloat(document.getElementById(`lt_l_${fi}_${idx}`)?.value)  || 0;
                const laborerHours = parseFloat(document.getElementById(`lt_lh_${fi}_${idx}`)?.value) || 0;
                const mh = skilled * skilledHours + laborer * laborerHours;
                if (skilledHours > 0 && skilled <= 0) { alert(`${item.name}: enter a Skilled worker count.`); return; }
                if (laborerHours > 0 && laborer <= 0) { alert(`${item.name}: enter a Laborer worker count.`); return; }
                if (skilled > 0 && skilledHours <= 0) { alert(`${item.name}: enter hours for Skilled workers.`); return; }
                if (laborer > 0 && laborerHours <= 0) { alert(`${item.name}: enter hours for Laborer workers.`); return; }
                if (mh > 0) {
                    item.hoursLog.push({ date, skilled, skilledHours, laborer, laborerHours });
                    if ((item.status || 'pending') === 'pending') item.status = 'active';
                    saved++;
                }
            });
        });
        if (saved === 0) { alert('Fill in at least one item.'); return; }
        persist(); closeModal(); render();
    });
}

function setLtDate(val) {
    const input = document.getElementById('lt_date');
    if (input) input.value = val;
    const t   = today();
    const yes = yesterday();
    document.getElementById('lt_chip_today')?.classList.toggle('active', val === t);
    document.getElementById('lt_chip_yesterday')?.classList.toggle('active', val === yes);
    const other = document.getElementById('lt_chip_other');
    if (val !== t && val !== yes) {
        other?.classList.add('active');
    } else {
        other?.classList.remove('active');
        document.getElementById('lt_picker_wrap')?.classList.remove('open');
    }
}

function toggleLtPicker() {
    const wrap = document.getElementById('lt_picker_wrap');
    if (wrap) wrap.classList.toggle('open');
}

function setLtDateFromPicker(val) {
    if (val) { setLtDate(val); document.getElementById('lt_picker_wrap')?.classList.remove('open'); }
}

function editMatDay(matId, date) {
    const mat       = state.materials.find(m => m.id === matId);
    const delivQty  = (mat.log||[]).filter(e => e.type === 'delivery' && e.date === date).reduce((s,e) => s+e.qty, 0);
    const usageQty  = (mat.log||[]).filter(e => e.type === 'usage'    && e.date === date).reduce((s,e) => s+e.qty, 0);
    const usageEntry = (mat.log||[]).find(e => e.type === 'usage' && e.date === date);
    const floorId   = usageEntry?.floorId || '';
    const itemId    = usageEntry?.itemId  || '';
    const selFloor  = (state.floors||[]).find(f => f.id === floorId);
    const floorOpts = `<option value="">General / All Floors</option>` +
        (state.floors||[]).map(f => `<option value="${f.id}"${f.id === floorId ? ' selected' : ''}>${f.name}</option>`).join('');
    const itemOpts  = selFloor
        ? `<option value="">No specific item</option>` + (selFloor.items||[]).map(i => `<option value="${i.id}"${i.id === itemId ? ' selected' : ''}>${i.name}</option>`).join('')
        : `<option value="">— select floor first —</option>`;
    openModal(`Edit ${displayDate(date)} — ${mat.name}`, `
        <div class="form-group">
            <label>Delivery (${mat.unit})</label>
            <input id="edit_deliv" type="number" min="0" step="1" value="${delivQty || ''}" placeholder="0" />
        </div>
        <div class="form-group">
            <label>Used (${mat.unit})</label>
            <input id="edit_usage" type="number" min="0" step="1" value="${usageQty || ''}" placeholder="0" />
        </div>
        <div class="form-group">
            <label>Floor</label>
            <select id="edit_floor" onchange="updateEditItemSel()">${floorOpts}</select>
        </div>
        <div class="form-group">
            <label>Work Item <span style="font-weight:400;color:#aaa">(optional)</span></label>
            <select id="edit_item">${itemOpts}</select>
        </div>
        <p style="font-size:12px;color:#999;margin-top:4px">Existing entries for this date will be replaced.</p>
    `, () => {
        const newDeliv = parseFloat(document.getElementById('edit_deliv').value);
        const newUsage = parseFloat(document.getElementById('edit_usage').value);
        const newFloor = document.getElementById('edit_floor').value || undefined;
        const newItem  = document.getElementById('edit_item').value  || undefined;
        mat.log = (mat.log||[]).filter(e => e.date !== date);
        if (!isNaN(newDeliv) && newDeliv > 0) mat.log.push({ id: uid(), date, type: 'delivery', qty: newDeliv });
        if (!isNaN(newUsage) && newUsage > 0) {
            const entry = { id: uid(), date, type: 'usage', qty: newUsage };
            if (newFloor) entry.floorId = newFloor;
            if (newItem)  entry.itemId  = newItem;
            mat.log.push(entry);
        }
        persist(); closeModal(); render();
    });
}

function updateEditItemSel() {
    const floorId = document.getElementById('edit_floor')?.value;

function _buildMatLogModal(title, matId) {
    const mats = Array.isArray(matId)
        ? state.materials.filter(m => matId.includes(m.id))
        : matId
            ? state.materials.filter(m => m.id === matId)
            : state.materials;
    const t = today(), yes = yesterday();
    const rows = mats.map((mat, i) => `
        <div class="daily-row">
            <div class="daily-row-label">${mat.name} <span style="color:#aaa;font-size:12px">(${mat.unit})</span></div>
            <div class="form-group" style="margin-bottom:0">
                <input type="number" min="0" step="1" id="mat_qty_${i}" placeholder="qty" style="width:100%" />
            </div>
        </div>`).join('');
    openModal(title, `
        <div style="display:flex;gap:8px;margin-bottom:12px">
            <button class="date-chip active" id="mchip_today" onclick="setMatDate('${t}')">Today</button>
            <button class="date-chip" id="mchip_yesterday" onclick="setMatDate('${yes}')">Yesterday</button>
        </div>
        <input type="hidden" id="mat_date" value="${t}" />
        <p style="font-size:13px;color:#999;margin-bottom:10px">Leave blank for materials not affected.</p>
        ${rows}
    `, () => {
        const date = document.getElementById('mat_date').value;
        let saved = 0;
        mats.forEach((mat, i) => {
            const val = parseFloat(document.getElementById(`mat_qty_${i}`)?.value);
            if (!isNaN(val) && val > 0) {
                if (!mat.log) mat.log = [];
                mat.log.push({ id: uid(), date, type: 'delivery', qty: val });
                saved++;
            }
        });
        if (saved === 0) { alert('Enter at least one quantity.'); return; }
        persist(); closeModal(); render();
    });
}

    `, () => {

        if (isNaN(val) || val < 0) { alert('Enter a valid count.'); return; }

function printOnHand() {
    const mats = state.materials || [];
    if (mats.length === 0) { alert('No materials to print.'); return; }
    const byTrade = {};
    mats.forEach(mat => {
        const t = mat.trade || 'Other';
        if (!byTrade[t]) byTrade[t] = [];
        byTrade[t].push(mat);
    });
    const tradeKeys = TRADE_ORDER.filter(t => byTrade[t]);
    Object.keys(byTrade).forEach(t => { if (!TRADE_ORDER.includes(t)) tradeKeys.push(t); });
    let body = `<h2 style="margin-bottom:4px">On Hand Inventory</h2>
        <div style="font-size:12px;color:#666;margin-bottom:20px">As of ${new Date().toLocaleDateString('en-US', {month:'long',day:'numeric',year:'numeric'})}</div>`;
    tradeKeys.forEach(trade => {
        body += `<h3 style="margin:16px 0 6px;border-bottom:1px solid #ddd;padding-bottom:4px">${trade}</h3>
            <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="background:#f3f4f6">
                <th style="text-align:left;padding:5px 8px;border:1px solid #e5e7eb">Material</th>
                <th style="text-align:right;padding:5px 8px;border:1px solid #e5e7eb">On Hand</th>
                <th style="text-align:left;padding:5px 8px;border:1px solid #e5e7eb">Unit</th>
                <th style="text-align:right;padding:5px 8px;border:1px solid #e5e7eb">Min Stock</th>
            </tr></thead><tbody>`;
        byTrade[trade].forEach(mat => {
            const stock = matCurrentStock(mat);
            const low   = stock !== null && mat.parQty > 0 && stock < mat.parQty;
            body += `<tr style="${low ? 'background:#fff5f5;color:#dc2626' : ''}">
                <td style="padding:5px 8px;border:1px solid #e5e7eb">${mat.name}</td>
                <td style="text-align:right;padding:5px 8px;border:1px solid #e5e7eb;font-weight:700">${stock !== null ? stock : '—'}</td>
                <td style="padding:5px 8px;border:1px solid #e5e7eb;color:#888">${mat.unit || ''}</td>
                <td style="text-align:right;padding:5px 8px;border:1px solid #e5e7eb;color:#888">${mat.parQty > 0 ? mat.parQty : '—'}</td>
            </tr>`;
        });
        body += `</tbody></table>`;
    });
    const win = window.open('', '_blank');
    win.document.write(`<!DOCTYPE html><html><head><title>On Hand Inventory</title>
        <style>body{font-family:sans-serif;padding:24px;max-width:800px;margin:0 auto}@media print{body{padding:0}}</style>
        </head><body>${body}</body></html>`);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 300);
}

function setMatSearch(q) {
    _matSearch = q;
    applyMatFilter();
}

function applyMatFilter() {
    const q = _matSearch.trim().toLowerCase();
    // Update clear button visibility
    const clearBtn = document.querySelector('.mat-search-clear');
    if (clearBtn) clearBtn.style.display = q ? '' : 'none';

    const tradeGrid     = document.getElementById('mat_trade_grid');
    const searchResults = document.getElementById('mat_search_results');
    const cardList      = document.getElementById('mat_card_list');

    if (tradeGrid) {
        // Main view: toggle trade grid vs flat search results
        if (q) {
            tradeGrid.style.display = 'none';
            searchResults.style.display = '';
            const cards = searchResults.querySelectorAll('.mat-card[data-mat-name]');
            let visible = 0;
            cards.forEach(c => {
                const show = c.dataset.matName.includes(q);
                c.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            const noRes = document.getElementById('mat_no_results');
            if (noRes) noRes.style.display = visible === 0 ? '' : 'none';
        } else {
            tradeGrid.style.display = '';
            searchResults.style.display = 'none';
        }
    } else if (cardList) {
        // Trade drill-down: filter visible cards
        cardList.querySelectorAll('.mat-card[data-mat-name]').forEach(c => {
            c.style.display = !q || c.dataset.matName.includes(q) ? '' : 'none';
        });
    }
}

function editHoursEntry(floorId, itemId, idx) {
    const floor = state.floors.find(f => f.id === floorId);
    const item  = floor.items.find(i => i.id === itemId);
    const entry = item.hoursLog[idx];
    const d     = entryDisplay(entry);
    const crew  = state.crew || [];

    // Pre-select workers already on this entry
    let eeWorkerIds = new Set(entry.workerIds || []);

    // Build attendance-aware crew list for the entry's date
    const att     = (state.attendance || []).find(a => a.date === entry.date);
    const present = att ? (att.workerIds || []).map(id => findWorker(id)).filter(Boolean) : crew;

    const workerChipsHtml = present.length === 0 ? '' : `
        <div class="form-group" style="margin-top:4px">
            <label>Who worked this task?</label>
            <div id="ee_worker_chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
                ${present.map(w => {
                    const sel = eeWorkerIds.has(w.id);
                    return `<button type="button" id="eew_${w.id}" onclick="toggleEeWorker('${w.id}')"
                        style="padding:5px 12px;border-radius:99px;border:1.5px solid ${sel ? '#1a3a5c' : '#d1d5db'};background:${sel ? '#1a3a5c' : 'white'};font-size:12px;font-weight:600;cursor:pointer;color:${sel ? 'white' : '#374151'};transition:all .15s">${w.name}</button>`;
                }).join('')}
            </div>
        </div>`;

    openModal('Edit Log Entry', `
        <div class="form-group"><label>Date</label><input type="date" id="ee_date" value="${entry.date}" /></div>
        <div class="form-row">
            <div class="form-group"><label>Skilled</label><input type="number" id="ee_s" min="0" value="${d.skilled}" /></div>
            <div class="form-group"><label>Skilled Hrs</label><input type="number" id="ee_sh" min="0" step="0.5" value="${d.skilledHours}" /></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Laborer</label><input type="number" id="ee_l" min="0" value="${d.laborer}" /></div>
            <div class="form-group"><label>Laborer Hrs</label><input type="number" id="ee_lh" min="0" step="0.5" value="${d.laborerHours || 0}" /></div>
        </div>
        ${workerChipsHtml}
    `, () => {
        const skilled      = parseFloat(document.getElementById('ee_s').value)  || 0;
        const skilledHours = parseFloat(document.getElementById('ee_sh').value) || 0;
        const laborer      = parseFloat(document.getElementById('ee_l').value)  || 0;
        const laborerHours = parseFloat(document.getElementById('ee_lh').value) || 0;
        const date         = document.getElementById('ee_date').value;
        if (skilled + laborer < 1) { alert('Enter at least one worker.'); return; }
        if (skilled > 0 && skilledHours <= 0) { alert('Enter hours for Skilled workers.'); return; }
        if (laborer > 0 && laborerHours <= 0) { alert('Enter hours for Laborer workers.'); return; }
        const updated = { date, skilled, skilledHours, laborer, laborerHours };
        if (eeWorkerIds.size > 0) updated.workerIds = [...eeWorkerIds];
        if (entry.note) updated.note = entry.note;
        item.hoursLog[idx] = updated;
        persist(); closeModal(); render();
    });

    // Expose toggle fn into global scope for the modal buttons
    window.toggleEeWorker = function(id) {
        if (eeWorkerIds.has(id)) { eeWorkerIds.delete(id); } else { eeWorkerIds.add(id); }
        const btn = document.getElementById('eew_' + id);
        if (btn) {
            const sel = eeWorkerIds.has(id);
            btn.style.background  = sel ? '#1a3a5c' : 'white';
            btn.style.color       = sel ? 'white'   : '#374151';
            btn.style.borderColor = sel ? '#1a3a5c' : '#d1d5db';
        }
    };
}

// ── Backup / Restore ──────────────────────────────────────────────────────────
function backupData() {
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `hallway_backup_${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem('hallway_last_backup', today());
    render();
}

function restoreData(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.floors) throw new Error('Invalid file');
            if (!confirm(`This will replace all current data with the backup. Continue?`)) return;
            state = data;
            if (!state.materials) state.materials = [];
            (state.floors || []).forEach(f => { (f.items || []).forEach(i => { if (!i.hoursLog) i.hoursLog = []; }); });
            persist();
            render();
            alert('Data restored successfully.');
        } catch {
            alert('Invalid backup file. Please select a valid .json backup.');
        }
        input.value = '';
    };
    reader.readAsText(file);
}

// ── Export ────────────────────────────────────────────────────────────────────
function toCSV(rows) {
    return rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
}

function downloadCSV(csv, filename) {
    const blob = new Blob([csv], { type: 'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
}

function openExportModal(defaultFormat) {
    const floorOptions = state.floors.map(f =>
        `<option value="${f.id}"${view.floorId === f.id ? ' selected' : ''}>${f.name}</option>`
    ).join('');
    const defaultAll = !view.floorId ? ' selected' : '';
    defaultFormat = defaultFormat || 'pdf';

    openModal('Export Labor Report', `
        <div class="form-group">
            <label>Floor</label>
            <select id="exp_floor">
                <option value="all"${defaultAll}>All Floors</option>
                ${floorOptions}
            </select>
        </div>
        <div class="form-group">
            <label>Format</label>
            <select id="exp_format">
                <option value="pdf"${defaultFormat==='pdf'?' selected':''}>PDF (Print / Save)</option>
                <option value="csv"${defaultFormat==='csv'?' selected':''}>CSV (Spreadsheet)</option>
                <option value="summary"${defaultFormat==='summary'?' selected':''}>Floor Comparison (PDF)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Report Period</label>
            <select id="exp_period" onchange="updateExportFields()">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
        </div>
        <div id="exp_fields">
            <div class="form-group"><label>Date</label><input id="exp_date" type="date" value="${today()}" /></div>
        </div>
    `, () => {
        const period = document.getElementById('exp_period').value;
        let start, end, label;

        if (period === 'daily') {
            const d = document.getElementById('exp_date').value;
            start = d; end = d; label = d;
        } else if (period === 'weekly') {
            const d   = new Date(document.getElementById('exp_week').value + 'T00:00:00');
            const day = d.getDay();
            const sun = new Date(d); sun.setDate(d.getDate() - day);
            const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
            start = sun.toISOString().slice(0, 10);
            end   = sat.toISOString().slice(0, 10);
            label = `week_${start}`;
        } else {
            const val = document.getElementById('exp_month').value;
            start = `${val}-01`;
            const last = new Date(val.split('-')[0], val.split('-')[1], 0);
            end   = last.toISOString().slice(0, 10);
            label = val;
        }

        const format   = document.getElementById('exp_format').value;
        const floorSel = document.getElementById('exp_floor').value;
        const floors   = floorSel === 'all' ? state.floors
                                             : state.floors.filter(f => f.id === floorSel);
        const inRange  = d => d >= start && d <= end;

        if (format === 'summary') {
            let periodLabel;
            if (period === 'weekly') periodLabel = `Week of ${shortDate(start)} - ${shortDate(end)}`;
            else if (period === 'monthly') { const [y,m]=start.split('-'); const mo=['January','February','March','April','May','June','July','August','September','October','November','December']; periodLabel=`${mo[parseInt(m)-1]} ${y}`; }
            else periodLabel = shortDate(start);
            exportCrossFloorSummary(state.floors, inRange, periodLabel);
        } else if (format === 'pdf') {
            exportPDF(floors, inRange, label, start, end, period);
        } else {
            const prefix = floorSel === 'all' ? 'all-floors' : floors[0].name.replace(/\s+/g, '-');
            const rows   = [['FLOOR', 'ITEM', 'DATE', 'SKILLED', 'SKILLED HRS', 'LABORER', 'LABORER HRS', 'MAN-HOURS']];
            floors.forEach(floor => {
                floor.items.forEach(item => {
                    const entries = item.hoursLog.filter(h => inRange(h.date));
                    if (entries.length === 0) return;
                    entries.forEach(h => {
                        const d = entryDisplay(h);
                        rows.push([floor.name, item.name, displayDate(h.date),
                            d.skilled, d.skilledHours, d.laborer, d.laborerHours, entryManHours(h)]);
                    });
                    const total  = entries.reduce((s, h) => s + entryManHours(h), 0);
                    const sk = entries.reduce((s, h) => s + entrySkilledMH(h), 0);
                    const lb = entries.reduce((s, h) => s + entryLaborerMH(h), 0);
                    rows.push([floor.name, item.name.toUpperCase() + ' — TOTAL', '', '', sk, '', lb, total]);
                    rows.push(['', '', '', '', '', '', '', '']);
                });
            });
            downloadCSV(toCSV(rows), `${prefix}-labor-${label}.csv`);
        }
        closeModal();
    });
}

function shortDate(iso) {
    const [y, m, d] = iso.split('-');
    return `${m}/${d}/${y.slice(2)}`;
}

function exportPDF(floors, inRange, label, start, end, period) {
    let periodLabel;
    if (period === 'weekly') {
        periodLabel = `Week of ${shortDate(start)} - ${shortDate(end)}`;
    } else if (period === 'monthly') {
        const [y, m] = start.split('-');
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        periodLabel = `${months[parseInt(m)-1]} ${y}`;
    } else {
        periodLabel = shortDate(start);
    }

    const isMulti    = floors.length > 1;
    const reportTitle = isMulti ? 'All Floors Labor Report' : `${floors[0].name} Labor Report`;
    let   bodyHtml   = '';
    let   overallTotal = 0, overallSk = 0, overallLb = 0;

    floors.forEach((floor, fi) => {
        let tableRows = '';
        let floorTotal = 0, floorSk = 0, floorLb = 0;

        floor.items.forEach(item => {
            const entries = item.hoursLog.filter(h => inRange(h.date));
            if (entries.length === 0) return;

            entries.forEach((h, hi) => {
                const d  = entryDisplay(h);
                const mh = entryManHours(h);
                const firstRow = hi === 0 ? ' class="item-first-row"' : '';
                tableRows += `<tr${firstRow}>
                    <td>${item.name}</td>
                    <td>${displayDate(h.date)}</td>
                    <td>${d.skilled}</td>
                    <td>${d.skilledHours}</td>
                    <td>${d.laborer}</td>
                    <td>${d.laborerHours || '—'}</td>
                    <td>${mh}</td>
                    <td style="color:#666;font-size:10px">${h.note || ''}</td>
                </tr>`;
            });

            const total = entries.reduce((s, h) => s + entryManHours(h), 0);
            const sk    = entries.reduce((s, h) => s + entrySkilledMH(h), 0);
            const lb    = entries.reduce((s, h) => s + entryLaborerMH(h), 0);
            floorTotal += total; floorSk += sk; floorLb += lb;
            tableRows += `<tr class="total-row">
                <td colspan="2">${item.name.toUpperCase()} — TOTAL</td>
                <td>—</td>
                <td>${sk}</td>
                <td>—</td>
                <td>${lb}</td>
                <td>${total}</td>
                <td></td>
            </tr>`;
        });

        if (!tableRows) return;
        overallTotal += floorTotal; overallSk += floorSk; overallLb += floorLb;

        bodyHtml += `
        <div class="floor-section" style="${fi > 0 ? 'margin-top:28px;' : ''}">
            ${isMulti ? `<div class="floor-heading">${floor.name}</div>` : ''}
            <table>
                <thead><tr>
                    <th>Item</th><th>Date</th><th>Skilled</th><th>Skld Hrs</th><th>Laborer</th><th>Lab Hrs</th><th>Man-Hours</th><th>Note</th>
                </tr></thead>
                <tbody>${tableRows}</tbody>
            </table>
            <div class="floor-total">FLOOR TOTAL: ${floorTotal} MAN-HOURS &nbsp;·&nbsp; Skilled: ${floorSk} &nbsp;·&nbsp; Laborer: ${floorLb}</div>
        </div>`;
    });

    if (!bodyHtml) {
        alert('No hours logged for this period.');
        return;
    }

let _rcPages   = [];
let _rcThumbs  = []; // tiny 200px thumbnails — safe to persist in state
let _rcPending = {}; // receiptId → full-size pages array (in memory only, never persisted)

function rcFileSelected(input) {
    if (!input.files || !input.files[0]) return;
    const file   = input.files[0];
    const img    = new Image();
    const reader = new FileReader();
    reader.onload = e => {
        img.onload = () => {
            // Full-size for upload (memory only)
            const MAX = 1400;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) {
                if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
                else       { w = Math.round(w * MAX / h); h = MAX; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            _rcPages.push(canvas.toDataURL('image/jpeg', 0.82));

            // Tiny thumbnail for persistent display (~3–5 KB each)
            const TH = 200;
            let tw = img.width, th = img.height;
            if (tw > th) { th = Math.round(th * TH / tw); tw = TH; }
            else         { tw = Math.round(tw * TH / th); th = TH; }
            const tCanvas = document.createElement('canvas');
            tCanvas.width = tw; tCanvas.height = th;
            tCanvas.getContext('2d').drawImage(img, 0, 0, tw, th);
            _rcThumbs.push(tCanvas.toDataURL('image/jpeg', 0.45));

            // Re-render thumbnails using full-size for preview quality
            const thumbs = document.getElementById('rc_thumbs');
            if (thumbs) {
                thumbs.innerHTML = _rcPages.map((src, i) => `
                    <div style="position:relative">
                        <img src="${src}" style="width:72px;height:72px;object-fit:cover;border-radius:8px" />
                        <button onclick="_rcPages.splice(${i},1);_rcThumbs.splice(${i},1);document.getElementById('rc_file').value='';rcRefreshThumbs()" style="position:absolute;top:-6px;right:-6px;background:#dc2626;border:none;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1">✕</button>
                    </div>`).join('');
            }
            document.getElementById('rc_preview').style.display = 'block';
            input.value = '';
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function rcRefreshThumbs() {
    const thumbs = document.getElementById('rc_thumbs');
    if (!thumbs) return;
    if (_rcPages.length === 0) {
        document.getElementById('rc_preview').style.display = 'none';
        return;
    }
    thumbs.innerHTML = _rcPages.map((src, i) => `
        <div style="position:relative">
            <img src="${src}" style="width:72px;height:72px;object-fit:cover;border-radius:8px" />
            <button onclick="_rcPages.splice(${i},1);_rcThumbs.splice(${i},1);rcRefreshThumbs()" style="position:absolute;top:-6px;right:-6px;background:#dc2626;border:none;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1">✕</button>
        </div>`).join('');
}

function saveReceipt() {
    if (_rcPages.length === 0) return;
    const category = document.getElementById('rc_category')?.value || 'Receipt';
    const vendor   = (document.getElementById('rc_vendor')?.value || '').trim();
    const amount   = parseFloat(document.getElementById('rc_amount')?.value) || null;
    const id       = uid();

    // Full-size pages: memory only, for upload
    _rcPending[id] = [..._rcPages];

    const receipt = {
        id,
        date:     today(),
        category,
        vendor:   vendor || null,
        amount,
        thumbs:   [..._rcThumbs], // tiny ~3-5KB each — safe for localStorage
        driveUrl: null,
    };
    if (!state.receipts) state.receipts = [];
    state.receipts.push(receipt);
    persist();
    _rcPages  = [];
    _rcThumbs = [];
    document.getElementById('app').innerHTML = renderReceipts();

    // Upload all pages to Google Drive in the background
    const gasUrl = localStorage.getItem('hallway_sheets_url');
    if (gasUrl) uploadReceiptToDrive(id, _rcPending[id], category, vendor || null, amount);
}

function uploadReceiptToDrive(receiptId, pages, category, vendor, amount) {
    const gasUrl   = localStorage.getItem('hallway_sheets_url');
    if (!gasUrl) return;
    const pagesArr    = Array.isArray(pages) ? pages : [pages];
    const amountStr   = amount ? '_$' + Number(amount).toFixed(2) : '';
    const base        = `${(category||'Receipt').replace(/\s+/g,'-')}_${today()}${vendor ? '_' + vendor.replace(/\s+/g,'-') : ''}${amountStr}`;
    const filename    = pagesArr.length > 1 ? `${base}_p1.jpg` : `${base}.jpg`;
    const extraPages  = pagesArr.slice(1).map((d, i) => ({ data: d, filename: `${base}_p${i+2}.jpg` }));
    const ctrl        = new AbortController();
    const timer       = setTimeout(() => ctrl.abort(), 60000);

    fetch(gasUrl, {
        method:  'POST',
        signal:  ctrl.signal,
        body:    JSON.stringify({ type: 'receipt', data: pagesArr[0], filename, category, vendor, amount, extraPages }),
    })
    .then(r => r.json())
    .then(res => {
        clearTimeout(timer);
        const idx = (state.receipts||[]).findIndex(r => r.id === receiptId);
        if (idx < 0) return;
        if (res.url) {
            state.receipts[idx].driveUrl  = res.url;
            state.receipts[idx].driveErr  = null;
            // Auto-fill fields Claude extracted from the image
            if (res.vendor   && !state.receipts[idx].vendor)   state.receipts[idx].vendor   = res.vendor;
            if (res.amount   && !state.receipts[idx].amount)   state.receipts[idx].amount   = res.amount;
            if (res.category && !state.receipts[idx].category) state.receipts[idx].category = res.category;
            if (res.date)                                       state.receipts[idx].date     = res.date;
            // Photos are safely on Drive — free memory
            delete _rcPending[receiptId];
        } else {
            state.receipts[idx].driveErr = res.error || 'Upload failed';
        }
        persist();
        if (view.screen === 'receipts') _rcRenderCards();
    })
    .catch(err => {
        clearTimeout(timer);
        const idx = (state.receipts||[]).findIndex(r => r.id === receiptId);
        if (idx >= 0) {
            state.receipts[idx].driveErr = err.name === 'AbortError' ? 'Timed out' : (err.message || 'Network error');
            persist();
            if (view.screen === 'receipts') _rcRenderCards();
        }
    });
}


function retryReceiptUpload(id) {
    const r = (state.receipts||[]).find(r => r.id === id);
    if (!r) return;
    if (!_rcPending[id] || _rcPending[id].length === 0) {
        alert('Photos are no longer in memory. Please delete this receipt and re-upload the photo.');
        return;
    }
    const idx = state.receipts.findIndex(r => r.id === id);
    state.receipts[idx].driveErr = null;
    persist();
    _rcRenderCards();
    uploadReceiptToDrive(id, _rcPending[id], r.category, r.vendor, r.amount);
}

function viewReceiptPage(id, pageIndex) {
    const r = (state.receipts||[]).find(r => r.id === id);
    if (!r) return;
    const pages = _rcPending[id] && _rcPending[id].length > 0 ? _rcPending[id] : (r.thumbs || []);
    if (pages.length === 0) return;
    let current = pageIndex || 0;

    function buildOverlay() {
        const existing = document.getElementById('rc_overlay');
        if (existing) existing.remove();

        const overlay = document.createElement('div');
        overlay.id = 'rc_overlay';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column';

        const navHtml = pages.length > 1 ? `
            <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
                <button onclick="(function(){window._rcOvCurrent=Math.max(0,window._rcOvCurrent-1);document.getElementById('rc_overlay').remove();window._rcOvBuild();})()" style="background:rgba(255,255,255,0.2);border:none;color:white;font-size:20px;padding:8px 18px;border-radius:99px;cursor:pointer">‹</button>
                <span style="color:white;font-size:14px">${current + 1} / ${pages.length}</span>
                <button onclick="(function(){window._rcOvCurrent=Math.min(${pages.length-1},window._rcOvCurrent+1);document.getElementById('rc_overlay').remove();window._rcOvBuild();})()" style="background:rgba(255,255,255,0.2);border:none;color:white;font-size:20px;padding:8px 18px;border-radius:99px;cursor:pointer">›</button>
            </div>` : '';

        overlay.innerHTML = `
            ${navHtml}
            <img src="${pages[current]}" style="max-width:100%;max-height:75vh;object-fit:contain;border-radius:8px" />
            <button onclick="document.getElementById('rc_overlay').remove()" style="margin-top:24px;background:rgba(255,255,255,0.2);border:none;color:white;font-size:16px;font-weight:700;padding:14px 48px;border-radius:99px;cursor:pointer;letter-spacing:1px">CLOSE</button>`;
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
        document.body.appendChild(overlay);
    }

    window._rcOvCurrent = current;
    window._rcOvBuild = buildOverlay;
    buildOverlay();
}

function deleteReceipt(id) {
    if (!confirm('Delete this receipt?')) return;
    state.receipts = (state.receipts||[]).filter(r => r.id !== id);
    persist();
    _rcRenderCards();
}

// ── Weekly summary export ─────────────────────────────────────────────────────
function exportWeeklySummary(offsetWeeks) {
    if (offsetWeeks === undefined) {
        // Show week picker modal first
        openModal('Weekly Summary', `
            <div class="form-group">
                <label>Select week</label>
                <select id="ws_offset" style="width:100%;padding:10px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px">
                    ${[-0,-1,-2,-3,-4,-5,-6,-7,-8].map(o => {
                        const { start, end } = getWeekRange(o);
                        const label = o === 0 ? `This week (${displayDate(start)} – ${displayDate(end)})` : `${displayDate(start)} – ${displayDate(end)}`;
                        return `<option value="${o}">${label}</option>`;
                    }).join('')}
                </select>
            </div>
        `, () => {
            const offset = parseInt(document.getElementById('ws_offset').value);
            closeModal();
            exportWeeklySummary(offset);
        });
        return;
    }
    const { start, end } = getWeekRange(offsetWeeks);
    const inRange = d => d >= start && d <= end;
    const label   = `${displayDate(start)} – ${displayDate(end)}`;

    // ── Labor: man-hours per floor for entries in this week ──────────────────
    let laborHtml = '';
    let grandSkilled = 0, grandLaborer = 0;
    (state.floors || []).forEach(floor => {
        let fSkilled = 0, fLaborer = 0;
        (floor.items || []).forEach(item => {
            (item.hoursLog || []).filter(e => e.date >= start && e.date <= end).forEach(e => {
                fSkilled += entrySkilledMH(e);
                fLaborer += entryLaborerMH(e);
            });
        });
        if (fSkilled + fLaborer === 0) return;
        grandSkilled += fSkilled; grandLaborer += fLaborer;
        laborHtml += `<tr>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;font-weight:600;white-space:nowrap">${floor.name}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:right">${fSkilled}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:right">${fLaborer}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:right;font-weight:700;color:#1a3a5c">${fSkilled + fLaborer}</td>
        </tr>`;
    });
    if (!laborHtml) laborHtml = `<tr><td colspan="4" style="padding:12px 10px;color:#aaa;font-style:italic">No hours logged this week.</td></tr>`;
    const laborSection = `
        <div style="page-break-inside:avoid">
        <h2 style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:#1a3a5c;margin:24px 0 10px;border-top:2px solid #1a3a5c;padding-top:10px">Labor — Man-Hours by Floor</h2>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="background:#1a3a5c;color:white">
                <th style="padding:8px 10px;text-align:left">Floor</th>
                <th style="padding:8px 10px;text-align:right">Skilled MH</th>
                <th style="padding:8px 10px;text-align:right">Laborer MH</th>
                <th style="padding:8px 10px;text-align:right">Total MH</th>
            </tr></thead>
            <tbody>${laborHtml}
                <tr style="background:#f0f4ff">
                    <td style="padding:8px 10px;font-weight:800">Total</td>
                    <td style="padding:8px 10px;text-align:right;font-weight:700">${grandSkilled}</td>
                    <td style="padding:8px 10px;text-align:right;font-weight:700">${grandLaborer}</td>
                    <td style="padding:8px 10px;text-align:right;font-weight:800;color:#1a3a5c">${grandSkilled + grandLaborer}</td>
                </tr>
            </tbody>
        </table></div>`;

    // ── Worker hours this week ───────────────────────────────────────────────
    const crew = state.crew || [];
    const workerHoursMap = {};
    (state.attendance || []).filter(a => inRange(a.date)).forEach(a => {
        Object.entries(a.details || {}).forEach(([wid, detail]) => {
            if (!detail.hours) return;
            if (!workerHoursMap[wid]) workerHoursMap[wid] = 0;
            workerHoursMap[wid] += detail.hours;
        });
    });
    let workerHtml = '';
    const sortedWorkers = crew.filter(w => workerHoursMap[w.id]).sort((a,b) => crewSortOrder(a.trade) - crewSortOrder(b.trade));
    sortedWorkers.forEach(w => {
        workerHtml += `<tr>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;font-weight:600">${w.name}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;color:#888">${w.trade || '—'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:right;font-weight:700;color:#1a3a5c">${workerHoursMap[w.id]}</td>
        </tr>`;
    });
    const totalWorkerHours = Object.values(workerHoursMap).reduce((s,h)=>s+h,0);
    if (sortedWorkers.length > 0) {
        workerHtml += `<tr style="background:#f0f4ff">
            <td colspan="2" style="padding:8px 10px;font-weight:800">Total</td>
            <td style="padding:8px 10px;text-align:right;font-weight:800;color:#1a3a5c">${totalWorkerHours}</td>
        </tr>`;
    }
    if (!workerHtml) workerHtml = `<tr><td colspan="3" style="padding:12px 10px;color:#aaa;font-style:italic">No worker hours logged this week.</td></tr>`;
    const workerSection = `
        <div style="page-break-inside:avoid">
        <h2 style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:#1a3a5c;margin:24px 0 10px;border-top:2px solid #1a3a5c;padding-top:10px">Worker Hours</h2>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="background:#1a3a5c;color:white">
                <th style="padding:8px 10px;text-align:left">Name</th>
                <th style="padding:8px 10px;text-align:left">Trade</th>
                <th style="padding:8px 10px;text-align:right">Hours</th>
            </tr></thead>
            <tbody>${workerHtml}</tbody>
        </table></div>`;

    // ── Compile week data for Claude recap ───────────────────────────────────
    const laborLines = [];
    (state.floors || []).forEach(floor => {
        (floor.items || []).forEach(item => {
            const entries = (item.hoursLog || []).filter(e => inRange(e.date));
            if (!entries.length) return;
            entries.forEach(e => {
                const d = entryDisplay(e);
                laborLines.push(`${floor.name} — ${item.name}: ${d.skilled} skilled × ${d.skilledHours}h + ${d.laborer} laborer × ${d.laborerHours || 0}h on ${displayDate(e.date)}`);
            });
        });
    });

    const attLines = [];
    (state.attendance || []).filter(a => inRange(a.date)).sort((a,b) => a.date.localeCompare(b.date)).forEach(a => {
        const names = (a.workerIds || []).map(id => { const w = findWorker(id); return w ? w.name : null; }).filter(Boolean);
        attLines.push(`${displayDate(a.date)}: ${names.join(', ')} (${names.length} on site)`);
    });

    const notesLines = [];
    (state.attendance || []).filter(a => inRange(a.date)).sort((a,b) => a.date.localeCompare(b.date)).forEach(a => {
        const nr = (state.reports || {})[a.date];
        if (nr?.notes) notesLines.push(`${displayDate(a.date)}: "${nr.notes}"`);
    });

    const floorStatusLines = [];
    (state.floors || []).forEach(floor => {
        const itemSummary = (floor.items || []).map(i => `${i.name} (${i.status})`).join(', ');
        if (itemSummary) floorStatusLines.push(`${floor.name}: ${itemSummary}`);
    });

    // ── Floor status snapshot ────────────────────────────────────────────────
    let floorStatusHtml = '';
    (state.floors || []).forEach(floor => {
        const items = floor.items || [];
        const done    = items.filter(i => i.status === 'done').length;
        const active  = items.filter(i => i.status === 'active').length;
        const pending = items.filter(i => i.status === 'pending').length;
        if (done === 0 && active === 0) return; // floor not started yet
        const total   = items.length;
        const pct     = total ? Math.round((done / total) * 100) : 0;
        const activeItems = items.filter(i => i.status === 'active').map(i => i.name).join(', ');
        floorStatusHtml += `<tr>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;font-weight:600;white-space:nowrap">${floor.name}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:center;color:#16a34a;font-weight:700">${done}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:center;color:#d97706;font-weight:700">${active}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:center;color:#9ca3af">${pending}</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:center;font-weight:700;color:#1a3a5c">${pct}%</td>
            <td style="padding:8px 10px;border-bottom:1px solid #eee;font-size:11px;color:#555">${activeItems || '—'}</td>
        </tr>`;
    });
    const floorStatusSection = floorStatusHtml ? `
        <div style="page-break-inside:avoid">
        <h2 style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:#1a3a5c;margin:24px 0 10px;border-top:2px solid #1a3a5c;padding-top:10px">Floor Status</h2>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="background:#1a3a5c;color:white">
                <th style="padding:8px 10px;text-align:left">Floor</th>
                <th style="padding:8px 10px;text-align:center">Items Done</th>
                <th style="padding:8px 10px;text-align:center">Items Active</th>
                <th style="padding:8px 10px;text-align:center">Items Pending</th>
                <th style="padding:8px 10px;text-align:center">% Complete</th>
                <th style="padding:8px 10px;text-align:left">Items In Progress</th>
            </tr></thead>
            <tbody>${floorStatusHtml}</tbody>
        </table></div>` : '';

    // ── Low stock ────────────────────────────────────────────────────────────
    const isLow = m => { const s = matCurrentStock(m); return s !== null && m.parQty > 0 && s < m.parQty; };
    const lowMats = (state.materials || []).filter(isLow);
    let lowHtml = lowMats.length === 0
        ? `<p style="color:#aaa;font-style:italic;font-size:13px">All materials above minimum stock.</p>`
        : lowMats.map(m => {
            const s = matCurrentStock(m);
            return `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:13px">
                <span style="font-weight:600;color:#1a1a2e">${m.name} <span style="font-weight:400;color:#888">(${m.trade||''})</span></span>
                <span style="color:#dc2626;font-weight:700">${s} / ${m.parQty} ${m.unit}${m.reorderQty > 0 ? ' — order ' + m.reorderQty : ''}</span>
            </div>`;
          }).join('');
    const lowSection = `
        <h2 style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:#dc2626;margin:24px 0 10px;border-top:2px solid #dc2626;padding-top:10px">⚠ Low Stock</h2>
        ${lowHtml}`;

    const buildHTML = (recapText) => {
        const recapSection = `
            <h2 style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:#1a3a5c;margin:24px 0 10px;border-top:2px solid #1a3a5c;padding-top:10px">Weekly Recap</h2>
            <p style="font-size:13px;line-height:1.7;color:#333">${recapText || 'No recap available.'}</p>`;
        return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Weekly Summary ${label}</title>
        <style>* { box-sizing:border-box; margin:0; padding:0; } body { font-family:Arial,sans-serif; font-size:13px; color:#111; padding:28px; max-width:700px; margin:0 auto; }
        h1 { font-size:20px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#1a3a5c; margin-bottom:4px; }
        .meta { font-size:12px; color:#666; margin-bottom:8px; }
        tbody tr:nth-child(even) td { background:#f9fbff; }
        .close-btn{display:block;margin-bottom:16px;padding:10px 24px;background:none;border:1.5px solid #d1d5db;border-radius:99px;font-size:13px;color:#6b7280;cursor:pointer;width:fit-content}
        @media print { body { padding:16px; } .close-btn { display:none; } }</style></head><body>
        <button class="close-btn" onclick="window.close()">✕ Close</button>
        <h1>Corridor's Plus — Weekly Summary</h1>
        <div class="meta">Week of ${label}</div>
        <div class="meta">Generated: ${displayDate(today())}</div>
        ${recapSection}${floorStatusSection}${workerSection}${laborSection}
        <script>window.onload = () => window.print();<\/script></body></html>`;
    };

    const gasUrl = localStorage.getItem('hallway_sheets_url');
    if (gasUrl && (laborLines.length > 0 || attLines.length > 0)) {
        // Open window NOW while we still have the user's click (async callbacks can't open windows)
        const win = window.open('', '_blank');
        win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Generating…</title>
        <style>body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;background:#f8fafc}
        .spinner{width:40px;height:40px;border:4px solid #e5e7eb;border-top-color:#1a3a5c;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px}
        @keyframes spin{to{transform:rotate(360deg)}}
        p{color:#1a3a5c;font-size:15px;font-weight:600}
        small{color:#9ca3af;font-size:12px;margin-top:6px}
        .close-btn{margin-top:28px;padding:10px 24px;background:none;border:1.5px solid #d1d5db;border-radius:99px;font-size:13px;color:#6b7280;cursor:pointer}</style></head>
        <body><div class="spinner"></div><p>Generating Weekly Summary…</p><small>Claude is writing your recap</small>
        <button class="close-btn" onclick="window.close()">✕ Close</button></body></html>`);
        win.document.close();
        const toast = _showSyncToast('✦ Claude is writing your recap…');
        const load = (recapText) => { win.document.write(buildHTML(recapText)); win.document.close(); };
        fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({
                type: 'weekly_recap',
                weekData: {
                    label,
                    labor:       laborLines.join('\n') || 'None',
                    attendance:  attLines.join('\n')   || 'None',
                    notes:       notesLines.join('\n') || 'None',
                    floorStatus: floorStatusLines.join('\n') || 'None',
                }
            })
        })
        .then(r => r.json())
        .then(res => { toast.style.opacity = '0'; load(res.recap || ''); })
        .catch(() => { toast.style.opacity = '0'; load(''); });
    } else {
        window.open(URL.createObjectURL(new Blob([buildHTML('')], { type: 'text/html' })), '_blank');
    }
}

// ── Materials export ──────────────────────────────────────────────────────────
function openMaterialsExportModal() {
    openModal('Export Materials Report', `
        <div class="form-group">
            <label>Format</label>
            <select id="mexp_format">
                <option value="pdf">PDF (Print / Save)</option>
                <option value="csv">CSV (Spreadsheet)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Report Period</label>
            <select id="mexp_period" onchange="updateMatExportFields()">
                <option value="all">All Time</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
        </div>
        <div id="mexp_fields"></div>
    `, () => {
        const format = document.getElementById('mexp_format').value;
        const period = document.getElementById('mexp_period').value;
        let start, end, label;

        if (period === 'daily') {
            const d = document.getElementById('mexp_date').value;
            start = d; end = d; label = displayDate(d);
        } else if (period === 'weekly') {
            const d   = new Date(document.getElementById('mexp_week').value + 'T00:00:00');
            const day = d.getDay();
            const sun = new Date(d); sun.setDate(d.getDate() - day);
            const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
            start = sun.toISOString().slice(0,10);
            end   = sat.toISOString().slice(0,10);
            label = `${displayDate(start)} – ${displayDate(end)}`;
        } else if (period === 'monthly') {
            const val = document.getElementById('mexp_month').value;
            start = `${val}-01`;
            const last = new Date(val.split('-')[0], val.split('-')[1], 0);
            end   = last.toISOString().slice(0,10);
            const mo = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            label = `${mo[parseInt(val.split('-')[1])-1]} ${val.split('-')[0]}`;
        } else {
            start = '2000-01-01'; end = '2099-12-31'; label = 'All Time';
        }

        const inRange = d => d >= start && d <= end;
        if (format === 'pdf') exportMaterialsPDF(inRange, label);
        else exportMaterialsCSV(inRange, label);
    });
}

function updateMatExportFields() {
    const period = document.getElementById('mexp_period').value;
    const el = document.getElementById('mexp_fields');
    if (period === 'daily')   el.innerHTML = `<div class="form-group"><label>Date</label><input id="mexp_date" type="date" value="${today()}" /></div>`;
    else if (period === 'weekly')  el.innerHTML = `<div class="form-group"><label>Any date in the week</label><input id="mexp_week" type="date" value="${today()}" /></div>`;
    else if (period === 'monthly') el.innerHTML = `<div class="form-group"><label>Month</label><input id="mexp_month" type="month" value="${today().slice(0,7)}" /></div>`;
    else el.innerHTML = '';
}

function _matLogInRange(mat, inRange) {
    return (mat.log||[])
        .filter(e => (e.type === 'delivery' || e.type === 'adjust') && inRange(e.date))
        .sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
}

function exportMaterialsPDF(inRange, label) {
    const mats = state.materials.filter(m => _matLogInRange(m, inRange).length > 0);
    if (mats.length === 0) { alert('No data in this period.'); return; }

    let bodyHtml = '';
    mats.forEach(mat => {
        const entries = _matLogInRange(mat, inRange);
        if (entries.length === 0) return;
        const totalDel = entries.filter(e => e.type === 'delivery').reduce((s,e) => s+e.qty, 0);
        const rows = [...entries].reverse().map(e => {
            const isAdj = e.type === 'adjust';
            return `<tr>
                <td>${displayDate(e.date)}</td>
                <td>${isAdj ? '—' : '+'+e.qty}</td>
                <td>${isAdj ? '= '+e.qty : '—'}</td>
            </tr>`;
        }).join('');
        bodyHtml += `<div style="margin-bottom:32px">
            <div style="font-size:15px;font-weight:800;text-transform:uppercase;color:#1a3a5c;border-top:2px solid #1a3a5c;padding-top:6px;margin-bottom:8px">

                ${mat.trade ? `<span style="font-weight:400;font-size:12px;color:#999"> · ${mat.trade}</span>` : ''}
            </div>
            <table style="width:100%;border-collapse:collapse;font-size:12px">
                <thead><tr style="background:#1a3a5c;color:white">
                    <th style="padding:8px 10px;text-align:left">Date</th>
                    <th style="padding:8px 10px;text-align:left">Delivered</th>
                    <th style="padding:8px 10px;text-align:left">Count Update</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
            <div style="text-align:right;margin-top:8px;font-size:13px;font-weight:700;color:#1a3a5c">
                Total Delivered: ${totalDel} ${mat.unit}
            </div>
        </div>`;
    });

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Material Report</title>
    <style>* { box-sizing:border-box; margin:0; padding:0; } body { font-family:Arial,sans-serif; font-size:12px; color:#111; padding:32px; }
    h1 { font-size:20px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#1a3a5c; margin-bottom:4px; }
    .meta { font-size:12px; color:#666; margin-bottom:24px; }
    tbody tr:nth-child(even) { background:#f5f8ff; } tbody td { padding:7px 10px; border-bottom:1px solid #eee; }
    @media print { body { padding:16px; } }</style></head><body>
    <h1>Corridor's Plus — Material Inventory Report</h1>
    <div class="meta">Period: ${label} &nbsp;·&nbsp; Generated: ${displayDate(today())}</div>
    ${bodyHtml}
    <script>window.onload = () => window.print();<\/script></body></html>`;

    window.open(URL.createObjectURL(new Blob([html], { type: 'text/html' })), '_blank');
}

function exportMaterialsCSV(inRange, label) {

    state.materials.forEach(mat => {
